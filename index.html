{q:"On an exposed stretch of road, such as a bridge, in strong side winds, you should:",options:["Keep a firm grip on the wheel and increase your margin from other vehicles, especially high-sided ones","Speed up to cross the exposed section as quickly as possible","Drive closer to the vehicle ahead for shelter from the wind","Ignore any wind warning signs, as they rarely apply"],correct:0,explain:"Gusts on exposed sections can push a vehicle sideways without warning, so extra space and firm steering control reduce the risk."},
{q:"Approaching a hump bridge or dip in the road, what should you consider for your safety margin?",options:["Nothing, you should treat it exactly like a flat road","Slow down, as your suspension and view of the road ahead may be affected","Speed up to maintain momentum over the hump","This only matters for motorcyclists, not car drivers"],correct:1,explain:"A hump or dip can briefly reduce your view ahead and unsettle the car's suspension, so reducing speed keeps a safer margin."},
{q:"What is the safest way to maintain a good safety margin when you spot a hazard developing ahead?",options:["Brake sharply at the last possible moment","Ease off the accelerator and adjust your speed early, keeping your distance","Maintain full speed until you are very close to the hazard","Flash your headlights instead of slowing down"],correct:1,explain:"Reacting early by easing off keeps your options open and your margin intact, rather than relying on a late, sharp manoeuvre."},
{q:"When joining a motorway from a slip road, how should you manage your safety margin?",options:["Match your speed to the traffic flow before merging into a safe gap","Join at a much lower speed than the traffic already on the motorway","Stop at the end of the slip road and wait for a gap","Merge immediately regardless of the gaps available"],correct:0,explain:"Matching your speed to the flow of traffic lets you merge into a suitable gap without forcing other vehicles to brake sharply."},
]},
{id:"hazard-awareness",name:"Hazard Awareness",
notes:[
"A hazard is anything that might require you to change speed, position or direction. Look well ahead to spot developing hazards early, not just react to immediate ones.",
"Alcohol, drugs — including some prescription and over-the-counter medicines — and fatigue all slow your reactions and reduce your ability to judge hazards accurately.",
"Your reaction time to a hazard is the \"thinking distance\" part of your overall stopping distance; it lengthens with tiredness, distraction or impairment.",
"Classic sources of developing hazards include junctions, parked cars (a door opening, or a pedestrian stepping out between vehicles) and sudden changes in road layout.",
"The drink-drive limit is 80mg of alcohol per 100ml of blood in England, Wales and Northern Ireland, but only 50mg per 100ml in Scotland — and even small amounts can impair judgement below either limit.",
"Fog counts as \"seriously reduced visibility\" once you can't see more than about 100 metres. Use fog lights in these conditions, but switch them off as soon as visibility improves — they can dazzle other drivers.",
"Watch for hidden hazards at the brow of a hill, on blind bends, near bus stops and ice-cream vans, and around schools at drop-off and pick-up times.",
"Scan near, middle-distance and far ahead, and to the sides — don't fixate on one point, or you risk missing a hazard developing elsewhere (tunnel vision).",
"Yawning repeatedly, drifting in your lane, or not remembering the last few miles you've driven are all warning signs of fatigue — stop and rest rather than pushing on."
],
links:[
{label:"Highway Code: Rules for drivers and motorcyclists — fitness to drive (89–102)",url:"https://www.gov.uk/guidance/the-highway-code/rules-for-drivers-and-motorcyclists-89-to-102"},
{label:"Highway Code: General rules for all drivers and riders (103–158)",url:"https://www.gov.uk/guidance/the-highway-code/general-rules-techniques-and-advice-for-all-drivers-and-riders-103-to-158"}
],
questions:[
{q:"What is a \"developing hazard\"?",options:["Something that has already caused a collision","A situation building up ahead that may require you to change speed, position or direction","Something that only applies to weather","Something that only applies on motorways"],correct:1,explain:"Spotting a hazard while it's still developing gives you far more time to respond safely."},
{q:"Why do medicines, even over-the-counter ones, matter for hazard awareness?",options:["They never affect driving","Some cause drowsiness or slow reactions, increasing risk","Only prescription drugs matter","Only matters if you feel drunk"],correct:1,explain:"Always check the label or ask a pharmacist whether a medicine affects your ability to drive safely."},
{q:"You see a line of parked cars ahead on your side of the road. What should you anticipate?",options:["Nothing unusual","A car door opening or a pedestrian stepping out from between them","That the road will definitely be clear","That you must stop completely"],correct:1,explain:"Parked cars often hide pedestrians or open doors — ease off and be ready to react."},
{q:"Thinking distance, part of your overall stopping distance, is affected most by:",options:["Tyre pressure","Your reaction time, which worsens with fatigue or distraction","The weather only","The car's engine size"],correct:1,explain:"Thinking distance is purely about how quickly you perceive and react to a hazard."},
{q:"Which of these is the best habit for spotting hazards early?",options:["Only looking at the car directly ahead","Scanning well ahead and to the sides, not just the bumper in front","Looking mainly in the mirrors","Focusing on the speedometer"],correct:1,explain:"A wide scanning habit picks up hazards while there's still time to respond calmly."},
{q:"Approaching a school at the end of the day, what should you expect?",options:["Nothing different from any other road","Children may be crossing or running into the road unexpectedly","Only buses will be present","No extra caution needed if there's a zebra crossing"],correct:1,explain:"Children can be unpredictable near schools — slow down and stay alert even away from a crossing."},
{q:"You're fatigued but only have a short distance left to drive. What should you do?",options:["Push on, it's nearly over","Still stop and rest if you feel your concentration slipping","Open a window instead of stopping","Increase speed to finish sooner"],correct:1,explain:"Fatigue-related lapses can happen in seconds — distance remaining doesn't reduce the risk."},
{q:"Which of these increases the risk of missing a developing hazard?",options:["Scanning the road ahead regularly","Tunnel vision from fixating on one point","Checking mirrors periodically","Anticipating junctions ahead"],correct:1,explain:"Fixating narrows your awareness and makes it easy to miss hazards developing elsewhere."},
{q:"You are driving in thick fog. Which of these should you do?",options:["Keep well back from the vehicle ahead and reduce your speed","Follow closely so you can see the vehicle's tail lights","Switch on full beam headlights for maximum light","Speed up to get through the fog quickly"],correct:0,explain:"Fog cuts visibility and extends safe stopping distances, while full beam reflects back off the fog and can reduce what you can see even further."},
{q:"Driving towards a low winter sun, glare makes it hard to see pedestrians at a crossing ahead. What should you do?",options:["Slow down and be prepared to stop, using a visor or sunglasses if needed","Keep your speed the same since the crossing is clearly marked","Sound your horn continuously to warn pedestrians","Close your eyes briefly until the glare passes"],correct:0,explain:"Low sun glare can hide pedestrians almost completely, so reducing speed and shielding your eyes gives you more time to react."},
{q:"On a cold, sunny day, which part of the road is most likely to remain icy even though most of the surface has thawed?",options:["The centre of a wide, open road","A section shaded by trees or buildings","The middle of a roundabout","A road surface covered in loose chippings"],correct:1,explain:"Shaded stretches stay below freezing for longer than sections exposed to the sun, so ice can linger there unseen."},
{q:"A school crossing patrol steps into the road and holds up their sign. What must you do?",options:["Stop and wait until the sign is lowered and the patrol has left the road","Slow down but continue driving if no children are visible","Sound your horn to show the patrol you have seen them","Proceed if the patrol is still standing on the pavement"],correct:0,explain:"The raised sign is a legal instruction to stop, and you must remain stopped until it is lowered and the crossing is clear."},
{q:"You are driving past a park and see children playing with a ball near the roadside. What should you anticipate?",options:["The ball or a child could suddenly enter the road","Children always stay well back from the kerb","This is only a hazard once a child is already in the road","Only the ball needs to be watched, not the children"],correct:0,explain:"Children chasing a ball often focus on the game rather than traffic, so a sudden dash into the road is a real possibility."},
{q:"You notice mud spread across the road surface near a farm gateway. Why is this a hazard?",options:["It has no effect on grip in dry weather","It can make the road slippery, especially once it is wet","It only affects cyclists, not cars","It improves tyre grip on bends"],correct:1,explain:"Mud deposited by farm vehicles reduces tyre grip, and the risk increases sharply once rain makes it slick."},
{q:"You are approaching a sharp, blind bend on a narrow country lane with no pavement. What is a sensible precaution?",options:["Accelerate to clear the bend quickly","Sound your horn and keep your speed low enough to stop within the distance you can see","Move onto the opposite side of the road for a better view","Flash your headlights and maintain full speed"],correct:1,explain:"On a blind bend you should be able to stop within the distance you can see ahead, and a horn can alert anyone hidden around the curve."},
{q:"You come up behind a slow-moving tractor on a narrow road with several blind bends ahead. What should you do?",options:["Overtake immediately regardless of visibility","Flash your lights repeatedly until the tractor pulls over","Stay back and only overtake when you can see the road is clear far enough ahead","Sound your horn repeatedly to pressure the driver to speed up"],correct:2,explain:"Blind bends hide oncoming traffic, so you should be patient and only overtake once you have a clear, sufficient view ahead."},
{q:"As you come round a bend, you see brake lights ahead indicating traffic has stopped. What should you do?",options:["Brake gently early and be ready to stop well back from the queue","Ignore the lights until you are much closer","Swerve into the other lane to avoid slowing down","Maintain your speed since queues usually clear quickly"],correct:0,explain:"Easing off early and leaving space reduces the risk of a rear-end collision if the queue turns out to be longer than expected."},
{q:"You are stationary in a long queue of traffic. Why should you check your mirrors carefully before moving off or changing lanes?",options:["Motorcyclists may be filtering between the lines of traffic","Mirrors are only needed when reversing","Other vehicles in a queue cannot move at all","Checking mirrors is only required on motorways"],correct:0,explain:"Motorcyclists often filter past queued traffic, so a mirror check helps avoid pulling across their path unexpectedly."},
{q:"At night, you see a vehicle parked at the roadside with no lights showing. What should you do?",options:["Assume it is empty and pass closely at normal speed","Give it plenty of room in case a door opens or someone steps out","Flash your headlights and continue without slowing","Sound your horn as you pass"],correct:1,explain:"An unlit parked vehicle is hard to judge in the dark, and you cannot be sure no one is about to open a door or step out."},
{q:"Why can cyclists be particularly difficult to see on an unlit road at night?",options:["Cyclists are not permitted to ride after dark","Their lights and any reflective clothing may be limited, making them hard to spot against dark surroundings","Bicycles always have reflectors as bright as car headlights","Cyclists are required to use hazard lights at night"],correct:1,explain:"A bicycle's lighting is much smaller and dimmer than a car's, so riders can blend into dark backgrounds until you are quite close."},
{q:"You are approaching roadworks with a temporary speed limit sign displayed. What should you do?",options:["Ignore it if no workers are currently visible","Reduce your speed to the limit shown and watch for workers and machinery","Only slow down if other vehicles are slowing","Treat the limit as advisory rather than compulsory"],correct:1,explain:"Temporary speed limits at roadworks are legally enforceable and reflect narrowed lanes, workers and machinery close to the carriageway."},
{q:"Roadworks have reduced the road to a single lane controlled by temporary traffic lights. What extra hazard should you be aware of?",options:["Oncoming traffic using the same lane once the lights change","The lights will never show red","No vehicles can possibly be oncoming while the lights operate","You may ignore a red light if the road ahead looks clear"],correct:0,explain:"At single-lane roadworks, oncoming traffic shares the same narrow stretch once it gets a green light, so you must wait for your own signal."},
{q:"You see a wildlife warning sign showing a deer on a road running through woodland. What does this warn you about?",options:["Deer or other wild animals may cross the road suddenly","The road surface has been damaged by animals","Hunting is currently taking place ahead","A petting zoo is located nearby"],correct:0,explain:"This sign warns that wild animals, such as deer, may dash across the carriageway, especially around dawn and dusk."},
{q:"You approach horse riders on a quiet country road. What should you do?",options:["Pass closely and quickly to minimise time near the horses","Slow down, give them plenty of room and be prepared to stop","Sound your horn to warn them you are approaching","Rev your engine so the rider knows you are there"],correct:1,explain:"Horses can be startled by close, fast passing or sudden noise, so slow, wide, quiet passing reduces the risk of the animal bolting."},
{q:"Which technique helps you notice hazards developing to the sides of the road, not just straight ahead?",options:["Fixing your eyes on the vehicle directly in front","Moving your eyes regularly to scan the whole scene, including the sides and mirrors","Looking only at your speedometer","Staring at the white line in the middle of the road"],correct:1,explain:"A moving scan of the whole scene picks up hazards emerging from junctions, pavements and verges that a fixed gaze would miss."},
{q:"Why is following another vehicle too closely a hazard for you, the following driver?",options:["It has no real effect on your ability to react","It reduces the time and space you have to react if the vehicle ahead brakes suddenly","It improves your view of hazards further ahead","It only matters when driving on motorways"],correct:1,explain:"Tailgating leaves little margin if the vehicle in front brakes sharply, increasing the risk of a collision."},
{q:"You are following a large lorry that blocks your view of the road ahead. What should you do?",options:["Move closer so you can see around it sooner","Drop back enough to improve your view and give yourself more time to react","Overtake immediately regardless of visibility ahead","Flash your headlights so the lorry moves over"],correct:1,explain:"Dropping back increases your sightline past the lorry and gives you more time to spot hazards such as queuing traffic or junctions."},
{q:"You are about to overtake a large van on a two-way road. Why might this be riskier than overtaking a car?",options:["Large vehicles always travel faster than cars","Its size can hide oncoming traffic or hazards until you are already committed to overtaking","Large vehicles are not allowed on two-way roads","It has no effect on your view of the road ahead"],correct:1,explain:"A large vehicle's bulk can block your view of what is coming the other way, so you may not see a hazard until it's too late to abort safely."},
{q:"You are driving towards the brow of a hill where you cannot see the road beyond. What should you assume?",options:["The road ahead is clear since you cannot see a hazard","There could be a hazard just beyond your view, so adjust your speed and position","Only pedestrians could possibly be beyond the brow","You should move onto the opposite side for a better view"],correct:1,explain:"A blind summit can hide anything from a stationary vehicle to oncoming traffic, so you should be ready to react."},
{q:"A sign warns of a hump bridge ahead on a narrow road. What should you do?",options:["Speed up to clear the bump smoothly","Slow down, since the road beyond the bridge cannot be seen and may be narrow or occupied","Sound your horn and maintain your speed","Move to the middle of the road to get a better view"],correct:1,explain:"A hump bridge can hide an oncoming vehicle or a dip in the road, so reducing speed gives you time to react once you see over it."},
{q:"In heavy rain, a lorry ahead throws up spray that reduces your visibility. What should you do?",options:["Drop back further and reduce your speed","Move closer so you can see past the spray","Switch off your headlights to see better","Overtake quickly to escape the spray"],correct:0,explain:"Increasing your following distance in spray gives you a clearer view and more time to react, since visibility and grip are both reduced."},
{q:"On an exposed road in strong winds, why should you keep extra distance from high-sided vehicles?",options:["They are not affected by crosswinds at all","A sudden gust could push them, or you, off course","They always travel more slowly in windy conditions","Wind has no real effect on vehicle stability"],correct:1,explain:"High-sided vehicles have a large side area that can be buffeted by gusts, particularly near bridges or gaps in trees, so extra space is sensible."},
{q:"You are approaching a bend where you cannot see the road beyond. Why should you reduce your speed before entering it?",options:["So you can stop safely if there is an unseen hazard around the bend","So other drivers think you are being cautious","To save fuel on the approach","Speed has no real bearing on how you cope with bends"],correct:0,explain:"Slowing before a blind bend means you can still stop or steer safely if something unexpected, like a stopped vehicle, is just around it."},
{q:"You are approaching a stationary bus at a bus stop. What hazard should you anticipate?",options:["A pedestrian may step out from in front of or behind the bus","Buses never let hazards develop near them","The bus will always indicate before anyone crosses","There is no need to slow down since the bus is not moving"],correct:0,explain:"Passengers getting off a bus sometimes cross the road without checking traffic, so caution is needed as you pass."},
{q:"You see an ice cream van parked with its serving window facing the road and children nearby. What should you do?",options:["Drive past at normal speed since the van is stationary","Slow down and watch for children who may run out from around the van","Sound your horn so the children move away","Only slow down once a child is already in the road"],correct:1,explain:"Children's attention is often on the van rather than traffic, so they may dash out from in front of or behind it without looking."},
{q:"In gusty, windy conditions, why should you give cyclists extra room when overtaking?",options:["Cyclists are unaffected by wind","A gust of wind could blow the cyclist off their intended line","Cyclists always ride in a perfectly straight line in wind","Extra room is only needed for motorcyclists, not cyclists"],correct:1,explain:"A sudden gust, especially near gaps in hedges or passing large vehicles, can push a cyclist sideways into your path."},
{q:"Before pulling out at a roundabout, why should you take extra care to check for motorcyclists?",options:["Motorcycles are not permitted on roundabouts","Their smaller size can make them easy to miss or hide in a blind spot","Motorcyclists always have priority regardless of position","Mirrors are not required when approaching a roundabout"],correct:1,explain:"A motorcycle presents a much smaller profile than a car, so it can be overlooked or hidden in a blind spot if you don't look carefully."},
{q:"You are approaching a level crossing and the amber light begins flashing. What should you do?",options:["Speed up to cross before the barriers lower","Stop, unless you have already crossed the stop line and it is unsafe to stop","Ignore it if no train is visible","Reverse away from the crossing immediately"],correct:1,explain:"A flashing amber signal, followed by red, means a train is approaching, so you must stop unless you've already passed the stop line."},
{q:"You spot a developing hazard ahead and decide you need to change lanes to deal with it safely. What should you do before manoeuvring?",options:["Signal first, then check your mirrors afterwards","Check your mirrors, signal if needed, then manoeuvre only when it is safe","Manoeuvre immediately and signal once you are moving","There is no need to check mirrors if you have already seen the hazard ahead"],correct:1,explain:"The mirrors-signal-manoeuvre routine ensures you know what is around you and warn others before you change position."},
{q:"At dusk, other road users become harder to see even though it is not yet fully dark. What should you do?",options:["Wait until it is completely dark before switching on headlights","Switch on your headlights early to help others see you","Use hazard warning lights instead of headlights","Only switch on your rear lights"],correct:1,explain:"Using headlights before it's fully dark makes your vehicle visible sooner, since fading light can make judging distances and spotting hazards harder."},
]},
{id:"vulnerable-road-users",name:"Vulnerable Road Users",
notes:[
"The Highway Code's hierarchy of road users places those most at risk — pedestrians, especially children, older people and disabled people, then cyclists, then horse riders and motorcyclists — at the centre of other road users' care and consideration.",
"When overtaking a cyclist, leave at least 1.5 metres of space at speeds up to 30mph, and more room at higher speeds; be ready to slow down and wait behind them if there isn't room.",
"Once a pedestrian has stepped onto a zebra crossing, they have priority and traffic must stop; at a junction, pedestrians who have started to cross have priority over a vehicle turning in or out of that junction.",
"Give horse riders and horse-drawn vehicles plenty of room and pass slowly — a startled horse is unpredictable and can be dangerous.",
"Toucan crossings let pedestrians and cyclists cross together under one signal; puffin crossings use sensors instead of a fixed flashing-amber phase; a zebra crossing with a central refuge island counts as two separate crossings.",
"Advanced stop lines (cycle boxes) at traffic lights reserve space for cyclists ahead of other traffic — stop at the rear line and never pull into the box.",
"A plain white cane usually means a pedestrian is blind or partially sighted; a white cane with red bands means they are deafblind — they may not see or hear you approaching.",
"Mobility scooters come in two classes: Class 2 is pavement-only at around 4mph; Class 3 can use the road at up to 8mph and must show a flashing amber beacon when used on a dual carriageway.",
"Motorcyclists may legally filter between queued or slow-moving traffic — always check mirrors and blind spots before changing lane or opening a door in traffic.",
"Children playing near parks, schools or ice-cream vans can run into the road without warning, often without checking for traffic first."
],
links:[
{label:"Highway Code: Road users requiring extra care (204–225)",url:"https://www.gov.uk/guidance/the-highway-code/road-users-requiring-extra-care-204-to-225"}
],
questions:[
{q:"Under the Highway Code's hierarchy of road users, who holds the greatest responsibility to reduce danger to others?",options:["Pedestrians","Cyclists","Those driving vehicles that can cause the greatest harm, such as cars and lorries","Horse riders"],correct:2,explain:"The more harm a vehicle could cause, the greater the responsibility on its driver to take care."},
{q:"What minimum space should you leave when overtaking a cyclist at speeds up to 30mph?",options:["0.5 metres","1 metre","1.5 metres","No specific distance is needed"],correct:2,explain:"At least 1.5 metres gives a cyclist room to wobble or avoid a pothole without being clipped."},
{q:"A pedestrian has just stepped onto a zebra crossing. You should:",options:["Continue if you have priority on the main road","Stop and allow them to cross","Sound your horn to hurry them","Only stop if they are halfway across"],correct:1,explain:"A pedestrian on a zebra crossing has priority — you must stop."},
{q:"You're turning into a side road and a pedestrian has started to cross it. Who has priority?",options:["You, because you're already turning","The pedestrian, who should be allowed to finish crossing","Whoever arrived first","Neither — it's a 50/50 decision"],correct:1,explain:"A pedestrian already crossing the road you're turning into keeps priority over your turn."},
{q:"Why should you give motorcyclists extra consideration at junctions?",options:["They are not vulnerable","Their smaller size makes them easy to misjudge for speed and distance","They always have less priority","They are only at risk on motorways"],correct:1,explain:"A motorcycle's narrow profile makes it harder to judge how fast it's approaching and how far away it is."},
{q:"Approaching a horse and rider from behind, you should:",options:["Sound your horn to alert them","Pass as close and fast as possible","Slow down, leave plenty of room, and pass wide and slowly","Flash your headlights"],correct:2,explain:"A calm, wide, slow pass reduces the chance of startling the horse."},
{q:"Why might a cyclist move away from the kerb before a junction?",options:["They are being inconsiderate","To make themselves more visible and avoid being cut up","It's against the rules","To let cars overtake"],correct:1,explain:"Riding further from the kerb helps a cyclist be seen and avoids being squeezed at the junction."},
{q:"An older or disabled pedestrian is slow to cross at a junction you're waiting to turn into. You should:",options:["Edge forward to encourage them to hurry","Wait patiently until they have crossed safely","Sound your horn","Proceed carefully around them"],correct:1,explain:"Allow extra time without pressuring them — their safety comes before your convenience."},
{q:"You're driving through a 'shared space' street scheme where the pavement and road aren't clearly separated. You should:",options:["Drive at your normal speed since pedestrians must look out for you","Slow right down and be ready to stop, as pedestrians may step out from any direction","Sound your horn continuously to clear a path","Only slow down once a pedestrian makes eye contact with you"],correct:1,explain:"In shared spaces there's no clear separation between pedestrians and traffic, so low speed and readiness to stop are essential for safety."},
{q:"A cycle lane is marked by a broken white line along the road. What does this mean?",options:["You must never enter it under any circumstances","It's advisory, so you shouldn't enter it unless unavoidable and it's clear of cyclists","It is for bus use only","It becomes a mandatory lane after dark"],correct:1,explain:"A broken line marks an advisory cycle lane, which drivers should avoid using but aren't legally barred from entering briefly if necessary."},
{q:"A cycle lane is marked by a solid white line along the road, with times of operation shown on a sign. What does this mean?",options:["You may park there outside rush hour","You must not drive or park in it during its times of operation","It's only a suggestion, like an advisory lane","Buses and taxis may ignore the restriction at any time"],correct:1,explain:"A solid line marks a mandatory cycle lane, which drivers and parked vehicles must keep clear during its stated hours."},
{q:"You stop at a red traffic light and see a cyclist waiting in an advanced stop line (cycle box) ahead of the normal stop line. You should:",options:["Edge into the box so you can see past the cyclist","Stop at the first stop line and wait behind it","Pull up alongside the cyclist inside the box","Sound your horn so the cyclist moves to one side"],correct:1,explain:"The advanced stop line reserves space for cyclists to wait ahead of other traffic, so drivers must stop at the rear line and not enter the box."},
{q:"What makes a toucan crossing different from an ordinary pedestrian crossing?",options:["It has no signals for traffic at all","Cyclists and pedestrians can cross together, both facing the same signal","It can only be used by horse riders","There is never a red signal for traffic"],correct:1,explain:"A toucan crossing (\"two can cross\") is designed to let pedestrians and cyclists cross side by side under one signal."},
{q:"How does a puffin crossing work differently from a pelican crossing?",options:["A puffin crossing has no stop line for traffic","Sensors detect pedestrians waiting or crossing, and there's no flashing amber phase for traffic","A puffin crossing is only installed on dual carriageways","Pedestrians at a puffin crossing never need to use a push button"],correct:1,explain:"Puffin crossings use detector sensors and go straight from red to green for traffic, omitting the flashing amber phase found at pelican crossings."},
{q:"You're approaching a pelican crossing and the amber light begins flashing. What must you do?",options:["Stop and wait for the signal to turn green before moving again","Give way to any pedestrians still on the crossing, then proceed if it's clear","Treat it exactly like a steady green light and drive on without checking","Sound your horn to warn pedestrians to clear the crossing"],correct:1,explain:"A flashing amber at a pelican crossing means give way to pedestrians already crossing, but you may proceed once the crossing is clear."},
{q:"A zebra crossing has a central refuge island splitting it into two halves. How should each half be treated?",options:["As one combined crossing, so you only need to check one half","As two separate crossings, each considered on its own","Only the half nearer to you counts as a crossing","Only the far half counts as a crossing"],correct:1,explain:"A central island divides a zebra crossing into two independent crossings, so pedestrian priority applies separately to each half."},
{q:"A school crossing patrol steps into the road ahead and holds up a 'stop' sign. What must you do?",options:["Stop and remain stopped until the patrol lowers the sign and children have crossed","Only stop once you can actually see children on the road","Continue if no children are visible yet","Slow down but keep rolling forward slowly"],correct:0,explain:"A school crossing patrol's sign is a legal instruction to stop, and you must wait until it is withdrawn before moving off again."},
{q:"A pedestrian ahead is carrying a plain white cane. What does this usually indicate?",options:["They are a school crossing patrol officer","They are blind or partially sighted","They have dismounted from a bicycle","They are a council road inspector"],correct:1,explain:"A plain white cane is a recognised symbol used by people who are blind or have significant sight loss."},
{q:"A pedestrian is carrying a white cane with red reflective bands. What does this most likely indicate?",options:["They are deaf only, with normal sight","They are both deaf and blind","They work for the highways department","They are a learner pedestrian being supervised"],correct:1,explain:"A white cane marked with red bands signals that the person is deafblind, so they may not hear or see an approaching vehicle."},
{q:"You see a pedestrian being guided by a dog wearing a distinctive harness, waiting to cross. You should:",options:["Sound your horn to alert the dog","Be patient, as the person may not be aware you are there","Rev your engine so they hurry across","Drive on, since guide dogs always wait for a gap"],correct:1,explain:"The person may not be able to see or judge your approach, so patience and extra time are needed rather than noise to hurry them."},
{q:"A class 3 powered mobility scooter being used on the road is generally limited to a maximum speed of:",options:["4 mph","8 mph","15 mph","20 mph"],correct:1,explain:"Class 3 invalid carriages used on the carriageway are restricted to around 8 mph, slower than ordinary traffic."},
{q:"You're following a mobility scooter that is using the road because there's no pavement available. You should:",options:["Overtake immediately regardless of the space available","Flash your headlights to make them pull onto the verge","Stay back, be patient, and only overtake when there's plenty of room","Sound your horn repeatedly until they move aside"],correct:2,explain:"Mobility scooters are slow and low to the ground, so drivers should hold back and only pass when it can be done with plenty of clearance."},
{q:"You're driving past an ice cream van parked at the roadside with children nearby. Why should you take extra care?",options:["Ice cream vans must always give way to approaching traffic","Children may run out from around parked vehicles without checking for traffic","It is illegal to pass an ice cream van at any speed","The van's hazard lights mean the road ahead is closed"],correct:1,explain:"Children are often excited and may dash out from between parked vehicles near an ice cream van without looking for traffic."},
{q:"On a country road with no pavement, pedestrians walking after dark are generally advised to:",options:["Walk facing the oncoming traffic, usually keeping to the right-hand side","Walk with their backs to traffic on the left-hand side","Walk only in single file during daylight hours","Stay exactly in the centre of the carriageway"],correct:0,explain:"Facing oncoming traffic lets pedestrians see approaching vehicles and react, which is why this is the recommended advice at night."},
{q:"You approach a group of tourists who have stepped into the road to take photographs. You should:",options:["Sound your horn and drive through them slowly","Slow down or stop, waiting patiently until it's safe to proceed","Flash your headlights repeatedly until they move","Mount the pavement to get around them"],correct:1,explain:"Groups of pedestrians may be distracted and unaware of traffic, so stopping or slowing and waiting is the safest response."},
{q:"At a roundabout, a cyclist going straight ahead stays in the left-hand lane rather than moving towards the centre. You should:",options:["Overtake them quickly before reaching the roundabout","Allow them extra room and avoid rushing or cutting across them","Sound your horn to encourage them to change lane","Pass close on their right to save time"],correct:1,explain:"Cyclists are allowed to stay in the left lane right around a roundabout for safety, so drivers must give them space rather than cutting in."},
{q:"In slow-moving queued traffic, a motorcyclist filters past on the outside of the queue. You should:",options:["Deliberately move across to block them","Check your mirrors and blind spot before changing lane or position, as they may be filtering","Speed up so they can't get past","Open your door to warn them off"],correct:1,explain:"Motorcyclists are permitted to filter through slow traffic, so drivers must check carefully before changing position to avoid a collision."},
{q:"You're approaching a junction with a cyclist riding straight ahead just in front of you. Why should you avoid overtaking them right before the junction?",options:["Overtaking is always illegal within 50 metres of any junction","You could cut across the cyclist's path if you need to turn shortly after passing them","Cyclists are legally required to dismount at every junction","There's no real risk, since cyclists can see through car windows"],correct:1,explain:"Overtaking just before a junction risks a 'left-hook' style collision if you then need to turn across the cyclist's path."},
{q:"When passing a horse-drawn vehicle on the road, you should:",options:["Pass as closely as possible to save time","Treat it like a horse and rider, slowing down and giving plenty of room","Only pass once the driver waves you through","Flash your headlights before overtaking"],correct:1,explain:"Horse-drawn vehicles can be startled or destabilised by vehicles passing too closely or too fast, so the same caution as for horse riders applies."},
{q:"A horse rider ahead raises a hand, palm towards you, as you approach from behind. This most likely signals that they want you to:",options:["Stop completely and reverse away","Slow down","Overtake immediately without delay","Turn left at the next junction"],correct:1,explain:"Horse riders may use hand signals to ask following traffic to reduce speed, usually because the horse needs more time or space."},
{q:"A bus ahead has stopped with its hazard lights on and children are getting off. You should:",options:["Overtake quickly before any children reach the road","Slow right down and watch for children who may cross without looking","Sound your horn and pass close to the bus","Ignore it, as it's solely the bus driver's responsibility"],correct:1,explain:"Children leaving a bus can be hard to see and may step into the road without checking for traffic, so extra caution is needed."},
{q:"You plan to turn left just ahead and there's a cyclist travelling straight on close to your nearside. What's the main danger?",options:["The cyclist will always also turn left","You might cut across the cyclist's path if you turn without checking for them first","Cyclists aren't permitted to go straight on there","There's no danger as long as your indicator is on"],correct:1,explain:"A driver turning left can easily cut off a cyclist continuing straight ahead if they fail to check their nearside mirror and blind spot first."},
{q:"At night, why can pedestrians wearing dark clothing be particularly at risk?",options:["They are breaking a specific law against dark clothing","They are much harder for drivers to see, especially without reflective markings","Dark clothing dangerously reflects headlight glare back at drivers","Streetlights make clothing colour irrelevant everywhere"],correct:1,explain:"Dark clothing with no reflective detailing makes pedestrians far less visible in a driver's headlights, increasing the risk of a late reaction."},
{q:"Roadworks have closed the pavement, and a temporary route for pedestrians runs alongside the carriageway. You should:",options:["Ignore it, since pedestrians must find an alternative route themselves","Slow down and take extra care, as pedestrians may now be walking closer to traffic","Speed up to clear the roadworks area quickly","Sound your horn continuously while passing"],correct:1,explain:"A temporary pedestrian route next to live traffic reduces the usual separation from vehicles, so extra caution and reduced speed are needed."},
{q:"Before pulling out from a side road, why is it especially important to look carefully for motorcyclists?",options:["Motorcycles aren't required to use headlights in daylight","Their smaller size can make them harder to spot and their speed harder to judge","Motorcyclists always have automatic priority at every junction","Motorcyclists only ride at night"],correct:1,explain:"A motorcycle's narrower profile makes it easy to miss in a glance, and its speed can be deceptively hard to judge, raising the risk when emerging."},
{q:"You're driving along a street with vehicles parked on both sides. Why should you be especially alert for pedestrians?",options:["Parked vehicles can hide pedestrians who may step out from between them","Parked cars are legally required to have a lookout posted","Pedestrians cannot legally cross between parked vehicles","There's no extra risk as long as you're at the speed limit"],correct:0,explain:"Parked vehicles create blind spots that can conceal a pedestrian, particularly a child, until they step out into your path."},
{q:"You're turning into a driveway and a pedestrian is already crossing the pavement or dropped kerb you need to use. You should:",options:["Sound your horn and continue turning in","Give way and let the pedestrian finish crossing before you turn in","Edge forward slowly until they move aside","Only give way if the pedestrian is a child"],correct:1,explain:"Pedestrians crossing a driveway entrance have priority over a vehicle turning in, so the driver must wait for them to clear it."},
{q:"You're overtaking a cyclist on a road with tram tracks running along it. Why should you give them extra room?",options:["Cyclists deliberately ride along tram tracks for a smoother ride","They may need to steer away from the tracks, which can be slippery and trap a tyre","Tram tracks have no effect on cycling at all","You should actually pass closer near tram tracks to save space"],correct:1,explain:"Tram rails can be slippery and can catch a bicycle's tyre, so a cyclist may suddenly need to move to avoid them."},
{q:"A powered wheelchair or mobility scooter used on the road after dark should be fitted with:",options:["No lighting equipment is required at any time","Lights and reflectors so it can be seen by other road users","A horn and nothing else","Permanently flashing hazard warning lights"],correct:1,explain:"Like other road users, powered wheelchairs and scooters need lights and reflectors at night so drivers can see them in good time."},
{q:"An elderly pedestrian is crossing slowly in front of you at a zebra crossing. You should:",options:["Rev your engine or edge forward to encourage them to hurry","Wait patiently and allow them as much time as they need","Sound the horn once as a polite signal to speed up","Begin moving once roughly half the crossing is clear"],correct:1,explain:"Older pedestrians may need more time to cross, and a driver must wait without pressuring them until they have finished crossing safely."},
]},
{id:"other-vehicles",name:"Other Types of Vehicle",
notes:[
"Long vehicles need much more room to turn, often swinging wide or taking a different course just before a turn — don't try to fill a gap that opens up beside them.",
"Trams run on fixed rails and can't steer around you; they also often operate in areas with multiple crossing points and can be quieter than you expect.",
"Buses signalling to pull away from a stop should be given priority to do so where it's safe — look out for passengers who've just got off crossing the road.",
"Motorcyclists can filter between queued traffic; check mirrors and blind spots before changing lanes or opening a door, especially in slow traffic.",
"Goods vehicles over 7.5 tonnes are limited to 60mph on motorways and must not use the right-hand lane on a motorway with three or more lanes.",
"Beacon colours tell you what you're dealing with: blue for police, fire and ambulance; green for a doctor responding to an emergency; amber for a slow-moving, wide or breakdown recovery vehicle.",
"Bendy buses and articulated lorries can swing their rear or middle section into an adjoining lane on bends or at junctions — keep well back and give them room.",
"Give high-sided vehicles extra room in strong winds, as a gust can push them (or you) suddenly sideways, especially near bridges or gaps in trees and buildings.",
"A wide or long load is often escorted by a pilot vehicle with a flashing beacon — follow its signals rather than trying to overtake at the first small gap."
],
links:[
{label:"Highway Code: Road users requiring extra care — other vehicles (204–225)",url:"https://www.gov.uk/guidance/the-highway-code/road-users-requiring-extra-care-204-to-225"},
{label:"Highway Code: Road works, level crossings and tramways (288–307)",url:"https://www.gov.uk/guidance/the-highway-code/road-works-level-crossings-and-tramways-288-to-307"}
],
questions:[
{q:"A long lorry ahead signals left but moves out to the right first. What should you do?",options:["Overtake quickly on the left","Hold back and wait — it needs the extra room to turn","Sound your horn","Assume it made a mistake and overtake on the right"],correct:1,explain:"Long vehicles often swing out before turning in the opposite direction — give them space."},
{q:"Why can't a tram simply steer around an obstruction?",options:["Trams can steer like buses","Trams run on fixed rails and cannot change direction","Trams always have right of way everywhere","Trams are not allowed near traffic"],correct:1,explain:"Being rail-bound, a tram relies entirely on other road users keeping its path clear."},
{q:"A bus ahead signals to pull out from a stop. You should:",options:["Accelerate to pass before it pulls out","Give way if you can do so safely","Flash your headlights to warn it off","Ignore the signal"],correct:1,explain:"Letting a bus pull away safely is both courteous and often required by signs at bus stops."},
{q:"In slow-moving queued traffic, you should check mirrors and blind spots before changing lanes because:",options:["It's only a formality","Motorcyclists may be filtering between the lanes","Queued traffic never has motorcyclists nearby","Only required on motorways"],correct:1,explain:"Motorcyclists often filter past stationary or slow traffic, so an unchecked lane change can cut them off."},
{q:"What's a sensible approach when following a long vehicle on a bend?",options:["Overtake as soon as there's any gap","Stay back, since your view ahead is restricted and the vehicle needs room","Drive alongside it","Flash your lights to make it move over"],correct:1,explain:"A long vehicle blocks your view of the road ahead and may need the full width of its lane on a bend."},
{q:"Passengers have just got off a bus ahead of you. What should you anticipate?",options:["Nothing unusual","They may cross the road directly in front of or behind the bus","They will always use a nearby crossing","The bus will not move again soon"],correct:1,explain:"Pedestrians leaving a bus sometimes cross without using a formal crossing — stay alert."},
{q:"Why should you leave extra room when behind a cyclist or motorcyclist in strong winds?",options:["It isn't necessary","Gusts can push them off course suddenly","They are unaffected by wind","Only lorries are affected by wind"],correct:1,explain:"Two-wheeled vehicles are far more exposed to sudden gusts than a car."},
{q:"A tram is approaching a junction where you want to turn across its path. You should:",options:["Proceed since cars have priority over trams","Give way — trams cannot stop or steer as quickly as you can give way","Sound your horn and continue","Speed up to cross first"],correct:1,explain:"A tram's braking distance and fixed path mean you must be the one to give way."},
{q:"Large goods vehicles (LGVs) generally need a longer distance to stop than a car mainly because of their:",options:["brighter rear lights","shorter overall length","greater weight and mass","lower ground clearance"],correct:2,explain:"A heavier vehicle has more momentum, so it takes longer to slow down and stop even with good brakes."},
{q:"The blind areas directly beside and behind a lorry, where the driver cannot see other road users, are often called:",options:["no-go areas","safe zones","clearway lanes","mirror blocks"],correct:0,explain:"These are commonly referred to as no-go areas because a car or pedestrian in them may be completely invisible to the lorry driver."},
{q:"Why might a long vehicle need to straddle lanes when going round a roundabout?",options:["It is required to use two lanes by law at every roundabout","It is overtaking another vehicle on the roundabout","It has broken down and is being towed","Its length means it needs extra space to avoid clipping the kerb or other vehicles"],correct:3,explain:"A long wheelbase means the rear of the vehicle can cut in sharply, so the driver positions it across lanes to complete the turn safely."},
{q:"You're driving behind a tractor and trailer that is depositing mud onto the road surface. You should:",options:["Overtake as soon as a gap appears, regardless of visibility","Drop back and allow extra stopping distance as the road may be slippery","Sound your horn repeatedly until it pulls over","Drive close behind so you don't lose sight of the hazard ahead"],correct:1,explain:"Mud on the road reduces tyre grip, so extra following distance gives you more time to react and stop safely."},
{q:"A slow-moving agricultural vehicle displaying a flashing amber beacon is warning you that:",options:["it has right of way over all other traffic","it is about to perform an emergency stop","it is travelling slowly and may be wider than normal vehicles","it is exempt from all speed limits"],correct:2,explain:"The amber beacon alerts following traffic to a slow or oversized vehicle well before you get close enough to judge its speed."},
{q:"A fire engine approaches from behind with blue lights flashing and siren sounding. You should:",options:["Accelerate to clear the next junction before it arrives","Brake to a stop immediately, wherever you are","Continue at the same speed since it must go around you","Pull over safely when you can to let it pass"],correct:3,explain:"Stopping dead in your current position could block the emergency vehicle or cause a collision, so you should find a safe spot to pull in instead."},
{q:"Electric and hybrid vehicles can be a particular hazard to pedestrians because:",options:["they are not fitted with brake lights","they can be almost silent at low speeds and harder to hear approaching","they always travel faster than petrol vehicles","they are not allowed to sound a horn"],correct:1,explain:"Without engine noise, pedestrians and cyclists may not notice a slow-moving electric vehicle until it is very close."},
{q:"What is the purpose of a 'long vehicle' sign fitted to the rear of certain lorries and trailers?",options:["To show the vehicle is exempt from the motorway speed limit","To indicate the load is hazardous or flammable","To warn other drivers it needs extra room to manoeuvre and may swing wide","To confirm the vehicle is available for hire"],correct:2,explain:"The sign is a visual reminder to following drivers that the vehicle's length means it behaves differently on bends and at junctions."},
{q:"A breakdown recovery vehicle on the hard shoulder is showing a flashing amber beacon. You should:",options:["Move over and slow down as you pass, giving it extra room","Pull onto the hard shoulder behind it","Maintain your speed and lane position as normal","Flash your headlights at it to offer help"],correct:0,explain:"Slowing and moving over protects both the recovery crew and other vehicles that may be partly in your lane."},
{q:"You come up behind a slow-moving military convoy on a single carriageway road. You should:",options:["Overtake the whole convoy in one go regardless of oncoming traffic","Flash your lights to signal the convoy to pull over","Treat the convoy as a single vehicle that cannot be overtaken at all","Be patient and only overtake vehicles when it is clearly safe to do so"],correct:3,explain:"A convoy is still made up of separate vehicles, so normal overtaking rules apply and patience reduces the risk of a dangerous manoeuvre."},
{q:"You need to pass a horse-drawn carriage on a narrow country road. You should:",options:["Sound your horn as you approach to warn the horse","Slow down and give it as much room as possible","Overtake quickly to minimise the time spent alongside it","Drive close behind until there is a gap in oncoming traffic"],correct:1,explain:"Horses can be startled by sudden noise or vehicles passing too closely, so a slow, wide pass is safest for everyone."},
{q:"What is the main difference between a Class 2 and a Class 3 mobility scooter?",options:["A Class 2 scooter requires a provisional driving licence","A Class 3 scooter must stay on pavements at all times","A Class 3 scooter can be used on the road and travels faster","A Class 2 scooter can legally be used on dual carriageways"],correct:2,explain:"Class 2 scooters are limited to around 4mph for pavement use, while Class 3 scooters can reach 8mph and are permitted on the road."},
{q:"A Class 3 mobility scooter being used on a dual carriageway must:",options:["Travel in the right-hand lane","Be accompanied by an escort vehicle","Stay below 4mph at all times","Use a flashing amber beacon"],correct:3,explain:"The flashing beacon makes the slow-moving scooter more visible to faster traffic approaching from behind on a dual carriageway."},
{q:"When overtaking a horse and rider, you should:",options:["Pass as quickly as possible to reduce the time alongside","Pass slowly, leaving at least as much room as you would for a car","Sound your horn just before you pass to alert the rider","Only overtake on a bend where you have more road width"],correct:1,explain:"Horses can react unpredictably, so slowing down and giving generous space reduces the chance of startling the animal."},
{q:"Tram rails embedded in the road surface can be a particular hazard to motorcyclists and cyclists because:",options:["they generate heat that damages tyres","they are raised well above the road surface","they can become slippery, especially in wet weather","they are only visible at night"],correct:2,explain:"The smooth metal rails offer less grip than the road surface, which can unsettle two-wheeled vehicles crossing at an angle."},
{q:"At a tram stop that has no separate pedestrian platform, drivers should be especially alert for:",options:["trams reversing back along the track without warning","trams always stopping on red lights only","cyclists being required to dismount at the stop","passengers crossing the road to reach or leave the tram"],correct:3,explain:"Without a platform, passengers often have to cross the carriageway directly, sometimes from between stationary vehicles."},
{q:"A bus signals to pull out of a bus lane into the lane you're using. You should:",options:["Speed up to prevent it from moving across","Sound your horn to warn it to stay in the bus lane","Allow it to pull out if it is safe to do so","Maintain your exact speed and position regardless"],correct:2,explain:"Giving way to a bus re-joining the main traffic flow, where it is safe, helps keep traffic moving smoothly and courteously."},
{q:"Why should you keep well back from a bus or coach as it approaches a junction?",options:["It may swing out or take an unusual course to complete its turn","It is required to stop fully before every junction","It cannot use indicators to signal its intentions","It will always turn in the direction you expect"],correct:0,explain:"Like other long vehicles, buses and coaches sometimes need to move away from the kerb before turning, which can surprise following drivers."},
{q:"You see a wide load on a low loader, escorted by a pilot vehicle with a flashing beacon. You should:",options:["Overtake the load as soon as there's a small gap","Ignore the escort vehicle, as it has no authority on the road","Assume the load is travelling at the normal speed limit","Follow the pilot vehicle's signals and be ready to slow down or stop"],correct:3,explain:"The escort vehicle manages traffic around the wide load, so following its signals is the safest way to pass the hazard."},
{q:"You're following a gritter or snow plough spreading salt on an icy road. You should:",options:["Overtake quickly before the road becomes clear","Keep well back to avoid flying grit and give it room to work","Follow closely to use the path it has just cleared","Flash your lights to encourage it to move over"],correct:1,explain:"Grit and salt can be thrown up from these vehicles, and they often need to move slowly and unpredictably across the road while working."},
{q:"A vehicle displaying a flashing green beacon is most likely to be:",options:["a learner driver on their first lesson","a vehicle undergoing a routine MOT test","a doctor responding to an emergency","a school minibus on a scheduled run"],correct:2,explain:"A green beacon is specifically used to identify a registered doctor attending an emergency, and other drivers should give way where safe."},
{q:"How does towing a caravan or trailer mainly change a vehicle's handling?",options:["It makes the vehicle lighter and quicker to stop","It has no real effect as long as the trailer is empty","It allows the vehicle to travel faster on motorways","The increased length and weight affect acceleration, braking and stability"],correct:3,explain:"The extra length and weight behind the vehicle increase stopping distances and make the combination more prone to swaying."},
{q:"The trailer being towed by the vehicle ahead of you starts to snake from side to side. You should:",options:["Overtake quickly before the snaking gets worse","Flash your headlights repeatedly at the driver","Drop back further to give yourself a bigger safety margin","Pull alongside to warn the driver of the problem"],correct:2,explain:"Increasing the gap gives you more time and space to react if the trailer loses control or the combination jack-knifes."},
{q:"At traffic lights with an advanced stop line for cyclists, you should:",options:["Pull up to the cyclists' line if there is space available","Stop behind the first line, leaving the cyclists' area clear","Position your vehicle inside the cyclist box when turning","Ignore the markings when no cyclists are visible"],correct:1,explain:"The space is reserved so cyclists can position themselves safely ahead of other traffic at the lights."},
{q:"You pass a roadside incident with emergency vehicles parked and blue lights flashing. You should:",options:["Speed up to clear the scene as quickly as possible","Stop your vehicle completely until told to move on","Assume the vehicles have no effect on traffic once stationary","Slow down, as people may be moving around the vehicles or crossing the road"],correct:3,explain:"Emergency crews and casualties may be in or near the carriageway, so reducing speed gives you more time to react safely."},
{q:"How are drivers usually warned that trams operate on a particular stretch of road?",options:["By a reduction in the national speed limit to 10mph","By specific tram warning signs and road markings","By a continuous siren sounding along the route","By temporary traffic lights at every junction"],correct:1,explain:"Dedicated signs and road markings alert drivers in advance so they can look out for trams and position their vehicle correctly."},
{q:"In windy conditions, why should you allow extra space when passing or being passed by a high-sided lorry?",options:["It is not permitted to travel in high winds","Wind has little effect on heavier vehicles","It can be buffeted by the wind and veer suddenly","It will always slow down before being overtaken"],correct:2,explain:"A large flat side catches the wind easily, which can push the lorry sideways without much warning to nearby drivers."},
{q:"An articulated 'bendy bus' needs extra care from following drivers mainly because:",options:["It is not fitted with indicators","It is shorter than a standard single-decker bus","It is not permitted to stop at bus stops","Its middle section can swing out when cornering"],correct:3,explain:"The pivoting joint means the rear section can swing into an adjoining lane on bends or at junctions, catching nearby traffic unaware."},
{q:"Why can quiet electric vehicles be a particular risk to blind or partially sighted pedestrians?",options:["Pedestrians often rely on engine noise to judge when it's safe to cross","Electric vehicles are not fitted with headlights","Electric vehicles cannot be driven in pedestrian areas","Pedestrians always have priority over electric vehicles"],correct:0,explain:"Without the usual engine sound, a pedestrian who can't see the vehicle has far less warning that it is approaching."},
{q:"What is the purpose of an Acoustic Vehicle Alerting System (AVAS) fitted to many electric and hybrid vehicles?",options:["It alerts the driver when the battery is running low","It warns other drivers of a mechanical fault","It emits a sound at low speed to help pedestrians hear the vehicle approaching","It replaces the need for a horn in all situations"],correct:2,explain:"AVAS is designed to make otherwise near-silent electric vehicles more noticeable to pedestrians and cyclists at low speeds."},
{q:"A taxi ahead of you stops suddenly to pick up or set down a passenger. You should:",options:["Assume it will always signal clearly before stopping","Be prepared for this and keep a safe following distance","Overtake immediately before it comes to a stop","Sound your horn to discourage it from stopping there"],correct:1,explain:"Taxis often stop with little notice to collect or drop passengers, so keeping back gives you time to react safely."},
{q:"You're following a long vehicle that is approaching a level crossing. You should be aware that:",options:["It will always come to a complete stop before crossing","It is exempt from obeying level crossing signals","It may need extra room and time to clear the crossing safely","It will always increase speed to cross as quickly as possible"],correct:2,explain:"A long vehicle's length and limited ground clearance mean it may need to take extra care and time to cross without becoming stuck."},
]},
{id:"vehicle-handling",name:"Vehicle Handling",
notes:[
"In strong winds, high-sided vehicles, motorcyclists and cyclists are affected the most — give them extra room and be ready for sudden gusts yourself, especially coming out from behind bridges or lorries.",
"If you skid, ease off the accelerator and avoid braking hard; steer gently in the direction you want the front of the car to go.",
"Coasting (travelling in neutral or with the clutch down) reduces your control over the vehicle and should be avoided, especially downhill.",
"In snow or ice, pull away gently in a higher gear to reduce wheel spin, and use engine braking (lower gears) rather than heavy braking on long descents.",
"In fog, switch off front and rear fog lights as soon as visibility improves — they can dazzle other drivers — and avoid full beam, which reflects back off the fog and reduces what you can see.",
"If you're dazzled by oncoming headlights at night, slow down and avoid staring directly at the lights; always dip your own headlights in good time for oncoming traffic.",
"Weight shifts towards the outside tyres on a bend, reducing their grip — brake before the bend, not while turning through it.",
"Black ice is often invisible and is most likely on shaded stretches of road that stay below freezing after the rest of the road has thawed.",
"In an electric or hybrid vehicle, lifting off the accelerator engages regenerative braking, slowing the car while feeding energy back into the battery.",
"When reversing with a trailer attached, small, opposite steering movements are needed, since the trailer initially swings the opposite way to the steering input."
],
links:[
{label:"Highway Code: Driving in adverse weather conditions (226–237)",url:"https://www.gov.uk/guidance/the-highway-code/driving-in-adverse-weather-conditions-226-to-237"}
],
questions:[
{q:"You start to skid on a wet road. What's the correct response?",options:["Brake hard immediately","Ease off the accelerator and steer gently in the direction you want to go","Accelerate to regain grip","Pull the handbrake"],correct:1,explain:"Sudden braking or steering can make a skid worse — gentle, controlled correction is safer."},
{q:"Why is \"coasting\" (freewheeling in neutral) discouraged, especially downhill?",options:["It saves fuel with no downside","It reduces engine braking and your control over the vehicle","It's only a problem in electric cars","It improves braking"],correct:1,explain:"Without engine braking, you rely entirely on the brakes, which can overheat on a long descent."},
{q:"In icy conditions, pulling away in a higher gear helps because:",options:["It increases wheel spin","It reduces the risk of wheel spin on a slippery surface","It has no effect","It's illegal to pull away in a low gear"],correct:1,explain:"A higher gear delivers power more gently to the wheels, reducing the chance of them spinning."},
{q:"You're overtaken by a high-sided vehicle in strong crosswinds. What should you expect?",options:["No change to your driving","A possible sudden gust as it passes or as you emerge from behind it","That it will block all wind","To need to brake hard"],correct:1,explain:"The turbulence created by a large vehicle in crosswinds can buffet your car unexpectedly."},
{q:"On a long, steep downhill stretch, what reduces reliance on your brakes?",options:["Coasting in neutral","Selecting a lower gear to use engine braking","Switching off the engine","Applying the handbrake repeatedly"],correct:1,explain:"Engine braking in a lower gear helps control speed without overheating the brakes."},
{q:"Driving towards a flood of uncertain depth, you should:",options:["Drive through quickly to avoid stalling","Only proceed if you're sure it's shallow enough, then drive through slowly in a low gear","Always reverse away regardless of depth","Speed up to create a bow wave"],correct:1,explain:"Unknown depth is a real risk — check first, and if you proceed, go slowly in a low gear."},
{q:"Why should you reduce speed before a sharp bend rather than during it?",options:["Braking mid-bend can upset the car's grip and cause a skid","Speed doesn't matter on bends","It's only a concern for motorcycles","Braking mid-bend improves grip"],correct:0,explain:"Braking while turning shifts weight and grip around, making a loss of control more likely."},
{q:"What effect does ABS (anti-lock braking) have in an emergency stop?",options:["It lets you steer while braking hard by preventing wheel lock-up","It stops the car faster in all conditions","It replaces the need to brake early","It only works above 60mph"],correct:0,explain:"ABS prevents the wheels from locking, so you retain some steering control under heavy braking."},
{q:"In foggy conditions, why should you reduce your speed?",options:["So you can stop within the distance you can actually see to be clear","To save fuel on the journey","To make it easier for other drivers to overtake you","Because fog lights work better at lower speeds"],correct:0,explain:"Reduced visibility means you need to be able to stop within the shorter distance you can actually see ahead."},
{q:"When must you switch off your front and rear fog lights?",options:["As soon as visibility improves","Only once you have parked for the night","Never, once switched on they can stay on in daylight","Only after sunset regardless of visibility"],correct:0,explain:"Fog lights left on once visibility has improved can dazzle other road users and must be switched off."},
{q:"Why should you increase the gap to the vehicle ahead in foggy conditions?",options:["Fog itself reduces tyre grip on the road","Poor visibility means you may not see a hazard, such as a slow vehicle, until you're very close","It stops the driver behind from overtaking","Fog lights have a shorter range than dipped headlights"],correct:1,explain:"Fog hides hazards until you are close to them, so extra distance gives you more time to react safely."},
{q:"Why is it unsafe to use full beam headlights in thick fog?",options:["It is illegal to use any headlights in fog","The light reflects off the fog back towards you, reducing your view","Full beam uses too much fuel","Full beam only dazzles pedestrians, not drivers"],correct:1,explain:"Full beam light bounces back off the water droplets in fog, making it harder for you to see rather than easier."},
{q:"According to the Highway Code, visibility is 'seriously reduced' when you cannot see further than roughly what distance?",options:["100 metres","500 metres","1 mile","50 metres"],correct:0,explain:"The Highway Code treats visibility of less than about 100 metres, roughly the length of a football pitch, as seriously reduced."},
{q:"You are following another vehicle closely at night on an unlit road. What should you do with your headlights?",options:["Keep full beam on so you can see further","Use dipped headlights so you don't dazzle the driver ahead","Switch your headlights off completely","Flash your headlights repeatedly"],correct:1,explain:"Full beam reflecting in another driver's mirrors can dazzle them, so you should dip your lights when following closely."},
{q:"You are dazzled by the headlights of an oncoming vehicle at night. What should you do?",options:["Flash your own full beam back at them","Close your eyes briefly until they pass","Slow down and avoid staring directly at the lights","Swerve towards the opposite side of the road"],correct:2,explain:"Slowing down and glancing slightly away from the glare reduces risk while your eyes recover."},
{q:"When is it generally safe to use full beam headlights?",options:["Only within town centres","When there is no oncoming traffic and the road ahead is unlit","Whenever you personally feel visibility is poor","Only while driving on motorways"],correct:1,explain:"Full beam gives the best view of a dark, unlit road but must be dipped as soon as another vehicle approaches."},
{q:"As you take a sharp bend too fast, what happens to the vehicle's weight?",options:["It transfers towards the inside tyres, increasing their grip","It transfers towards the outside tyres, reducing grip on the inside ones","It stays perfectly balanced regardless of speed","It transfers evenly, improving overall stability"],correct:1,explain:"Cornering forces shift weight outward, lightening the inside tyres and reducing their grip, so speed should be reduced before the bend."},
{q:"You are towing a caravan and it begins to sway from side to side. What should you do?",options:["Brake firmly to stop the swaying","Accelerate hard to pull the caravan straight","Ease off the accelerator gently and let your speed drop","Steer sharply to counter each sway"],correct:2,explain:"Easing off smoothly allows the combination to settle, whereas harsh braking or steering can make the sway worse."},
{q:"How does towing a trailer or caravan typically affect your stopping distance?",options:["It has no effect if your brakes are in good condition","It reduces stopping distance due to extra traction","It increases stopping distance because of the added weight","It only matters when driving uphill"],correct:2,explain:"The extra weight behind the car increases momentum, so a greater distance is needed to stop safely."},
{q:"Which of these is a sign that a vehicle's suspension may be worn?",options:["The car brakes more sharply than normal","The car keeps bouncing for some time after going over a bump","Fuel consumption improves noticeably","The steering becomes heavier only at low speed"],correct:1,explain:"Worn shock absorbers fail to control body movement, so the car keeps bouncing instead of settling quickly, reducing tyre grip."},
{q:"What is the minimum legal tread depth for car tyres in the UK?",options:["1.6mm across the central three-quarters of the tyre","3mm across the whole tyre","1.6mm on the outer edge only","There is no legal minimum tread depth"],correct:0,explain:"UK law requires at least 1.6mm of tread depth around the central three-quarters of the tyre's width and circumference."},
{q:"If your car begins to aquaplane, skimming on a film of water, what should you do?",options:["Brake firmly to regain contact with the road","Ease off the accelerator and let your speed reduce gradually","Accelerate to push through the water","Apply the handbrake"],correct:1,explain:"Braking or sudden steering while aquaplaning can cause loss of control, so easing off and letting speed drop naturally is safer."},
{q:"How does heavy rain generally affect your stopping distance?",options:["It has little effect if your tyres are good","It can greatly increase stopping distance due to reduced grip","It only matters on motorways","It slightly reduces stopping distance because the road is cooler"],correct:1,explain:"Wet roads significantly reduce tyre grip, so stopping distances can be much greater than in dry conditions."},
{q:"In an electric or hybrid vehicle, what does regenerative braking do when you lift off the accelerator?",options:["It disconnects the motor with no effect on speed","It slows the vehicle while feeding energy back into the battery","It automatically applies the handbrake","It increases speed slightly to maintain momentum"],correct:1,explain:"Regenerative braking uses the electric motor as a generator, slowing the car and recharging the battery as you ease off the accelerator."},
{q:"On an unfamiliar narrow country road with passing places, you meet an oncoming vehicle and there's no room to pass. What should you do?",options:["Flash your lights and wait for the other driver to reverse","Reverse to the nearest passing place if it's safer for you to do so","Drive onto the verge to squeeze past","Sound your horn and keep moving forward"],correct:1,explain:"Whichever driver can reverse to a passing place more safely should do so, rather than assuming the other must give way."},
{q:"In which situation would using cruise control be least appropriate?",options:["On a quiet, straight, dry motorway","On a long, flat dual carriageway","In heavy traffic or on a winding, wet road","On an open road with light traffic"],correct:2,explain:"Cruise control reduces your control over speed, which is unsafe when conditions demand frequent adjustment, such as in traffic or poor weather."},
{q:"You are on a motorway in strong winds, approaching a high, exposed bridge. What should you expect?",options:["Winds are always weaker on bridges","A sudden gust as you leave the shelter of the surrounding landscape","Your vehicle will automatically slow down","No change compared to the rest of the motorway"],correct:1,explain:"Exposed sections such as bridges can produce sudden strong gusts that are absent in sheltered stretches, so extra caution is needed."},
{q:"You are about to overtake a high-sided vehicle on a motorway in windy conditions. What should you do?",options:["Overtake as close as possible to save time","Leave extra room in case a gust pushes either vehicle sideways","Only overtake if you are travelling faster than 70mph","Flash your headlights before pulling out"],correct:1,explain:"Strong winds can suddenly push a high-sided vehicle sideways, so extra space reduces the risk of a collision."},
{q:"What is 'adverse camber' on a bend and why does it matter?",options:["A road surface that slopes away from the direction of the bend, reducing grip","A type of speed bump found before junctions","A road marking showing how sharp a bend is","An area where streetlights are angled incorrectly"],correct:0,explain:"On an adverse camber the road tilts the wrong way for the bend, reducing tyre grip and requiring a lower speed."},
{q:"You see loose chippings or gravel scattered on the road ahead. What should you do?",options:["Maintain your speed, as grip is unaffected","Reduce your speed, as grip may be reduced and debris can be thrown up","Accelerate to pass over it quickly","Brake hard as soon as you reach it"],correct:1,explain:"Loose material reduces tyre grip and can be thrown up by other vehicles, so a lower speed is safer."},
{q:"Before driving down a long, steep hill in a heavily loaded vehicle, what should you do?",options:["Select a lower gear before starting the descent","Select neutral to save fuel","Switch off the engine and coast down","Apply the handbrake partially throughout the descent"],correct:0,explain:"Selecting a lower gear before the descent provides engine braking and reduces reliance on the footbrake, which could overheat."},
{q:"While driving on a flat, straight road, you notice the steering constantly pulls to one side. What does this most likely indicate?",options:["Incorrect steering technique by the driver","A fault such as uneven tyre pressure or poor wheel alignment","A fault with the road surface alone","Normal behaviour in all vehicles"],correct:1,explain:"Unexplained pulling to one side often points to a tyre, suspension, or wheel-alignment fault that should be checked promptly."},
{q:"What effect can underinflated tyres have on your vehicle's handling?",options:["Improved cornering grip and shorter stopping distances","Reduced grip, longer stopping distances, and less stable handling","No effect provided the tread depth is legal","Better fuel economy with no handling downside"],correct:1,explain:"Underinflated tyres distort under load and grip less effectively, worsening both handling and braking performance."},
{q:"When starting on a steep uphill slope, which technique helps prevent the car rolling backwards?",options:["Release the handbrake before finding the clutch's biting point","Balance the clutch at its biting point while gradually releasing the handbrake","Keep the handbrake fully on while revving hard","Select reverse gear before moving off"],correct:1,explain:"Finding the clutch's biting point before releasing the handbrake lets the engine take over holding the car, preventing it rolling back."},
{q:"When reversing a car with a trailer attached, and you want the trailer to go left, which way should you initially turn the steering wheel?",options:["To the left","To the right","Keep it perfectly straight","It depends only on the trailer's weight"],correct:1,explain:"When reversing with a trailer, small opposite steering movements are needed because the trailer initially swings the opposite way to the steering input."},
{q:"Driving towards a low, bright sun that is dazzling you, what should you do?",options:["Speed up to get past the glare quickly","Slow down, use your sun visor, and increase your distance from the vehicle ahead","Close one eye until the glare passes","Switch on full beam headlights to compensate"],correct:1,explain:"Reducing speed and increasing following distance gives you more time to react, since glare can briefly hide hazards."},
{q:"After driving through a flood or deep puddle, why should you test your brakes gently as soon as it's safe to do so?",options:["To help dry out the tyres","Because water on the brakes can reduce their effectiveness until they dry out","It's a legal requirement after every flood","To check the handbrake cable tension"],correct:1,explain:"Wet brake discs or drums can grip less effectively, so testing them gently confirms they're working before you rely on them."},
{q:"What makes black ice particularly dangerous for drivers?",options:["It is thick and easy to spot on the road","It is often invisible on the road surface, giving no visual warning","It only forms during warm weather","It always covers the full width of the road clearly"],correct:1,explain:"Black ice forms a thin, transparent layer that is very hard to see, so drivers may not realise the surface is slippery until they lose grip."},
