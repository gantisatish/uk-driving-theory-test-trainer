{q:"How does overloading a vehicle typically affect its handling?",options:["It improves stability by evenly lowering the centre of gravity","It can make the vehicle harder to control and increases stopping distance","It has no effect as long as the load is secured","It only affects fuel consumption, not handling"],correct:1,explain:"Excess weight changes the vehicle's balance and increases momentum, making it harder to control and slower to stop."},
{q:"You're driving along a narrow country lane between high hedges in strong winds. Where might the wind suddenly feel much stronger?",options:["In sheltered dips between hedgerows","At gaps in the hedges or where the road opens out, such as field entrances","Only while the vehicle is stationary","Winds remain constant regardless of surroundings"],correct:1,explain:"Gaps in sheltering hedges or buildings can suddenly expose your vehicle to the full force of the wind, risking a sideways push."},
{q:"Why is engine braking in a lower gear generally preferred to heavy use of the footbrake on a long motorway descent?",options:["It uses less fuel than braking","It helps prevent the brakes overheating and losing effectiveness","It is required by law on all descents","It makes the vehicle accelerate more smoothly"],correct:1,explain:"Continuous heavy braking on a long descent can cause the brakes to overheat and fade, so engine braking shares the workload."},
]},
{id:"motorway-rules",name:"Motorway Rules",
notes:[
"Unless signs say otherwise, the national speed limit for cars on motorways is 70mph; keep to the left-hand lane unless overtaking, then move back over when it's clear.",
"If you break down, try to get to the hard shoulder or an emergency area, put on hazard lights, and get everyone out of the vehicle on the side away from traffic if it's safe to do so, behind a barrier if there is one.",
"On smart motorways, red X signs over a lane mean it's closed — never drive in it; a solid white line marks the hard shoulder, which may be used as a running lane only when signs permit.",
"Learner drivers may now drive on motorways, but only accompanied by an approved driving instructor in a car fitted with dual controls — never unaccompanied.",
"Goods vehicles over 7.5 tonnes must stay out of the right-hand lane on a motorway with three or more lanes; cars towing a trailer or caravan are limited to 60mph.",
"Never reverse, stop to swap drivers, or make a U-turn on a motorway. If you miss your exit, carry on to the next one.",
"Emergency Refuge Areas (ERAs) on smart motorways without a hard shoulder give a safer place to stop; if you can't reach one, stay belted in with hazard lights on and call for help rather than stepping into a live lane.",
"Countdown markers at the roadside show 3, 2 and then 1 stripe at 300, 200 and 100 yards before an exit.",
"Amber reflective road studs mark the right-hand edge next to the central reservation; green studs mark a slip road boundary.",
"Plan a rest break at least every two hours on a long journey, and check your fuel before setting off, since you can't simply pull over on a motorway to refuel."
],
links:[
{label:"Highway Code: Motorways (253–273)",url:"https://www.gov.uk/guidance/the-highway-code/motorways-253-to-273"}
],
questions:[
{q:"What's the national speed limit for a car on a motorway, unless signs say otherwise?",options:["60mph","70mph","80mph","No limit applies"],correct:1,explain:"70mph is the national limit for cars on motorways unless signed differently."},
{q:"Which lane should you normally drive in on a multi-lane motorway?",options:["Whichever lane you like","The left-hand lane, moving right only to overtake","The middle lane at all times","The right-hand lane for a smoother ride"],correct:1,explain:"Keeping left unless overtaking keeps traffic flowing and avoids unnecessary lane-hogging."},
{q:"Your car breaks down and you reach the hard shoulder safely. What should you do?",options:["Stay in the car with hazard lights on","Get out on the side away from traffic (if safe) and wait behind a barrier, with hazards on","Stand behind the car to warn other traffic","Attempt the repair standing in the nearside lane"],correct:1,explain:"Getting well away from the live carriageway, behind a barrier if possible, is far safer than staying in or near the car."},
{q:"On a smart motorway, what does a red X displayed above a lane mean?",options:["Reduce speed only","That lane is closed — do not drive in it","Overtaking lane only","It's for emergency vehicles only, cars may still use it"],correct:1,explain:"A red X closes the lane completely, often because of a stopped vehicle or incident ahead."},
{q:"Who can drive a car on a motorway while still a learner?",options:["No learner may ever drive on a motorway","Only when accompanied by an approved driving instructor in a dual-control car","Any learner with L-plates displayed","Only on their driving test"],correct:1,explain:"Since 2018, learners may drive on motorways only under proper instructor supervision in a dual-control car."},
{q:"You want to leave the motorway at the next exit. When should you move into the left-hand lane?",options:["At the last possible moment","In good time, following the signs and markers","Only once you see the exit slip road","It doesn't matter, move whenever"],correct:1,explain:"Moving over early avoids last-minute, risky lane changes near the exit."},
{q:"In heavy rain on the motorway, what should you do to your following distance?",options:["Leave the same gap as usual","At least double it compared with dry conditions","Reduce it to stay with the flow","Following distance doesn't matter in rain"],correct:1,explain:"Wet roads need a much longer stopping allowance, so the gap ahead must grow too."},
{q:"What should you do if you see other drivers' hazard lights flashing ahead on the motorway?",options:["Ignore them","Be prepared to slow down — they may be warning of a hazard or queue ahead","Speed up to pass the hazard quickly","Flash your own lights back and continue as normal"],correct:1,explain:"Flashing hazard lights ahead are a common early warning of slow or stopped traffic."},
{q:"When joining a motorway from a slip road, what should you do before merging onto the main carriageway?",options:["Build up your speed on the slip road to match the flow of traffic","Stop at the end of the slip road until a gap appears","Flash your headlights at traffic already on the motorway","Join at a steady 30mph regardless of other traffic"],correct:0,explain:"Matching your speed to the traffic already on the motorway lets you merge smoothly without forcing other drivers to brake."},
{q:"What is the purpose of the deceleration lane at a motorway exit?",options:["To let you slow down safely clear of the main carriageway before leaving","To allow overtaking just before the exit","To provide extra parking space near the exit","To let lorries queue before roadworks"],correct:0,explain:"The deceleration lane lets you reduce speed away from faster-moving traffic rather than braking hard in a live lane."},
{q:"You see a blue circular sign on a motorway showing a white '40'. What does it mean?",options:["A minimum speed limit of 40mph applies","A maximum speed limit of 40mph applies","Recommended speed is 40mph","40 minutes to the next services"],correct:0,explain:"Blue circular signs give mandatory instructions, so this one sets a minimum speed rather than a maximum."},
{q:"On a motorway with three or more lanes, which lane are vehicles over 7.5 tonnes normally banned from using?",options:["The right-hand lane","The left-hand lane","The hard shoulder","Any lane next to an exit"],correct:0,explain:"Large goods vehicles must keep out of the right-hand lane on three-or-more-lane motorways to keep it free for faster overtaking traffic."},
{q:"When is it appropriate to briefly use your hazard warning lights while still moving on a motorway?",options:["To warn traffic behind you of a sudden hazard or slowdown ahead","Whenever you overtake another vehicle","To thank another driver for letting you merge","Whenever your speed is below the minimum limit"],correct:0,explain:"A brief tap of the hazard lights alerts following traffic to sudden braking or danger ahead that they may not yet see."},
{q:"A matrix sign over the motorway shows a speed limit in a red circle. What does this mean?",options:["It is a legal limit you must not exceed","It is advisory only and can be ignored if the road looks clear","It only applies to lorries","It only applies during roadworks hours"],correct:0,explain:"A red-circled figure on a motorway matrix sign is a mandatory speed limit, enforceable like any other speed limit sign."},
{q:"You're driving through a contraflow system at motorway roadworks. What should you do?",options:["Reduce speed and keep within the narrow marked lane","Speed up to clear the roadworks quickly","Switch lanes frequently to find the fastest route","Use the lane nearest the workforce for a better view"],correct:0,explain:"Contraflow lanes are narrower and closer to oncoming traffic, so slowing down and staying in lane reduces the risk of a collision."},
{q:"When overtaking another vehicle on a motorway, which side should you normally use?",options:["The right-hand side, returning to the left once past","The left-hand side only","Either side, whichever is clearer","The hard shoulder if it's empty"],correct:0,explain:"Highway Code guidance is to overtake on the right and move back to the left once it's safe, keeping the right-hand lanes free for further overtaking."},
{q:"On a long motorway journey, how often is it recommended to stop for a rest break?",options:["At least every two hours","Only when you feel unwell","Every 30 minutes","Only after 300 miles"],correct:0,explain:"Taking a break at least every two hours helps prevent the fatigue that contributes to many motorway collisions."},
{q:"You realise too late that you've missed your motorway exit. What should you do?",options:["Carry on to the next exit and leave there","Stop on the hard shoulder and reverse back","Slow right down and cut across to the slip road","Perform a U-turn at the next gap in the barrier"],correct:0,explain:"Reversing, stopping, or turning back on a motorway is illegal and extremely dangerous, so you must continue to the next exit."},
{q:"What is the speed limit for a car towing a caravan on a motorway?",options:["60mph","70mph","50mph","40mph"],correct:0,explain:"Towing reduces stability and stopping performance, so cars towing a trailer or caravan are limited to 60mph on motorways."},
{q:"What is an Emergency Refuge Area (ERA) on a smart motorway for?",options:["A dedicated place to pull into if you break down where there's no hard shoulder","A rest area with toilets and food","A lane reserved for emergency vehicles only","A police checkpoint area"],correct:0,explain:"ERAs are set back from the live lanes to give broken-down drivers a safer place to stop on motorways without a continuous hard shoulder."},
{q:"Which of these is NOT allowed to use a motorway?",options:["A learner motorcyclist riding alone","A car with a trailer attached","A coach travelling between cities","A motorcycle over 50cc with a full licence holder"],correct:0,explain:"Learner motorcyclists, along with pedestrians, cyclists and slow-moving vehicles, are barred from motorways for safety reasons."},
{q:"What do the countdown markers at the side of the motorway just before an exit show?",options:["The distance remaining to the exit, in sets of stripes","The number of lanes closed ahead","The speed limit at the exit","The distance to the nearest fuel station"],correct:0,explain:"Countdown markers appear at 300, 200 and 100 yards before an exit, with the number of stripes reducing as you approach it."},
{q:"What does an amber flashing light on a motorway signal gantry usually warn you to do?",options:["Be ready to slow down or change lane because of a hazard ahead","Speed up to clear the area quickly","Switch on your fog lights immediately","Stop immediately in your current lane"],correct:0,explain:"Flashing amber signals warn of a hazard such as an obstruction, so you should be ready to slow down or change lane safely."},
{q:"Red lights are flashing above every lane of the motorway. What must you do?",options:["Stop and not go beyond the signal in that lane","Slow down but continue if the road looks clear","Move into the hard shoulder and carry on","Sound your horn and proceed with caution"],correct:0,explain:"Red signals above a lane mean that lane is completely closed and you must not pass the signal in it."},
{q:"You feel fine but just want a rest. Can you stop on the hard shoulder of a motorway?",options:["No, the hard shoulder is only for genuine emergencies","Yes, as long as it's for less than 10 minutes","Yes, if you put your hazard lights on","Yes, but only during daylight hours"],correct:0,explain:"Stopping on the hard shoulder for anything other than a genuine emergency or breakdown is illegal and puts you at serious risk."},
{q:"Is it legal to stop on a motorway to pick up or drop off a passenger?",options:["No, this is not allowed on a motorway","Yes, if you use the hard shoulder briefly","Yes, if you park in an emergency refuge area","Yes, as long as you use hazard lights"],correct:0,explain:"Stopping to pick up or set down passengers is prohibited on motorways because it creates a serious hazard for fast-moving traffic."},
{q:"You start to feel drowsy while driving on a motorway. What's the safest thing to do?",options:["Leave at the next exit or services to rest","Open the window and turn the radio up to stay awake","Pull onto the hard shoulder for a nap","Keep driving but reduce your speed slightly"],correct:0,explain:"Opening a window or raising the volume doesn't cure fatigue, so you should come off the motorway to rest properly before continuing."},
{q:"What is the motorway speed limit for a goods vehicle over 7.5 tonnes?",options:["60mph","70mph","50mph","65mph"],correct:0,explain:"Heavier goods vehicles take longer to stop, so they're restricted to 60mph on motorways even though cars can travel at 70mph."},
{q:"A matrix sign shows a lower speed limit ahead, but the road looks completely clear. What should you do?",options:["Obey the displayed limit as it's a legal requirement","Ignore it since there's nothing visibly wrong","Only obey it if other cars are slowing down too","Treat it as advisory and use your own judgement"],correct:0,explain:"Variable limits are often set because of a hazard, fog or congestion just out of sight, so they are legally enforceable even when the road looks clear."},
{q:"Approaching a lane marked with a red X on a smart motorway, when should you move out of it?",options:["As soon as possible, in good time before reaching the signal","Only at the last moment to keep your position","Only if a police car is visible","There's no need if you're already overtaking"],correct:0,explain:"Moving out in good time avoids a dangerous last-second lane change and keeps the closed lane clear for emergency or recovery vehicles."},
{q:"What are the marker posts with arrows along a motorway hard shoulder used for?",options:["Showing the direction and distance to the nearest emergency telephone","Showing the speed limit for that stretch","Marking the entrance to the next service station","Indicating a crawler lane ahead"],correct:0,explain:"These marker posts, spaced at regular intervals, point the way to the nearest emergency telephone and help pinpoint your location if you call for help."},
{q:"What is a 'crawler lane' on a motorway used for?",options:["Allowing slow-moving heavy vehicles to climb a long gradient without blocking faster traffic","Giving learner drivers extra practice space","Providing an extra lane for overtaking only","Separating contraflow traffic at roadworks"],correct:0,explain:"Crawler lanes let slow, heavily loaded vehicles climb hills at their own pace while other traffic continues past in the remaining lanes."},
{q:"When joining a motorway, whose priority is it?",options:["Traffic already on the motorway has priority over joining traffic","Joining traffic always has priority","Whichever vehicle is travelling faster has priority","Priority alternates lane by lane"],correct:0,explain:"Drivers joining from a slip road must give way to traffic already on the motorway and fit in safely with the flow."},
{q:"At roadworks with a contraflow system, you see solid white lines separating the lanes. What do they mean?",options:["You must not cross them to change lanes","They are just a guide and can be crossed if safe","They mark where overtaking is encouraged","They indicate the lane is about to end"],correct:0,explain:"Solid white lines in a contraflow keep opposing or narrow traffic streams physically separated, so crossing them risks a head-on collision."},
{q:"Is it ever acceptable to reverse or make a U-turn on a motorway?",options:["No, both are illegal in all circumstances on a motorway","Yes, if you've missed your exit","Yes, if it's quiet with no traffic in sight","Yes, but only on the hard shoulder"],correct:0,explain:"Reversing and U-turns on a motorway are prohibited outright because other traffic approaches at very high speed with little time to react."},
{q:"Why should you check your fuel level before starting a long motorway journey?",options:["Because stopping on the motorway to refuel is not possible except at services","Because fuel prices rise after joining a motorway","Because motorway services may be permanently closed","Because fuel gauges are unreliable on motorways"],correct:0,explain:"You can't simply pull over on a motorway to refuel, so checking fuel beforehand avoids breaking down between service stations."},
{q:"Why do motorways have service areas at regular intervals?",options:["To give drivers a chance to rest, refuel and avoid fatigue-related accidents","To provide a place for the police to issue tickets","To act as additional motorway exits only","To reduce the number of lanes needed"],correct:0,explain:"Spacing service areas along motorways encourages drivers to take breaks, which reduces the risk of tiredness causing a collision."},
{q:"Where should you use your mobile phone if you need to make an urgent call on a motorway journey?",options:["At a service area or after stopping safely off the carriageway","On the hard shoulder with hazard lights on","In the left-hand lane at low speed","In an emergency refuge area, even if it's not an emergency"],correct:0,explain:"Using a phone while driving or stopping somewhere not intended for it is unsafe and often illegal, so you should wait until you reach a proper stopping place."},
{q:"What colour are the reflective road studs ('cat's eyes') marking the right-hand edge of the carriageway next to the central reservation on a motorway?",options:["Amber","White","Red","Green"],correct:0,explain:"Amber studs mark the right-hand edge next to the central reservation, helping drivers judge lane position in poor visibility."},
{q:"What colour reflective road studs mark the boundary between the motorway and a slip road?",options:["Green","Red","White","Amber"],correct:0,explain:"Green studs are used where a slip road joins or leaves the motorway, distinguishing it from the main carriageway boundaries."},
]},
{id:"rules-of-the-road",name:"Rules of the Road",
notes:[
"At a roundabout, give way to traffic already on it, approaching from your right, unless signs or markings show otherwise; signal your exit as you pass the exit before the one you want.",
"You must not park within 10 metres of a junction (unless there are road markings showing a different distance), on a pedestrian crossing or its approach markings, or where it would block access such as a driveway.",
"A solid white line in the centre of the road means you must not cross or straddle it, except for in permitted situations like entering a property or passing a stationary vehicle.",
"U-turns must only be made where you can see clearly in both directions and it won't inconvenience or endanger other road users — never on a motorway.",
"National speed limits for cars unless signed otherwise: 30mph in built-up areas, 60mph on single carriageways, 70mph on dual carriageways and motorways.",
"Double yellow lines mean no waiting at any time unless a nearby sign states otherwise; a single yellow line restricts waiting only during the times shown on a plate.",
"Box junctions (yellow crisscross lines): don't enter unless your exit is clear, or you're turning right and are only prevented by oncoming traffic.",
"Mini-roundabouts follow exactly the same priority rules as full-size roundabouts, even though the markings are flat on the road.",
"Give way to trams at all times — they run on fixed rails and cannot steer around you.",
"The horn must not be sounded in a built-up area between 11.30pm and 7am, except to warn of danger."
],
links:[
{label:"Highway Code: Using the road (159–203)",url:"https://www.gov.uk/guidance/the-highway-code/using-the-road-159-to-203"},
{label:"Highway Code: Waiting and parking (238–252)",url:"https://www.gov.uk/guidance/the-highway-code/waiting-and-parking-238-to-252"}
],
questions:[
{q:"At a roundabout with no signs showing otherwise, who do you give way to?",options:["Traffic approaching from your left","Traffic already on the roundabout, from your right","Whoever arrives first","Larger vehicles always have priority"],correct:1,explain:"The default rule is to give way to traffic already circulating, approaching from the right."},
{q:"How close to a junction are you generally not allowed to park?",options:["5 metres","10 metres, unless markings say otherwise","20 metres","There's no restriction"],correct:1,explain:"Parking too close to a junction blocks visibility for everyone turning in or out."},
{q:"What does a solid white line along the centre of the road mean?",options:["You may cross it to overtake slower traffic","You must not cross or straddle it except in specific permitted situations","It's purely decorative","It only applies to lorries"],correct:1,explain:"A solid centre line marks a stretch where crossing is unsafe, such as on a bend or hill crest."},
{q:"When is it acceptable to make a U-turn?",options:["Anywhere, as long as you signal","Only where you have a clear view both ways and won't endanger others","Only on motorways","Only at roundabouts"],correct:1,explain:"A U-turn needs good visibility and enough space to complete it without forcing others to react suddenly."},
{q:"You want to take the second exit at a roundabout. When should you signal right?",options:["As you join the roundabout","As you pass the exit before the one you want","You never need to signal on a roundabout","Only after you've left the roundabout"],correct:1,explain:"Signalling right until the exit before yours, then left to leave, tells following traffic your intentions clearly."},
{q:"What is the national speed limit on a single carriageway road for a car, unless signed otherwise?",options:["50mph","60mph","70mph","40mph"],correct:1,explain:"60mph is the default national limit for cars on single carriageways."},
{q:"You're approaching a box junction with yellow crisscross lines. When may you enter it?",options:["Only if you're turning left","Only if your exit is clear, or you're turning right and are only prevented by oncoming traffic","Whenever the light is green","Box junctions always mean stop and wait"],correct:1,explain:"Box junctions keep the junction clear — enter only if you can get across, with the one exception for right turns blocked solely by oncoming traffic."},
{q:"On a one-way street with two lanes, how do you know which lane to use for your destination?",options:["Lane choice never matters on one-way streets","Road markings and arrows indicate which lane to use for your direction","Always use the left lane","Always use the right lane"],correct:1,explain:"Lane arrows and markings guide you into the correct lane well before you need to turn."},
{q:"What is the speed limit for cars in a 20mph zone, unless a different limit is shown within the zone?",options:["20mph","30mph","40mph","10mph"],correct:0,explain:"20mph zones are specifically signed and the limit applies throughout the zone unless another limit is shown inside it."},
{q:"What is the national speed limit for cars and motorcycles on a dual carriageway?",options:["50mph","60mph","70mph","80mph"],correct:2,explain:"Unless signs show a lower limit, dual carriageways carry the same 70mph national limit as motorways for cars and motorcycles."},
{q:"You are towing a caravan on a motorway. What is the maximum speed limit that applies to your car?",options:["40mph","50mph","60mph","70mph"],correct:2,explain:"Cars towing a trailer or caravan are restricted to 60mph on motorways and dual carriageways, even though the general limit there is 70mph."},
{q:"You are towing a trailer on a single carriageway road. What speed limit applies to your car?",options:["40mph","50mph","60mph","70mph"],correct:1,explain:"Vehicles towing a trailer are limited to 50mph on single carriageways, 10mph below the normal car limit."},
{q:"Before reversing your car on the road, what should you always do first?",options:["Sound your horn continuously","Check all around the vehicle for pedestrians and obstructions","Switch on your hazard warning lights","Wait for another vehicle to pass first"],correct:1,explain:"A full check around the car, including blind spots, is needed before reversing because rear visibility is limited."},
{q:"If you cannot see clearly when reversing into a parking space, what should you do?",options:["Reverse quickly to minimise the time at risk","Ask someone outside the car to guide you","Rely only on the rear-view mirror","Sound the horn and reverse anyway"],correct:1,explain:"Getting a reliable person to guide you reduces the risk of hitting something you cannot see from the driving seat."},
{q:"Why should you avoid reversing from a side road directly into a busy main road?",options:["It is illegal in all circumstances","It is hard to see traffic approaching from both directions","It uses more fuel","It is only allowed for learner drivers"],correct:1,explain:"Reversing out blind into a main road makes it very difficult to judge approaching traffic, so you should reverse into the side road instead."},
{q:"At a level crossing, the amber light is showing. What must you do?",options:["Speed up to cross before the lights change","Stop unless you have already crossed the stop line","Sound your horn and proceed","Reverse away from the crossing"],correct:1,explain:"Amber at a level crossing warns that red is about to follow, so you must stop unless you have already passed the stop line safely."},
{q:"You are waiting at a level crossing and the red lights keep flashing even though a train has already passed. What should you do?",options:["Cross immediately since the train has gone","Wait, as another train may be approaching","Sound your horn and drive across","Reverse and find another route"],correct:1,explain:"Continued flashing red lights mean the barriers stay down because another train is due, even though one has already passed."},
{q:"What does a blue sign showing a red cross mean when displayed along a road?",options:["A clearway where stopping is banned at all times","A residents' parking zone","A cycle lane","A loading bay"],correct:0,explain:"This sign marks a clearway, where stopping to park or wait is prohibited at any time to keep the road clear."},
{q:"What do double yellow lines along the edge of the carriageway usually mean?",options:["Parking is allowed for up to 2 hours","Waiting is not allowed at any time, unless signs state otherwise","You may stop here with hazard lights on","Loading is always permitted"],correct:1,explain:"Double yellow lines indicate a waiting restriction that normally applies at all times, though a nearby sign may give exceptions."},
{q:"A single yellow line is painted along the kerb. What does this mean?",options:["Parking is free at all times","Waiting restrictions apply at times shown on a nearby sign","It is a bus lane only","You must not drive on this road"],correct:1,explain:"A single yellow line shows that waiting is restricted only during the hours stated on an accompanying sign or plate."},
{q:"You see a bay signed 'Residents permit holders only' and you do not have a permit. What is true?",options:["You may park there for up to 30 minutes","You are not permitted to park there without a valid permit","You may park there overnight only","You may park there if you display your hazard lights"],correct:1,explain:"Bays reserved for permit holders may not be used by other drivers, whatever the time of day, unless the sign states otherwise."},
{q:"A plate under a yellow line reads 'No loading Mon-Sat 8am-6pm'. What does this allow?",options:["Loading and unloading at any time","Loading and unloading only outside the stated days and times","Parking for residents only","Free parking on Sundays only"],correct:1,explain:"The plate sets out when loading and unloading is banned, so it is permitted only outside those specified days and hours."},
{q:"On a three-lane dual carriageway, which lane should you normally use when driving at a steady cruising speed and not overtaking?",options:["The right-hand lane","The middle lane","The left-hand lane","Any lane you prefer"],correct:2,explain:"The left-hand lane is for normal driving, while the other lanes are for overtaking and should be vacated once you have passed slower traffic."},
{q:"When turning right into a side road across oncoming traffic, what should you do?",options:["Turn as soon as you arrive, regardless of oncoming traffic","Position just left of centre and wait for a safe gap before turning","Flash your headlights to force oncoming traffic to stop","Reverse back to let traffic pass first"],correct:1,explain:"You should keep as near to the centre of the road as is safe and only turn when there is a safe gap in the oncoming traffic."},
{q:"You reach a crossroads with no road markings or signs. Who has priority?",options:["Traffic from the right always","Traffic from the left always","The largest vehicle","No one, so all drivers should proceed with caution"],correct:3,explain:"Without signs or markings, no one has automatic right of way, so all drivers must slow down and be ready to give way as needed."},
{q:"How should you approach a mini-roundabout?",options:["Treat it the same as a normal roundabout, giving way to traffic from the right","Ignore give-way rules since it is small","Always go straight across without slowing","Only give way if a sign specifically says so"],correct:0,explain:"Mini-roundabouts follow the same priority rules as larger roundabouts, even though the markings are flat and small."},
{q:"Why should you avoid making a U-turn at a mini-roundabout?",options:["It is always illegal everywhere in the UK","The limited space makes it difficult and potentially dangerous","It will damage the road surface","You must always turn left at a mini-roundabout"],correct:1,explain:"The small size of a mini-roundabout makes U-turns awkward and increases the risk of a collision with other traffic."},
{q:"What is a contraflow bus lane?",options:["A bus lane that only operates at night","A lane where buses travel in the opposite direction to the rest of the traffic","A lane shared by buses and taxis only","A temporary lane used during roadworks"],correct:1,explain:"A contraflow bus lane runs against the normal flow of traffic, so drivers must take extra care not to enter it going the wrong way."},
{q:"You see a 'No Entry' sign at the entrance to a one-way street. What must you do?",options:["Enter only if the street looks clear","Not enter the street under any circumstances","Enter only during daylight hours","Enter if you are a local resident"],correct:1,explain:"A No Entry sign is a mandatory restriction that applies to all drivers at all times, with no exception for local knowledge of the road."},
{q:"Why must you not park opposite, or within the entrance of, a fire or ambulance station?",options:["It may cause a parking fine only","It could block emergency vehicles entering or leaving","It is reserved for delivery vehicles","It is only an issue during the day"],correct:1,explain:"Blocking these entrances could delay emergency vehicles responding to or returning from an incident, putting lives at risk."},
{q:"You are driving on a road with tram tracks and a tram is approaching. What should you do?",options:["Expect the tram to steer around you","Give way, since trams cannot change direction to avoid you","Overtake the tram quickly","Sound your horn so the tram stops"],correct:1,explain:"Trams run on fixed rails and cannot steer to avoid other road users, so you must always give way to them."},
{q:"When should you normally drive on the hard shoulder of a motorway?",options:["Whenever traffic is heavy in other lanes","Only in a genuine emergency or breakdown, unless signs show it is a running lane","To overtake slower traffic","Whenever you are travelling below the speed limit"],correct:1,explain:"The hard shoulder is kept clear for emergencies and breakdowns, except where a smart motorway scheme has signed it as an active running lane."},
{q:"On a smart motorway, a red X is displayed above a lane. What does this mean?",options:["The lane is for buses only","The lane is closed and must not be used","The lane has a reduced speed limit","The lane is for overtaking only"],correct:1,explain:"A red X above a motorway lane means it is closed, often due to an incident ahead, and must not be entered."},
{q:"A school crossing patrol steps into the road holding up a 'STOP' sign. What must you do?",options:["Slow down but continue past carefully","Stop and wait until the sign is withdrawn","Sound your horn and proceed","Only stop if children are visible"],correct:1,explain:"You must stop and remain stopped until the patrol lowers the sign, even if no children are visible yet."},
{q:"You approach a zebra crossing and see a pedestrian waiting at the kerb to cross. What should you do?",options:["Speed up to pass before they step out","Slow down and be prepared to stop to let them cross","Sound your horn to warn them to wait","Only stop if they are already on the crossing"],correct:1,explain:"You should slow down and be ready to stop for anyone waiting to use a zebra crossing, not just those already on it."},
{q:"A bus ahead signals to pull away from a bus stop. What should you do?",options:["Accelerate past before it moves off","Give way to let it pull out if it is safe to do so","Flash your lights to make the bus wait","Sound your horn until the bus moves"],correct:1,explain:"The Highway Code advises giving priority to buses signalling to pull away from a stop when it can be done safely."},
{q:"Which motorway lanes are intended for overtaking rather than continuous normal driving?",options:["The left-hand lane only","Any lane other than the left-hand lane","The hard shoulder","The lane nearest the central reservation only"],correct:1,explain:"Lanes other than the left-hand lane are for overtaking, and you should return left once you have passed slower traffic to keep lanes clear for others."},
{q:"Can a learner driver accompanied by an approved driving instructor drive on a motorway?",options:["No, learners are never allowed on motorways","Yes, in a car fitted with dual controls and displaying L plates","Only if towing a trailer","Only on motorways with a 50mph limit"],correct:1,explain:"Since 2018, learner drivers may drive on motorways if accompanied by an approved instructor in a dual-controlled car displaying L plates."},
{q:"A bus lane sign shows operating times of '7am-7pm Mon-Fri'. Can you drive a car in this lane at 8pm on a Friday?",options:["No, bus lanes can never be used by cars","Yes, because the restriction does not apply outside the stated times","Only if the bus lane is empty","Only if you switch on your hazard lights"],correct:1,explain:"Outside the times shown on the sign, the lane reverts to a normal traffic lane and may be used by other vehicles."},
{q:"Between which hours are you prohibited from sounding your horn in a built-up area while driving, except to warn of danger?",options:["10pm to 6am","11:30pm to 7am","Midnight to 5am","9pm to 8am"],correct:1,explain:"The Highway Code bans using the horn in built-up areas between 11.30pm and 7am, except when another road user poses a genuine danger."},
]},
{id:"road-signs",name:"Road and Traffic Signs",
notes:[
"Shape and colour carry meaning at a glance: circular signs give orders (blue = must do, red circle = prohibition), triangular signs warn of hazards ahead, and rectangular signs give information or directions.",
"The traffic light sequence is red, red and amber together, green, amber, then back to red. Red and amber together means \"get ready, but don't go yet.\"",
"A single flashing amber light at a pedestrian crossing (Belisha beacon/zebra) means give way to any pedestrian already on the crossing.",
"Advance direction signs on motorways are blue; on primary routes they're green; on local, non-primary routes they're white with black borders; brown signs point to tourist attractions.",
"An octagonal STOP sign with a solid stop line means come to a complete stop every time, unlike a give-way triangle on the road, which only means give priority if needed.",
"Road markings explain themselves by border: a hatched area bordered by a solid white line must never be entered; the same markings bordered by a broken line may be crossed if it's safe and necessary.",
"A red X displayed above a motorway lane means that lane is closed and must not be used; a mandatory (red-circled) speed limit on a matrix sign is legally enforceable even if the road looks clear.",
"Blue rectangular signs with a cycle symbol mark a signed cycle route; a cycle lane bordered by a solid white line, with times shown, is mandatory during those hours — a broken line marks an advisory lane only.",
"A triangular warning sign with a plain exclamation mark warns of a general danger that has no dedicated symbol of its own, often explained on a small plate beneath it."
],
links:[
{label:"Highway Code: Traffic signs",url:"https://www.gov.uk/guidance/the-highway-code/traffic-signs"},
{label:"Highway Code: Signals to other road users",url:"https://www.gov.uk/guidance/the-highway-code/signals-to-other-road-users"}
],
questions:[
{q:"What does a triangular road sign generally indicate?",options:["A mandatory instruction","A warning of a hazard ahead","Direction information only","A prohibition"],correct:1,explain:"Triangles are the Highway Code's standard shape for warning signs."},
{q:"What does a circular sign with a red border usually mean?",options:["Information","A prohibition — something you must not do","A warning","Direction to a motorway"],correct:1,explain:"Red circular signs set out things that are prohibited, such as no entry or a speed limit."},
{q:"In the traffic light sequence, what does red and amber showing together mean?",options:["You may go","Stop and prepare, but don't go until green shows","It's the same as green","You must reverse"],correct:1,explain:"This combination warns that green is about to appear, so you can prepare to move off."},
{q:"Approaching a zebra crossing with its amber beacons flashing and a pedestrian waiting to cross, you should:",options:["Only slow down if they've stepped onto the crossing","Be ready to stop and give way as they are about to or have started crossing","Sound your horn and continue","Speed up to cross before they step out"],correct:1,explain:"Pedestrians waiting at a zebra crossing should be given priority as they prepare to cross."},
{q:"What colour are advance direction signs on a motorway?",options:["Green","Blue","White with black border","Yellow"],correct:1,explain:"Blue signage is reserved for motorway direction signs."},
{q:"A sign showing a red circle with a diagonal line through it and no other symbol means:",options:["No stopping","National speed limit applies","No entry","Give way"],correct:1,explain:"This specific sign cancels any lower local limit and restores the national speed limit for that road type."},
{q:"What does a sign with a blue circular background and a white arrow typically indicate?",options:["A warning","A mandatory direction you must follow","Advisory information only","A prohibition"],correct:1,explain:"Blue circles give positive instructions — in this case, the direction you must take."},
{q:"You see a triangular sign showing a humped bridge symbol. This warns you to:",options:["Speed up to clear it","Slow down, as the road ahead has a hump that could unsettle the car","Expect a motorway ahead","Stop completely before proceeding"],correct:1,explain:"A hump can cause loss of control or grounding at speed, so slow down in good time."},
{q:"A triangular sign shows an adult and child walking, often near a school. What does it warn of?",options:["A school crossing patrol ahead","A playground on the road","A pedestrian zone with no traffic","A cycle route for children"],correct:0,explain:"This warning sign alerts drivers that a school crossing patrol (lollipop person) may be stopping traffic ahead."},
{q:"You see a triangular sign showing a car with wavy skid lines beneath it. What is it warning you about?",options:["Low-flying aircraft","A slippery road surface","A steep downhill gradient","Soft road verges"],correct:1,explain:"The skidding car symbol warns that the road surface ahead may be unusually slippery, especially in wet conditions."},
{q:"What does a warning sign showing rocks tumbling from a cliff onto the road mean?",options:["A quarry entrance is ahead","There is a risk of falling or fallen rocks on the road","The road surface is uneven","A tunnel is ahead"],correct:1,explain:"This sign is used on routes near cliffs or steep rock faces to warn that rocks may fall or already lie on the carriageway."},
{q:"A triangular sign shows the silhouette of a deer. What should you do when you see it?",options:["Sound your horn continuously","Expect wild animals may cross the road and be ready to slow down","Switch on hazard warning lights","Ignore it, as it only applies at night"],correct:1,explain:"This sign warns that wild animals may wander onto the road, so you should reduce speed and be ready to stop."},
{q:"What does a warning sign showing a windsock or flag blowing sideways indicate?",options:["A nearby airfield","Strong crosswinds, especially on exposed stretches of road","A weather station ahead","Overhead power lines"],correct:1,explain:"This sign warns of sudden sideways gusts, commonly found on exposed bridges, embankments or coastal roads."},
{q:"A circular sign with a red border shows a black car overtaking a red car. What does it mean?",options:["Overtaking is permitted for one mile","No overtaking is allowed","Dual carriageway ahead","Slow-moving vehicles must pull over"],correct:1,explain:"A red-bordered circular sign gives a prohibition, and this particular symbol bans overtaking by motor vehicles."},
{q:"A circular red-bordered sign shows the figure '7.5t'. What does this mean for your vehicle?",options:["You must not exceed 7.5 tonnes in weight to use this road","The road is 7.5 miles long","Fuel stations charge 7.5p extra per litre here","Maximum 7.5 passengers allowed"],correct:0,explain:"This is a weight-limit sign prohibiting vehicles over the stated maximum gross weight from using the road."},
{q:"You approach a sign shaped like an arch showing '13'-6\" (4.1m)'. What is it telling you?",options:["The maximum height of a vehicle able to pass is 13ft 6in / 4.1m","The road ahead bends sharply upward","There is a car park with limited headroom nearby","The next bridge is 13.6 miles away"],correct:0,explain:"This sign warns of a height restriction, usually a low bridge or structure, and gives the maximum vehicle height permitted."},
{q:"A circular sign shows arrows pointing inward with a figure marked in metres. What does it restrict?",options:["The number of lanes ahead","The maximum width of vehicles allowed to pass","The speed limit in metres per second","The distance to the next junction"],correct:1,explain:"This sign prohibits vehicles wider than the stated measurement from proceeding, often due to a narrow bridge or gateway."},
{q:"You see diagonal hatched markings on the road bordered by a solid white line. What must you do?",options:["Drive through if no other traffic is visible","Not enter the hatched area at all, except in a genuine emergency","Use it as an overtaking lane","Park there briefly if necessary"],correct:1,explain:"A solid white border around hatched markings means you must not enter the area at all, as it usually separates opposing traffic or protects a hazard."},
{q:"Diagonal hatched road markings are bordered by a broken white line. When can you enter this area?",options:["Only between 7am and 7pm","Only if it is safe and necessary, such as to turn right","At any time without restriction","Never, it is identical to a solid border"],correct:1,explain:"A broken border allows you to cross the hatched area only when it is safe and necessary, unlike a solid border which forbids entry entirely."},
{q:"Inverted triangle markings are painted on the road surface as you approach a junction. What do they tell you?",options:["You have priority over joining traffic","You must give way to traffic on the road you are joining","The junction is for buses only","You must stop even if the road is clear"],correct:1,explain:"These painted give-way triangles mirror the upright triangle give-way sign and warn you to give priority to traffic on the road ahead."},
{q:"At a junction with an octagonal STOP sign and a solid white stop line, what must you do?",options:["Slow down and proceed if the way looks clear","Come to a complete stop at the line before moving off","Stop only if other vehicles are approaching","Treat it the same as a give way sign"],correct:1,explain:"A STOP sign with a solid line is a legal requirement to stop completely, regardless of whether the road appears clear."},
{q:"You are driving on a road with double white lines, where the line nearest to you is broken. What does this allow?",options:["You may cross the lines to overtake if it is safe to do so","You must never cross the lines under any circumstances","You may only cross to turn left","Overtaking is allowed only for motorcycles"],correct:0,explain:"A broken line on your side of a double white line system means you may cross it to overtake when the manoeuvre can be completed safely."},
{q:"At roadworks you see a temporary circular sign with a black number on a white background mounted on an orange backing board. What must you do?",options:["Treat it as advisory only","Obey the temporary speed limit it shows","Ignore it once the roadworks are out of sight","Follow it only during daylight hours"],correct:1,explain:"Temporary speed limit signs at roadworks are legally enforceable and often set a lower limit than the road's usual speed limit."},
{q:"A temporary triangular sign at roadworks shows converging lines indicating the carriageway ahead narrows. What should you do?",options:["Speed up to pass the works quickly","Be prepared for lanes to merge and adjust your position in good time","Stop immediately and wait for a signal","Switch to the hard shoulder"],correct:1,explain:"A 'road narrows' warning tells you a lane or lanes are closing ahead, so you should merge safely in good time rather than at the last moment."},
{q:"On a motorway gantry, a red 'X' appears above one of several lanes on an electronic matrix sign. What does this mean?",options:["That lane has a reduced speed limit only","That lane is closed and you must not drive in it","That lane is reserved for emergency vehicles only","That lane is for overtaking only"],correct:1,explain:"A red X on a motorway signal or gantry sign means the lane beneath it is closed and must not be used."},
{q:"A motorway variable message sign displays a circular speed figure that was not showing a few minutes earlier. What does this indicate?",options:["It is only a suggestion based on average traffic speed","A temporary mandatory speed limit has been activated, likely due to traffic or weather conditions","The sign is faulty and should be ignored","It applies only to goods vehicles"],correct:1,explain:"Variable message signs can display legally enforceable mandatory speed limits that change according to traffic flow, weather or incidents."},
{q:"At a motorway junction you see a blue direction sign showing a road number prefixed with 'M'. What does this tell you?",options:["You are approaching a primary A-road route","You are approaching or continuing onto a motorway route","The road ahead is for local traffic only","You are leaving the motorway network permanently"],correct:1,explain:"Motorway route numbers and their direction signs are shown in blue to distinguish them from other classes of road."},
{q:"A green direction sign shows a route number beginning with 'A'. What type of route is this?",options:["A motorway","A primary route connecting major towns or cities","A pedestrian-only route","A temporary diversion route"],correct:1,explain:"Green signs with an A-road number indicate primary routes, which are important through-routes between larger towns and cities."},
{q:"You pass a white direction sign with a black border showing a 'B' road number. What does this tell you about the route?",options:["It is a motorway spur","It is a local, non-primary route","It is a cycle-only route","It is a toll road"],correct:1,explain:"White signs with a black border are used for local, non-primary routes, typically B roads or minor connecting roads."},
{q:"What is the purpose of a brown-coloured road sign?",options:["To warn of a hazard ahead","To direct drivers to tourist attractions or places of interest","To show a prohibition","To indicate a motorway service area only"],correct:1,explain:"Brown signs are specifically used to direct traffic towards tourist attractions and places of interest."},
{q:"You see a blue rectangular sign showing a bicycle symbol and a route number. What does this indicate?",options:["Cycling is banned on this road","This is part of a signed cycle route","Cyclists must dismount here","The road is for buses and cycles only at weekends"],correct:1,explain:"Blue rectangular signs with a cycle symbol mark designated cycle routes, such as sections of the National Cycle Network."},
{q:"You see a sign showing a bicycle symbol with a person pushing it beside the words 'Cyclists dismount'. What is this asking cyclists to do?",options:["Stop permanently and leave the cycle route","Get off and wheel the bicycle through that section","Wait for a signal before proceeding","Switch to the opposite side of the road"],correct:1,explain:"This sign is used where it is considered safer for cyclists to walk their bike rather than ride, for example through a busy pedestrian area."},
{q:"A sign at the start of a bus lane shows the words '7.30-9.30am Mon-Fri' beneath a bus symbol. What does this mean?",options:["The lane is for buses at all times, the hours are irrelevant","Other traffic must not use the lane during those stated hours","The lane is closed completely during those hours","Those hours only apply to loading vehicles"],correct:1,explain:"The times shown indicate when the bus lane restriction is in force; outside those hours other traffic may generally use the lane unless signs say otherwise."},
{q:"You are driving during a bus lane's stated operating hours and there is no other traffic nearby. Can you drive in the lane to make progress?",options:["Yes, if the lane is empty","No, only permitted vehicles such as buses, taxis or cyclists may use it during those hours","Yes, but only for up to 100 metres","Yes, if you signal first"],correct:1,explain:"Bus lanes are restricted to specified vehicle types during their operating hours regardless of how much other traffic is present, and driving in them can result in a penalty."},
{q:"A parking sign states 'Permit holders only'. What does this mean for a driver without a permit?",options:["They may park for up to 20 minutes","They must not park there at all","They may park if paying a higher fee","They may park only on Sundays"],correct:1,explain:"A 'permit holders only' sign restricts parking exclusively to vehicles displaying a valid local permit; others must not park there."},
{q:"A parking bay is marked with a wheelchair symbol sign. Who is legally entitled to park there?",options:["Any vehicle during off-peak hours","Vehicles displaying a valid disabled person's (Blue) badge","Delivery vehicles only","Any vehicle for a maximum of 10 minutes"],correct:1,explain:"These bays are reserved for vehicles displaying a valid disabled person's badge, often called a Blue Badge."},
{q:"A road marking and sign indicate a 'loading bay' with specific times shown. What does this mean for ordinary parking?",options:["Anyone may park there at any time","General parking is not allowed, as the bay is for loading and unloading, usually within the stated times","It is reserved exclusively for motorcycles","It becomes a free parking space after 6pm every day"],correct:1,explain:"Loading bays are provided for goods vehicles to load or unload, and using them for ordinary parking, especially within the stated times, is not permitted."},
{q:"You see a warning sign showing a steam train symbol inside a triangle. What is it warning you of?",options:["A nearby railway station car park","An approaching level crossing","A tourist steam railway attraction","A bridge over a railway line"],correct:1,explain:"This triangular sign warns drivers that they are approaching a level crossing where the road crosses a railway line."},
{q:"At a level crossing, the amber light changes to steady red just as you approach. What must you do?",options:["Proceed carefully as amber was only a warning","Stop and wait, as a steady red light means do not cross","Speed up to clear the crossing before the barriers close","Sound your horn and proceed"],correct:1,explain:"A steady red light at a level crossing is a legal requirement to stop; you must not cross while it is showing, even if no train is visible."},
{q:"A triangular sign shows a plain black exclamation mark with no other symbol. What does it indicate?",options:["No hazard is present on this stretch of road","A general danger not covered by a more specific warning sign, often explained on a sign below it","A speed camera is operating ahead","Road markings have been removed"],correct:1,explain:"This 'other danger' sign is used to warn of a hazard that has no specific symbol of its own, with details sometimes given on a supplementary plate."},
{q:"You are driving on a route where overhead cables cross the road and a sign shows a car with a horizontal bar above it. What does this warn of?",options:["A speed camera ahead","A low bridge or overhead obstruction limiting vehicle height","Electric vehicle charging points ahead","A tunnel with no lighting"],correct:1,explain:"This symbol warns of restricted headroom, such as a low bridge, alerting tall vehicles to a height hazard ahead."},
]},
{id:"documents",name:"Documents",
notes:[
"Your vehicle normally needs an MOT test certificate from three years after first registration (one year for most vehicles in Northern Ireland), renewed annually afterwards.",
"The legal minimum level of insurance is third-party cover; third-party, fire and theft adds cover for your own vehicle against fire or theft; fully comprehensive covers your own vehicle for most other damage too.",
"You must tell the DVLA if your health, eyesight, name or address changes in ways that affect your licence, and keep your driving licence details up to date.",
"Vehicle tax (often called road tax or VED) must be kept current even if the vehicle is rarely used — if it's off the road and not taxed, it should be declared SORN.",
"You can apply for a provisional licence from 15 years 9 months and start driving a car from 17; a supervising driver must be 21 or over and have held a full licence for that category for at least 3 years, and L plates must be shown front and rear.",
"Under the New Drivers Act, getting 6 or more penalty points within 2 years of passing your test revokes your licence — you then have to reapply as a learner and retake both tests.",
"From age 70, a driving licence must be renewed every 3 years instead of the usual 10-year photocard cycle.",
"When you sell a car privately, tell DVLA straight away and give the buyer the green \"new keeper\" slip from the V5C registration certificate (the log book).",
"\"Fronting\" — naming someone else as the main driver purely to get a cheaper premium — is insurance fraud and can invalidate the policy.",
"The eyesight standard for driving requires you to read a number plate from 20 metres; you must tell DVLA about any condition affecting both eyes, or your remaining eye if you have only one."
],

questions:[
{q:"How old must a vehicle normally be before it needs its first MOT test in Great Britain?",options:["1 year","3 years","5 years","No MOT is ever required"],correct:1,explain:"Most vehicles need their first MOT three years after first registration."},
{q:"What is the minimum level of insurance cover required by law to drive on the road?",options:["Fully comprehensive","Third party","Third party, fire and theft only","No insurance is legally required"],correct:1,explain:"Third-party cover, protecting others if you cause damage or injury, is the legal minimum."},
{q:"What does \"third party, fire and theft\" cover add compared with basic third-party cover?",options:["Cover for your own vehicle if it's stolen or damaged by fire","Cover for the other driver's medical bills","Nothing extra","Cover for parking fines"],correct:0,explain:"It adds protection for your own car against fire and theft, on top of third-party cover."},
{q:"If you develop a medical condition that could affect your driving, you should:",options:["Only tell your doctor","Inform the DVLA if it's a notifiable condition","Wait until your next MOT","Do nothing unless stopped by police"],correct:1,explain:"Certain conditions must be reported to the DVLA, who assess whether you can keep driving."},
{q:"What does SORN stand for and when is it used?",options:["A record of speeding offences","Statutory Off Road Notification, declared when a vehicle is untaxed and kept off the public road","A type of insurance","A category of driving licence"],correct:1,explain:"SORN tells the DVLA a vehicle is off the road and doesn't need tax while it stays there."},
{q:"You let a friend borrow your car. What should you check first?",options:["Nothing, insurance always transfers automatically","That your insurance policy covers them to drive it","That they have a passport","That the car has a full tank"],correct:1,explain:"Insurance cover for other drivers varies by policy — always check before lending your car."},
{q:"Vehicle tax (VED) is generally required:",options:["Only if the vehicle does more than 10,000 miles a year","For any vehicle kept and used on the public road","Only for vehicles over 10 years old","Only for commercial vehicles"],correct:1,explain:"Any vehicle used or kept on the public road must be taxed unless it's declared SORN."},
{q:"Your MOT certificate has expired but the car seems fine. What's the legal position?",options:["It's fine to keep driving as long as it passes visually","It's an offence to drive without a valid MOT, with narrow exceptions like driving to a pre-booked test","MOT is optional for private cars","MOT only matters for insurance, not legality"],correct:1,explain:"Driving without a valid MOT is an offence, aside from a few specific permitted journeys."},
{q:"At what age can you first apply for a provisional car driving licence in Great Britain?",options:["15 years and 9 months","16 years old","17 years old","18 years old"],correct:0,explain:"DVLA allows applications from 15 years 9 months, although you cannot actually start driving a car until you turn 17."},
{q:"What is the earliest age you can legally drive a car on the road using a provisional licence?",options:["16","17","18","21"],correct:1,explain:"A provisional licence holder may start driving a standard car from age 17, subject to supervision rules."},
{q:"What qualification must someone have to supervise a learner driver in a car?",options:["Just a full licence of any category","A full licence for that category held for at least 3 years, and be 21 or over","Any driver over 25","A professional instructor qualification only"],correct:1,explain:"The Highway Code requires a supervising driver to be at least 21 and to have held a full licence in that category for a minimum of three years."},
{q:"When must L plates be displayed on a car?",options:["Only on the rear window","Only when parked","Clearly on the front and rear whenever a learner is driving","Only on motorways"],correct:2,explain:"L plates must be visible from the front and rear at all times a learner is at the wheel, and removed when they are not."},
{q:"Can a learner car driver practise on a motorway?",options:["Never, under any circumstances","Yes, but only accompanied by an approved driving instructor in a dual-control car","Yes, with any supervising driver","Only after passing the theory test"],correct:1,explain:"Since 2018, learners may only drive on motorways when accompanied by an approved driving instructor in a vehicle fitted with dual controls."},
{q:"Which licence category must you hold to drive an ordinary car?",options:["Category A","Category B","Category C","Category AM"],correct:1,explain:"Category B on a driving licence covers standard cars up to a certain weight and number of passenger seats."},
{q:"Under the New Drivers Act, what happens if you get 6 or more penalty points within 2 years of passing your first driving test?",options:["You receive a warning letter only","Your licence is revoked and you must reapply and retake both tests","You pay a fine but keep your licence","Nothing, as the points simply expire sooner"],correct:1,explain:"New drivers who reach 6 points within two years of passing have their licence automatically revoked and must requalify as a learner."},
{q:"How often must a driving licence normally be renewed once the holder turns 70?",options:["Every year","Every 3 years","Every 10 years","It never needs renewing again"],correct:1,explain:"From age 70, driving licences must be renewed every three years instead of the usual ten-year photocard cycle."},
{q:"If you take your own car to drive in another country, which document should you carry in addition to your licence and insurance?",options:["Your MOT test centre receipt","The vehicle registration certificate (V5C)","A copy of the Highway Code","Your home council tax bill"],correct:1,explain:"The V5C proves you are the registered keeper of the vehicle and may be requested by authorities abroad."},
{q:"What must a certificate of motor insurance show?",options:["The car's current market value","The policyholder's name and the period of cover","The driver's theory test score","The vehicle's MOT history"],correct:1,explain:"A certificate of insurance confirms who is insured, which vehicle, and the exact dates the cover is valid for."},
{q:"What is the V5C document commonly known as?",options:["The log book","The green card","The counterpart licence","The SORN certificate"],correct:0,explain:"The V5C registration certificate is widely referred to as the vehicle's log book."},
{q:"When you sell your car privately, who is responsible for telling DVLA about the change of keeper?",options:["The buyer, within a month","The seller, straight away","Neither party needs to inform DVLA","The garage that facilitated the sale"],correct:1,explain:"The seller is legally required to notify DVLA of the change of keeper as soon as the sale takes place."},
{q:"What should you hand to the buyer when you sell your vehicle privately?",options:["The MOT certificate only","The green 'new keeper' slip from the V5C","Your personal driving licence","The original sales receipt from when you bought it"],correct:1,explain:"The V5C includes a tear-off new keeper supplement (V5C/2) that the seller gives to the buyer to register the change."},
{q:"You drive a company car for both work and personal trips. What should you confirm before using it privately?",options:["That it has a full tank of fuel","That the insurance policy covers personal as well as business use","That it has passed its last service","That the company logo is displayed"],correct:1,explain:"Some company car policies only cover business use, so personal journeys could be uninsured unless this is checked."},
{q:"Why do insurance premiums tend to be higher for newly qualified young drivers?",options:["Insurers charge everyone the same regardless of risk","Statistics show they are involved in proportionally more accidents and claims","Young drivers always choose more expensive cars","It is a legal requirement to charge young drivers more"],correct:1,explain:"Insurance pricing is risk-based, and claims data show newly qualified and younger drivers have a higher accident rate."},
{q:"Historically, what was the purpose of a 'green card' when driving abroad?",options:["It allowed free fuel at participating garages","It proved you had the minimum insurance cover recognised in other countries","It exempted you from needing a driving licence abroad","It replaced the need for vehicle tax while overseas"],correct:1,explain:"The green card was an internationally recognised document confirming a motorist held valid insurance cover while driving abroad."},
{q:"Which vehicles are generally exempt from needing an annual MOT test?",options:["Any car over 10 years old","Vehicles built or first registered more than 40 years ago and not substantially changed","All diesel vehicles","Any car that has never failed a previous MOT"],correct:1,explain:"Vehicles over 40 years old qualify for historic vehicle MOT exemption provided they have not been substantially modified."},
{q:"A police officer asks to see your insurance certificate but you don't have it with you. What can you do?",options:["Refuse, as you are not required to show it","Produce it at a police station within 7 days","Wait until your next MOT to show it","Email a photo immediately and nothing more is needed"],correct:1,explain:"If you cannot produce your documents at the roadside, you are normally given 7 days to present them at a police station."},
{q:"What does a 'Driving Other Cars' extension on a comprehensive policy typically allow?",options:["Fully comprehensive cover on any car you drive","Third-party cover only, for driving a car you don't own with the owner's permission","Unlimited use of hire cars free of charge","Cover for driving abroad only"],correct:1,explain:"This extension, where included, usually gives third-party cover only when driving another person's car with their permission, not comprehensive protection."},
{q:"What could happen if you are caught driving without any insurance?",options:["A verbal warning only, with no further action","An unlimited fine, penalty points, and the vehicle may be seized","Automatic imprisonment with no fine","Nothing, as long as the car itself is taxed"],correct:1,explain:"Driving uninsured is a serious offence that can result in a substantial fine, penalty points, and police seizure of the vehicle."},
{q:"How long is a standard photocard driving licence normally valid for before it needs renewing (below age 70)?",options:["5 years","10 years","15 years","20 years"],correct:1,explain:"Photocard licences are generally valid for 10 years, after which a new photo and licence are required."},
{q:"What might you need on your licence to legally tow a large trailer or caravan, depending on when you passed your test?",options:["Category AM","Category BE","Category C1","No extra category is ever required"],correct:1,explain:"Depending on your test pass date and the trailer's weight, you may need category BE added to your licence to tow legally."},
{q:"Which licence category covers riding a moped from age 16?",options:["Category AM","Category A1","Category B1","Category Q"],correct:0,explain:"Category AM is the licence category that allows 16-year-olds to ride mopeds."},
{q:"What is 'fronting' in relation to car insurance, and why is it illegal?",options:["Paying your premium monthly instead of yearly, which is always banned","Naming someone else as the main driver to get a cheaper premium when that isn't true","Driving with the windscreen partly obscured","Insuring a car for less than its market value"],correct:1,explain:"Fronting misrepresents who actually drives the car most, which is insurance fraud and can invalidate the policy."},
{q:"What mainly determines the rate of Vehicle Excise Duty (VED) for a newly registered car?",options:["The car's colour","The vehicle's CO2 emissions at first registration","The number of previous owners","The driver's age"],correct:1,explain:"First-year VED rates are primarily banded according to a vehicle's CO2 emissions when it was first registered."},
{q:"How quickly should you tell DVLA if you change your address?",options:["Within 5 years","As soon as possible","Only when the licence is due for renewal anyway","There is no need to tell DVLA about address changes"],correct:1,explain:"DVLA records must be kept up to date promptly, as licence correspondence and vehicle records depend on an accurate address."},
{q:"When might a UK driver need an International Driving Permit (IDP) alongside their UK licence?",options:["Whenever driving outside their home county","When driving in a country that does not recognise a UK licence alone","Only when driving a hired bicycle abroad","Never, a UK licence is valid everywhere in the world"],correct:1,explain:"Some countries outside standard reciprocal arrangements require visiting drivers to hold an IDP in addition to their national licence."},
{q:"What changed for UK vehicles in October 2014 regarding tax?",options:["Vehicle tax was abolished entirely","The paper tax disc was abolished, with records kept electronically instead","All cars became exempt from tax for life","Tax discs became compulsory for the first time"],correct:1,explain:"Since October 2014, drivers no longer display a paper tax disc, as DVLA now holds vehicle tax records electronically."},
{q:"Besides mechanical safety items, what else does an MOT test check?",options:["The driver's eyesight","The vehicle's exhaust emissions","The owner's no-claims history","The driver's penalty point total"],correct:1,explain:"An MOT test includes checking that exhaust emissions meet the legal limits for that vehicle type."},
{q:"What do you usually need before you can tax a vehicle for the first time in your name?",options:["A valid MOT history from the previous owner only","The vehicle registration certificate (V5C) or new keeper slip in your name","A copy of your CV","Nothing, tax is applied automatically on sale"],correct:1,explain:"You generally need the V5C, or the new keeper supplement if you've just bought the vehicle, to tax it in your name."},
{q:"What mainly determines which motorcycle licence category (AM, A1, A2 or A) a rider can hold?",options:["The colour of the motorcycle","The rider's age and the motorcycle's power output or engine size","The number of years since passing the car test","The motorcycle's resale value"],correct:1,explain:"Motorcycle categories are tiered by minimum age and the engine size or power output the rider is permitted to use."},
{q:"What happened to the paper counterpart of the photocard driving licence in June 2015?",options:["It became compulsory to carry it at all times","It was abolished, with endorsement details now held electronically by DVLA","It was replaced by a second photocard","It was merged with the vehicle's V5C"],correct:1,explain:"DVLA scrapped the paper counterpart in 2015 and now stores licence endorsement and category details digitally instead."},
]},
{id:"incidents",name:"Incidents, Accidents and Emergencies",
notes:[
"At the scene of a collision: stop, switch on hazard lights, check for danger (fire, fuel, other traffic) before approaching, and only move casualties if there's a risk of further injury where they are.",
"If you must warn other traffic of an obstruction, a warning triangle placed well back on the same side is useful on an ordinary road — but never walk onto a motorway to place one, and never use one on the motorway itself.",
"In the UK you must stop if you're involved in a collision that injures a person or animal (other than yourself), or damages another vehicle or property, and give your details; if you can't, report it to the police within 24 hours.",
"In a vehicle fire, get everyone out and well away before calling the emergency services — don't open the bonnet, which can feed a fire more oxygen.",
"Call 999 or 112 in a genuine emergency, and give your exact location first — motorway marker posts point the way to the nearest emergency telephone and can help pinpoint where you are.",
"Basic first aid priorities: check that the airway is clear and the casualty is breathing; don't move someone with a suspected back or neck injury unless leaving them is more dangerous; keep a shocked casualty warm and calm, without food or drink.",
"Don't remove a motorcyclist's helmet after a crash unless it's actually stopping you checking their airway and breathing.",
"If a tyre bursts while driving, hold the steering wheel firmly and ease off the accelerator gradually — don't brake hard or swerve.",
"A diesel or fuel spill makes the road surface especially slippery for motorcyclists — warn other traffic and report it rather than trying to clean it up yourself.",
"After a collision involving an electric or hybrid vehicle, stay well clear — a damaged high-voltage battery can carry a risk of electric shock or fire."
],
links:[
{label:"Highway Code: Breakdowns and incidents (274–287)",url:"https://www.gov.uk/guidance/the-highway-code/breakdowns-and-incidents-274-to-287"},
{label:"Highway Code: Annex 7 — First aid on the road",url:"https://www.gov.uk/guidance/the-highway-code/annex-7-first-aid-on-the-road"}
