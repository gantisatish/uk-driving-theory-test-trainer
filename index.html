questions:[
{q:"You're first on the scene of a collision. What's your first priority?",options:["Move the casualties immediately","Check for danger — such as fire, fuel or oncoming traffic — before approaching","Take photos for insurance","Move the vehicles out of the way first"],correct:1,explain:"Making the scene safe for yourself and others comes before anything else."},
{q:"Where should you place a warning triangle to alert other traffic to an obstruction?",options:["On a motorway hard shoulder","Well back on the same side of the road on an ordinary road — never on a motorway","Directly next to the obstruction only","It doesn't matter where"],correct:1,explain:"Triangles give approaching traffic advance warning, but are never used on motorways due to the risk of walking on the carriageway."},
{q:"You're involved in a minor collision with another car and no one is hurt. You must:",options:["Drive away if the damage looks minor","Stop and exchange details with the other driver","Only stop if someone asks you to","Call the police regardless of circumstances"],correct:1,explain:"Any collision causing damage or injury requires you to stop and exchange details."},
{q:"If you can't exchange details after a collision, what must you do?",options:["Nothing further is required","Report it to the police within 24 hours","Wait a week to see if anyone complains","Only report it if asked"],correct:1,explain:"The law requires a report within 24 hours if details weren't exchanged at the scene."},
{q:"Your engine catches fire while driving. What should you do?",options:["Open the bonnet immediately to look","Stop, get everyone out and well away, then call the emergency services","Keep driving to a garage","Try to drive it to open ground while the fire is out of sight"],correct:1,explain:"Opening the bonnet can feed the fire oxygen — get clear first and let professionals handle it."},
{q:"At the scene of an accident, when should you move an injured person?",options:["Always, to get them comfortable","Only if they're in immediate further danger where they are","Never under any circumstance","Only to check for a pulse"],correct:1,explain:"Moving an injured person risks worsening injuries unless leaving them where they are is clearly more dangerous."},
{q:"You come across a broken-down vehicle with its hazard lights on in a live motorway lane. What should you do?",options:["Stop right behind it to help","Keep your own speed appropriate and move to another lane if safe, alerting following traffic as needed","Flash your lights and overtake closely","Ignore it completely"],correct:1,explain:"Stopping in a live lane to help creates more danger — pass safely and let the right people respond."},
{q:"Which of these is a correct basic first-aid priority at a road traffic collision, before professional help arrives?",options:["Give the casualty something to drink","Keep them calm, warm, and check breathing while waiting for help","Move them to a hospital yourself","Remove their helmet if they are a motorcyclist, no matter what"],correct:1,explain:"Basic reassurance, warmth and monitoring breathing are safe first steps until trained help arrives."},
{q:"Your vehicle breaks down in a live lane on the motorway. What should you do first?",options:["Stay in your lane and switch on hazard lights","Reverse carefully to the nearest exit","Try to get it onto the hard shoulder or a slip road","Get out and push it to the verge"],correct:2,explain:"Moving clear of a live traffic lane is the safest first step before anything else."},
{q:"You've stopped on the motorway hard shoulder after a breakdown. How should you leave the vehicle?",options:["By the left-hand door, away from passing traffic","By whichever door is quickest","Through the boot if the doors are blocked","By the right-hand door facing the traffic"],correct:0,explain:"Exiting on the left keeps you away from fast-moving traffic on your right."},
{q:"On a smart motorway with no hard shoulder, you break down and can't reach a refuge area. What should you do?",options:["Get out immediately and stand on the verge","Try to drive slowly to the next exit regardless","Open all doors to make the vehicle more visible","Stay in the vehicle with your seatbelt on and hazards flashing, and call for help"],correct:3,explain:"Without a safe place to stand, staying belted in with hazards on while calling for help is safer than stepping into a live lane."},
{q:"Why are motorway emergency telephones useful in a breakdown?",options:["They're free local calls to any garage","They connect you directly to a control centre that can identify your location","They automatically send a tow truck","They only work during daylight hours"],correct:1,explain:"The roadside phone link lets the operator pinpoint exactly where you are, even if you're unsure of your location."},
{q:"Which telephone numbers can you use to contact the emergency services in the UK?",options:["Only 999","Only 112","Both 999 and 112","Only 101"],correct:2,explain:"Both numbers reach UK emergency services, as 112 is the number used across Europe alongside the UK's own 999."},
{q:"When you call emergency services about a collision, what information should you give first?",options:["Your exact location and the number of people hurt","Your name and date of birth","The make and colour of your own car","Your insurance company's name"],correct:0,explain:"Location and casualty numbers let the control room send the right help to the right place quickly."},
{q:"In a remote area with no clear landmarks, what can help you describe your exact location to emergency services?",options:["Your car's engine number","The nearest postbox number","Your vehicle's tyre size","A what3words location from a smartphone app"],correct:3,explain:"Apps that convert GPS coordinates into simple word references help call handlers find precise locations quickly."},
{q:"You notice diesel has spilled on the road surface. Why is this particularly dangerous?",options:["It will set off nearby fire alarms","It makes the road surface slippery, especially for motorcyclists","It damages tyre rubber instantly","It is more flammable than petrol"],correct:1,explain:"Diesel spills create a slick film on the road that can cause two-wheeled vehicles to lose grip suddenly."},
{q:"You see a fuel spill on the carriageway after a breakdown. What should you do?",options:["Pour water over it immediately","Drive through it slowly to disperse it","Warn other traffic and report it; don't try to clean it up yourself","Ignore it, as it will evaporate quickly"],correct:2,explain:"Fuel spills need proper handling by trained responders, so warning others and reporting it is the safe action."},
{q:"Your vehicle has caught a small fire under the bonnet. When is it appropriate to use a fire extinguisher yourself?",options:["Only if the fire is small and you can do so without putting yourself at risk","Always, no matter how large the fire is","Only if you are on a motorway","Only if the engine is still running"],correct:0,explain:"A fire extinguisher should only be used on a small, manageable fire; otherwise get clear and call the fire service."},
{q:"You find an unconscious casualty at a collision scene. What should you check first?",options:["Their pulse rate for exactly one minute","Whether they are wearing a seatbelt","Their name and address","That their airway is clear and they are breathing"],correct:3,explain:"Checking airway and breathing comes first because these are immediately life-threatening if blocked or absent."},
{q:"A casualty is not breathing normally and you are trained in first aid. What should you do?",options:["Wait for the ambulance without doing anything","Begin CPR (chest compressions) while help is on the way","Give them water to drink","Place them in the car and drive to hospital"],correct:1,explain:"Starting CPR promptly can keep blood circulating to vital organs until professional help arrives."},
{q:"An injured motorcyclist is lying at the roadside still wearing their helmet. What should you do?",options:["Remove it straight away so they can breathe easier","Remove it only if it's a full-face design","Leave the helmet in place unless it's stopping you checking their airway","Loosen the chin strap but leave the helmet on their head permanently fixed"],correct:2,explain:"Removing a helmet unnecessarily can worsen a neck injury, so it should stay on unless it's blocking the airway."},
{q:"A casualty at a collision scene is conscious but shows signs of shock, such as being pale and cold. What should you do?",options:["Keep them warm and reassure them, without giving food or drink","Give them a hot sweet drink to help them recover","Encourage them to stand up and walk around","Leave them alone until paramedics arrive"],correct:0,explain:"Keeping a shocked casualty warm and calm helps their condition without risking choking from food or drink."},
{q:"You suspect a casualty has a back or neck injury after a crash. What should you do?",options:["Sit them upright to help them breathe","Move them onto their side straight away","Remove their coat to check for injuries","Avoid moving them unless they're in immediate danger"],correct:3,explain:"Moving someone with a suspected spinal injury can cause further, potentially serious, damage."},
{q:"A casualty is trapped in a vehicle and you cannot free them safely. What should you do?",options:["Pull them out as quickly as possible regardless","Leave them in place and wait for the fire and rescue service","Try to lever the door off with a tool from your boot","Disconnect the car battery yourself to free them"],correct:1,explain:"Specialist rescue equipment and training are usually needed to free a trapped casualty without causing more injury."},
{q:"You witness another driver overtaking dangerously and nearly causing a crash. What should you do?",options:["Flash your lights and overtake them to show your disapproval","Follow them closely until they stop","Note the vehicle's registration and details, then report it to the police","Ignore it, as it's not your concern"],correct:2,explain:"Reporting the registration and circumstances to the police lets them act without you putting yourself at risk."},
{q:"Your vehicle breaks down and stalls while crossing a railway level crossing. What should you do?",options:["Get everyone out and clear of the crossing, then contact the signal operator","Stay in the vehicle and wait for the barriers to open","Try repeatedly to restart the engine while still on the crossing","Push the vehicle forward onto the tracks to clear them"],correct:0,explain:"Getting clear of the crossing protects lives, and the signal operator's phone (shown at the crossing) can stop trains in time."},
{q:"A tyre bursts while you're driving at speed. What is the correct response?",options:["Brake hard immediately to stop as quickly as possible","Swerve sharply to the hard shoulder","Take your hands off the wheel to let the car correct itself","Hold the steering wheel firmly and ease off the accelerator gradually"],correct:3,explain:"Easing off gently while keeping a firm, steady grip helps you keep control, whereas harsh braking can cause a skid."},
{q:"After a tyre bursts and you bring the vehicle safely to a stop, what should you do next?",options:["Continue driving slowly to the nearest garage","Move it off the road if possible, switch on hazard lights, and arrange recovery or change the tyre safely","Leave the vehicle exactly where it stopped, even in a live lane","Remove the wheel immediately without warning other traffic"],correct:1,explain:"Getting the vehicle out of the way and warning others reduces the risk of a secondary collision while you deal with the tyre."},
{q:"Your car breaks down on a motorway and cannot be restarted. What should you NOT do?",options:["Call a recognised vehicle recovery service","Attempt to repair it yourself on the carriageway","Switch on your hazard warning lights","Move to the hard shoulder or verge if possible"],correct:1,explain:"Carrying out repairs on a live carriageway puts you at serious risk from passing traffic; recovery should be left to professionals."},
{q:"You notice smoke coming from under the bonnet, but there is no visible flame. What should you do?",options:["Pull over safely, switch off the engine, and investigate cautiously","Keep driving until you reach your destination","Open the bonnet immediately while still moving","Pour water over the bonnet while driving"],correct:0,explain:"Stopping and turning off the engine reduces the chance of the problem developing into a fire while you assess it safely."},
{q:"You stop to help at a motorway incident. What should you do before approaching the scene on foot?",options:["Walk into the live lanes to direct traffic","Leave your own hazard lights off so as not to distract drivers","Run across the carriageway to reach the casualty faster","Put on a hi-vis vest if you have one and stay behind the safety barrier where possible"],correct:3,explain:"Being visible and staying behind a barrier protects you from passing traffic while you assist."},
{q:"Your car is involved in a minor collision and is blocking part of the road, but it's still driveable. What should you do?",options:["Leave it exactly where it stopped, whatever the risk to others","Move it to the side of the road if it's safe to do so","Reverse at speed to clear the road","Abandon it and leave the scene immediately"],correct:1,explain:"Clearing an obstruction safely reduces the risk of a further collision, provided it doesn't destroy evidence needed later."},
{q:"Why should you switch off the ignition of a vehicle involved in a collision, if it's safe to do so?",options:["To stop the radio from playing","To prevent the battery from charging","To reduce the risk of fire","To stop the headlights from dazzling other drivers"],correct:2,explain:"A running engine or electrical system can increase the risk of fire, particularly if fuel has leaked."},
{q:"An electric or hybrid vehicle is involved in a collision. Why should you stay well clear of it?",options:["There's a risk of electric shock or a battery fire","Electric vehicles are heavier and may roll","The vehicle will automatically restart itself","It will make a loud warning noise"],correct:0,explain:"Damaged high-voltage batteries in electric and hybrid vehicles can pose shock and fire risks that need specialist handling."},
{q:"While driving on a motorway, you see a collision on the opposite carriageway. What should you do?",options:["Stop on your side and run across to help","Slow down and take photos as you pass","Pull onto the hard shoulder to get a better view","Continue driving and alert the emergency services if it looks unattended"],correct:3,explain:"Crossing or stopping on a motorway to reach the other carriageway is extremely dangerous; it's safer to keep moving and report it."},
{q:"You need to give first aid for a casualty's bleeding wound. What should you do?",options:["Wash the wound thoroughly with water first","Apply firm, direct pressure to the wound with a clean pad or cloth","Leave the wound uncovered to let it dry","Apply a tight tourniquet above the wound as the first step"],correct:1,explain:"Firm direct pressure is the most effective immediate way to slow bleeding until professional help arrives."},
{q:"What details must you provide to another person involved in a collision where damage or injury has occurred?",options:["Only your mobile phone number","Only your vehicle's colour and model","Your name and address, and the vehicle owner's details if different","Only the location of the nearest police station"],correct:2,explain:"The law requires you to give your own and, if different, the vehicle owner's name and address along with the vehicle details."},
{q:"Why should you switch on your hazard warning lights when you stop at the scene of an incident?",options:["To warn approaching traffic that there is a hazard ahead","To charge your car battery while stationary","Because it's a legal requirement at all times when parked","To signal to passengers that it's safe to get out"],correct:0,explain:"Hazard lights alert other drivers to slow down and take care before they reach the obstruction."},
{q:"At a collision with several casualties, how should you decide who to help first if you're not professionally trained?",options:["The youngest casualty","The one closest to you","The one who is shouting loudest","The one with the most life-threatening injury, such as difficulty breathing"],correct:3,explain:"Life-threatening conditions like breathing difficulty need the quickest attention, regardless of position or age."},
{q:"Before leaving an injured but conscious casualty to go and call for help, what should you do?",options:["Ask them to try standing up and walking with you","Make them as comfortable and reassured as possible first","Tell them to drive themselves to hospital","Leave immediately without saying anything"],correct:1,explain:"Reassuring and settling the casualty before leaving reduces their distress and risk of worsening shock while you get help."},
]},
{id:"vehicle-loading",name:"Vehicle Loading",
notes:[
"An overloaded car handles poorly — stopping distances increase, and the vehicle may become harder to control, especially at speed or in bends.",
"A load should be secured so it can't move or fall from the vehicle; carrying something on a roof rack changes the car's height, overall width and handling, especially in crosswinds.",
"When towing a trailer or caravan, the overall combination length, width and weight limits must be respected, and a properly fitted number plate matching the towing vehicle's is required on the trailer.",
"Children should travel in a suitable child restraint appropriate to their height or weight, and it's the driver's responsibility to ensure passengers under 14 wear a seatbelt or appropriate restraint.",
"Trailers over about 750kg maximum gross weight must have their own brakes, and a breakaway cable should automatically apply them if the trailer detaches from the car.",
"The maximum width for a trailer towed by a car is 2.55 metres; towing speed limits are 60mph on motorways and dual carriageways, and 50mph on single carriageways.",
"Load heavy items low down and towards the front of the boot to keep the centre of gravity low, and spread roof-rack weight evenly from side to side.",
"Check your vehicle's maximum permitted gross weight (on the manufacturer's plate) and each tyre's load rating before loading up or hitching a trailer.",
"A badly set caravan noseweight, or an unevenly loaded trailer, is a common cause of snaking or jackknifing, especially at higher speed.",
"Towing a larger trailer or caravan may need category BE added to your licence, depending on when you passed your test and the combined weight being towed."
],
links:[
{label:"Highway Code: Rules for drivers and motorcyclists — towing and loading (89–102)",url:"https://www.gov.uk/guidance/the-highway-code/rules-for-drivers-and-motorcyclists-89-to-102"}
],
questions:[
{q:"What is the main risk of an overloaded vehicle?",options:["Improved fuel economy","Longer stopping distances and reduced control","Better grip in corners","No real difference to handling"],correct:1,explain:"Extra weight changes how the car brakes, corners and responds generally."},
{q:"Carrying a heavy load on a roof rack affects the car's handling mainly because it:",options:["Has no effect if secured","Raises the centre of gravity, increasing the risk of instability, especially in crosswinds or bends","Improves aerodynamics","Reduces fuel consumption"],correct:1,explain:"A higher centre of gravity makes the car more prone to leaning or becoming unstable."},
{q:"Whose responsibility is it to ensure a child under 14 is properly restrained in the car?",options:["The child's own responsibility","The driver's responsibility","Only the parent if present","No one's — it's optional"],correct:1,explain:"The driver is legally responsible for making sure under-14 passengers are correctly restrained."},
{q:"What must a trailer display when being towed?",options:["Nothing extra is required","A number plate matching the towing vehicle","Hazard lights at all times","A roof rack warning sign"],correct:1,explain:"A matching number plate is a legal requirement for a towed trailer."},
{q:"Why should a load in the boot be secured rather than left loose?",options:["Loose items have no real risk","An unsecured load can shift and become dangerous in a sudden stop or collision","It only matters for off-road driving","Securing a load is only required for lorries"],correct:1,explain:"A heavy loose item becomes a serious hazard to occupants if the car brakes suddenly."},
{q:"Before towing a caravan, what should you check?",options:["Only the caravan's tyre pressure","That the combined weight and dimensions are within your vehicle's and licence's towing limits","Nothing, any car can tow any caravan","Only that the caravan has lights"],correct:1,explain:"Towing limits depend on both the vehicle's capability and the driver's licence entitlement."},
{q:"How does an unevenly distributed load in a trailer typically affect towing?",options:["It has no effect if the total weight is correct","It can cause snaking or instability at speed","It improves stability","It only matters when parked"],correct:1,explain:"Uneven weight distribution is a common cause of a trailer swaying or snaking at speed."},
{q:"A roof box significantly increases your vehicle's overall height. Why does this matter?",options:["It doesn't matter for ordinary driving","You may no longer clear low bridges or multi-storey car park barriers that previously fit","It only affects fuel economy","It only matters off-road"],correct:1,explain:"A taller vehicle profile can mean previously clear routes are no longer safe to use."},
{q:"If the caravan you're towing is wider than your car, what should you fit before setting off?",options:["Wide-angle towing mirrors","An extra rear fog light","A reversing camera only","A larger exhaust pipe"],correct:0,explain:"Standard mirrors may not give a clear view past a wider trailer, so extended towing mirrors are needed to see along both sides."},
{q:"What is the main purpose of fitting a stabiliser to a caravan?",options:["To legally increase the maximum towing weight","To reduce snaking and pitching, though it doesn't replace correct loading","To remove the need for towing mirrors","To allow faster motorway speeds"],correct:1,explain:"A stabiliser damps sideways and up-and-down movement but cannot correct instability caused by a badly loaded trailer."},
{q:"Where would you find your vehicle's maximum permitted gross weight?",options:["On the tyre sidewall","On the manufacturer's plate (often in the door shut or engine bay)","On the fuel filler cap","On the insurance certificate"],correct:1,explain:"The manufacturer's plate states the vehicle's maximum gross weight and axle weights that must never be exceeded when loading."},
{q:"A tyre's sidewall shows a load index number. What does this indicate?",options:["The maximum load that tyre can safely carry","The recommended tyre pressure","The date the tyre was manufactured","The maximum towing weight allowed"],correct:0,explain:"Loading a vehicle beyond what its tyres are rated for increases the risk of overheating and tyre failure."},
{q:"What is a likely effect of fitting a roof box, even when it's empty?",options:["Reduced fuel consumption","Increased fuel consumption due to extra drag","A higher top speed","Less tyre wear"],correct:1,explain:"A roof box increases wind resistance, so the engine has to work harder and uses more fuel to overcome the extra drag."},
{q:"Your rear-mounted cycle carrier is blocking your number plate and rear lights. What must you do?",options:["Nothing, this is permitted","Fit a duplicate lighting board and number plate","Only drive during daylight hours","Remove the rear bumper"],correct:1,explain:"It's an offence to drive with an obscured number plate or lights, so a duplicate board must be fitted to show both clearly."},
{q:"What is the safest way to carry a dog in your car?",options:["Loose on the back seat","Sitting on a passenger's lap","Secured with a suitable harness, carrier or dog guard","In the front footwell"],correct:2,explain:"An unrestrained pet can be thrown around in a sudden stop and may also distract the driver."},
{q:"Setting a caravan's noseweight too low or too high mainly increases the risk of:",options:["Engine overheating","Snaking and instability while towing","A higher insurance premium","Flat tyres"],correct:1,explain:"The weight pressing down on the tow ball affects how the combination behaves, so it must be kept within the manufacturer's recommended range."},
{q:"To tow a larger trailer or caravan beyond standard category B entitlement, a driver may need:",options:["No extra requirement at all","Category B+E (BE) entitlement, depending on the combination's weight","Only a provisional licence","A taxi driver's licence"],correct:1,explain:"Depending on when the driving test was passed and the combined weight being towed, extra entitlement or a further test may legally be required."},
{q:"What is 'jackknifing' when towing a trailer?",options:["The trailer overtakes the towing car on a bend","The trailer swings violently and folds against the towing vehicle, often under harsh braking","The trailer's brakes fail completely","The towing vehicle reverses uncontrollably"],correct:1,explain:"Harsh braking or excessive speed, especially downhill, can cause the trailer to push forward and swing round against the tow car."},
{q:"What is the maximum permitted width for a trailer towed by a car in the UK?",options:["2.00 metres","2.55 metres","3.00 metres","There is no limit"],correct:1,explain:"UK law sets 2.55 metres as the maximum width for trailers towed by ordinary passenger vehicles."},
{q:"Must seatbelts be worn as normal by occupants of a car that is towing a caravan?",options:["No, towing exempts occupants from seatbelt law","Only the driver needs to wear one","Yes, the usual seatbelt law still applies in the towing vehicle","Only if travelling on a motorway"],correct:2,explain:"Towing a trailer does not change the normal legal requirement for seatbelts to be worn in the towing vehicle."},
{q:"When loading several items onto a roof rack, you should:",options:["Put everything on one side for easy access","Spread the weight evenly from side to side","Place the heaviest item right at the back","Leave the front completely empty"],correct:1,explain:"Uneven side-to-side weight can make the car pull to one side and worsen handling, particularly in crosswinds."},
{q:"What is the national speed limit for a car towing a caravan on a motorway?",options:["70 mph","60 mph","50 mph","40 mph"],correct:1,explain:"Vehicles towing a trailer or caravan have a reduced national limit of 60 mph on motorways and dual carriageways."},
{q:"When loading heavy items into your car's boot, you should generally:",options:["Place them as high as possible","Place them low down and towards the front of the boot","Place them only on the rear seat","Stack them against the rear window"],correct:1,explain:"Keeping heavy items low and as far forward as practical helps keep the car's centre of gravity low and stable."},
{q:"If you're carrying a heavier load than usual, what should you check and possibly adjust?",options:["The wing mirror angle only","Tyre pressures, as specified in the vehicle handbook","The radio settings","The windscreen washer level"],correct:1,explain:"Vehicle handbooks often specify higher tyre pressures for heavier loads to maintain safe handling and tyre life."},
{q:"Trailers over roughly what weight must be fitted with their own braking system?",options:["250 kg","750 kg","1,500 kg","3,500 kg"],correct:1,explain:"UK rules require trailers above about 750 kg maximum gross weight to have brakes of their own, linked to the tow vehicle."},
{q:"Reversing a car with a trailer attached is more difficult mainly because:",options:["The trailer brakes apply automatically","Steering responses move the trailer the opposite way to usual","The engine cuts out while reversing","The trailer's indicators stop working"],correct:1,explain:"Turning the steering wheel while reversing with a trailer moves the trailer in the opposite direction to normal, making control harder."},
{q:"What is the purpose of a breakaway cable fitted to a trailer or caravan?",options:["To tow a second trailer at the same time","To automatically apply the trailer's brakes if it detaches from the car","To charge the trailer's battery","To secure the jockey wheel in place"],correct:1,explain:"If the coupling fails, the breakaway cable pulls on the trailer's brakes so it doesn't continue freely on its own."},
{q:"A heavy load in the boot causes the rear of the car to sit lower. What effect can this have?",options:["The headlights turn off automatically","Headlight beams may dazzle oncoming drivers unless adjusted","The headlights become permanently brighter","The fog lights activate automatically"],correct:1,explain:"Extra weight at the rear tilts the car and raises the headlight beam, so aim may need adjusting to avoid dazzling other drivers."},
{q:"Before setting off while towing, you should check that the coupling head is:",options:["Loosely resting on the tow ball","Correctly engaged and locked onto the tow ball","Removed to improve airflow","Held in place only by the safety chain"],correct:1,explain:"An improperly engaged coupling can separate from the tow ball while driving, so it must be confirmed as fully locked before moving off."},
{q:"Before towing off with a caravan, the jockey wheel should be:",options:["Left down to support the nose while driving","Wound up and secured clear of the ground","Removed completely and never refitted","Used as the main support during sharp turns"],correct:1,explain:"The jockey wheel is only for manoeuvring the caravan while uncoupled, so it must be raised and secured before driving."},
{q:"Towing a high-sided caravan makes a vehicle more vulnerable to:",options:["Increased windscreen wiper wear","Being blown off course by strong crosswinds, especially on exposed roads or bridges","Faster acceleration than normal","A reduced legal towing weight limit"],correct:1,explain:"The caravan's large flat side catches crosswinds easily, which can push the whole combination sideways in exposed or gusty locations."},
{q:"After fitting a roof box that increases your vehicle's height, a sensible precaution is to:",options:["Ignore it, as cars rarely hit bridges","Put a height reminder sticker inside the car where the driver will see it","Remove the wing mirrors to compensate","Only drive on motorways"],correct:1,explain:"A visible reminder of the new overall height helps the driver remember to avoid low bridges, barriers or car parks it may no longer clear."},
{q:"If you don't currently need your roof rack or box fitted, it's a good idea to remove it because:",options:["It's illegal to drive with an empty roof rack","It reduces drag, fuel consumption and unnecessary extra height","It improves in-car radio reception","It's required before every MOT test"],correct:1,explain:"Even when empty, a roof rack or box adds wind resistance and height, so removing it when unneeded saves fuel and avoids clearance problems."},
{q:"In an estate car or hatchback without a boot partition, what helps protect occupants if the load shifts?",options:["Folding the rear seats forward only","Fitting a load guard or dog guard behind the rear seats","Opening the boot slightly while driving","Covering the load with a blanket"],correct:1,explain:"A load guard creates a barrier so items in the load area can't be thrown into the passenger compartment during a sudden stop."},
{q:"Before regularly towing a trailer or caravan, a driver should check that:",options:["Their motor insurance covers towing","Only the trailer needs separate insurance","Insurance is optional for trailers under one tonne","Their vehicle's warranty covers the trailer"],correct:0,explain:"Not all car insurance policies automatically cover towing, so cover should be confirmed before setting off with a trailer."},
{q:"When towing a caravan, overtaking generally takes longer mainly because:",options:["The combination has a lower speed limit and is longer and heavier","Trailers are not permitted to overtake at all","Mirrors cannot be used while overtaking","The towing speed limit is higher than normal"],correct:0,explain:"The extra length and weight, combined with the reduced towing speed limit, mean more time and road space are needed to overtake safely."},
{q:"A caravan has done very few miles but its tyres are eight years old. What should the driver consider?",options:["Tyres don't age if mileage is low, so no action is needed","Tyres can perish with age even when barely used, so they should be checked or replaced","Older tyres grip better than new ones","Tyre age only matters for motorcycles"],correct:1,explain:"Rubber degrades over time from weather and UV exposure even without much use, so old trailer tyres should be inspected regardless of mileage."},
{q:"Which statement about trailer length rules in the UK is correct?",options:["There is no maximum length for any trailer","Trailers towed by cars must not exceed specific maximum lengths set by law","Length limits apply only to motorcycle-towed trailers","Length limits apply only on motorways"],correct:1,explain:"UK law sets maximum permitted lengths for trailers, and exceeding these limits is illegal regardless of the type of road used."},
{q:"On a motorway with three or more lanes, a car towing a trailer must not normally:",options:["Use the left-hand lane","Exceed 40 mph","Use the right-hand (outermost) lane","Use its indicators"],correct:2,explain:"Vehicles towing a trailer are generally required to stay out of the outermost lane on motorways with three or more lanes, except in permitted circumstances."},
{q:"When choosing a coupling or tow ball for a trailer, it's essential that:",options:["Any size will fit any trailer","It matches the trailer's coupling size and is rated for its weight","It is painted a bright colour","It is removed between every journey"],correct:1,explain:"A mismatched or under-rated coupling may not hold securely or support the trailer's weight, risking separation while driving."},
]}
];

const STORE_KEY = "roadToPass_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {topicStats:{}, mockHistory:[]};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
TOPICS.forEach(t=>{ if(!state.topicStats[t.id]) state.topicStats[t.id] = {attempted:0, correct:0}; });

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function masteryPct(topicId){
  const s = state.topicStats[topicId];
  if(!s || s.attempted===0) return null;
  return Math.round((s.correct/s.attempted)*100);
}
function masteryColor(pct){
  if(pct===null) return "var(--ink-soft)";
  if(pct<50) return "var(--red)";
  if(pct<80) return "var(--amber)";
  return "var(--green)";
}
function statusPill(pct){
  if(pct===null) return '<span class="status-pill pill-new">Not started</span>';
  if(pct<50) return '<span class="status-pill pill-low">'+pct+'% mastery</span>';
  if(pct<80) return '<span class="status-pill pill-mid">'+pct+'% mastery</span>';
  return '<span class="status-pill pill-high">'+pct+'% mastery</span>';
}

const viewEl = document.getElementById("view");
const tabs = document.querySelectorAll(".tab");
let currentView = "dashboard";
let practiceState = null;
let examState = null;

tabs.forEach(tab=>{
  tab.addEventListener("click", ()=>{
    goTo(tab.dataset.view);
  });
});

function goTo(view){
  if(view==="exam" && examState && examState.phase==="running"){
    currentView = "exam"; render(); return;
  }
  currentView = view;
  if(view!=="practice") practiceState = null;
  render();
}

function setTab(){
  tabs.forEach(t=> t.setAttribute("aria-selected", t.dataset.view===currentView ? "true":"false"));
}

function render(){
  setTab();
  if(currentView==="dashboard") renderDashboard();
  else if(currentView==="study") renderStudy();
  else if(currentView==="practice") renderPractice();
  else if(currentView==="exam") renderExam();
}

function overallStats(){
  let attempted=0, correct=0, startedTopics=0;
  TOPICS.forEach(t=>{
    const s = state.topicStats[t.id];
    attempted += s.attempted; correct += s.correct;
    if(s.attempted>0) startedTopics++;
  });
  const avgMastery = attempted>0 ? Math.round((correct/attempted)*100) : 0;
  const lastMock = state.mockHistory.length ? state.mockHistory[state.mockHistory.length-1] : null;
  const bestMock = state.mockHistory.length ? state.mockHistory.reduce((a,b)=> b.score>a.score?b:a) : null;
  return {attempted, correct, startedTopics, avgMastery, lastMock, bestMock};
}

function weakestTopic(){
  let pick = null, pickPct = 101;
  TOPICS.forEach(t=>{
    const s = state.topicStats[t.id];
    if(s.attempted===0){ if(pick===null || pickPct>100){ pick=t; pickPct=101; } return; }
    const pct = Math.round((s.correct/s.attempted)*100);
    if(pct < pickPct){ pick=t; pickPct=pct; }
  });
  return pick;
}

function renderDashboard(){
  const o = overallStats();
  const weak = weakestTopic();
  let html = "";
  html += '<div class="disclaimer">Practice questions here are written to match the DVSA theory test syllabus and the Highway Code — they are original revision material, not the official DVSA question bank.</div>';
  html += '<div class="section-head"><h2>Your progress</h2><span class="sub">'+o.startedTopics+' of 14 topics started</span></div>';
  html += '<div class="stat-row">';
  html += '<div class="stat-tile accent-green"><div class="num">'+o.avgMastery+'%</div><div class="lbl">Avg. topic mastery</div></div>';
  html += '<div class="stat-tile accent-blue"><div class="num">'+(o.lastMock ? o.lastMock.score+'/'+o.lastMock.total : "—")+'</div><div class="lbl">Last mock score</div></div>';
  html += '<div class="stat-tile accent-amber"><div class="num">'+(o.bestMock ? o.bestMock.score+'/'+o.bestMock.total : "—")+'</div><div class="lbl">Best mock score</div></div>';
  html += '<div class="stat-tile"><div class="num">'+o.attempted+'</div><div class="lbl">Questions answered</div></div>';
  html += '</div>';

  html += '<div class="cta-row">';
  if(weak){
    html += '<button class="btn primary" data-action="practice-topic" data-topic="'+weak.id+'">Continue with '+weak.name+'</button>';
  }
  html += '<button class="btn" data-action="goto" data-view="exam">Start a mock exam</button>';
  html += '</div>';

  html += '<div class="section-head"><h2>Topic mastery</h2><span class="sub">Pass mark 43/50</span></div>';
  html += '<div class="topic-grid">';
  TOPICS.forEach((t,i)=>{
    const pct = masteryPct(t.id);
    const barPct = pct===null ? 0 : pct;
    html += '<button class="topic-card" data-action="practice-topic" data-topic="'+t.id+'">';
    html += '<div class="row1"><span class="topic-num">'+(i+1)+'</span><h3>'+t.name+'</h3></div>';
    html += '<div class="bar"><span style="width:'+barPct+'%;background:'+masteryColor(pct)+'"></span></div>';
    html += '<div class="topic-meta">'+statusPill(pct)+'<span>'+state.topicStats[t.id].attempted+' answered</span></div>';
    html += '</button>';
  });
  html += '</div>';

  if(state.mockHistory.length){
    html += '<div class="section-head" style="margin-top:28px;"><h2>Mock exam history</h2></div>';
    html += '<div class="panel">';
    state.mockHistory.slice().reverse().slice(0,8).forEach(h=>{
      const pass = h.score>=43;
      html += '<div class="history-row"><span>'+new Date(h.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+'</span><span style="font-weight:700;color:'+(pass?"var(--green)":"var(--red)")+'">'+h.score+'/'+h.total+' — '+(pass?"Pass":"Fail")+'</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="section-head" style="margin-top:28px;"><h2>Want more practice?</h2></div>';
  html += '<div class="panel">';
  html += '<p style="margin:0 0 10px;">This app can\'t replicate the real hazard perception video clips. For that — and for an official free mock exam alongside this one — use the DVSA\'s own practice test:</p>';
  html += '<ul class="links-list"><li><a href="https://www.gov.uk/take-practice-theory-test" target="_blank" rel="noopener">GOV.UK: free official practice theory test (multiple choice + hazard perception clips)</a></li><li><a href="https://www.gov.uk/theory-test/revision-and-practice" target="_blank" rel="noopener">GOV.UK: theory test revision and practice options</a></li></ul>';
  html += '</div>';

  viewEl.innerHTML = html;
  wireActions();
}

function wireActions(){
  viewEl.querySelectorAll('[data-action="goto"]').forEach(el=> el.addEventListener("click", ()=> goTo(el.dataset.view)));
  viewEl.querySelectorAll('[data-action="practice-topic"]').forEach(el=> el.addEventListener("click", ()=>{
    currentView = "practice";
    startPractice(el.dataset.topic);
  }));
  viewEl.querySelectorAll('[data-action="open-topic"]').forEach(el=> el.addEventListener("click", ()=>{
    renderStudyDetail(el.dataset.topic);
  }));
}

function renderStudy(studyOpenId){
  let html = '<div class="section-head"><h2>Study notes</h2><span class="sub">All 14 DVSA theory topics</span></div>';
  html += '<div class="topic-grid">';
  TOPICS.forEach((t,i)=>{
    html += '<button class="topic-card" data-action="open-topic" data-topic="'+t.id+'">';
    html += '<div class="row1"><span class="topic-num">'+(i+1)+'</span><h3>'+t.name+'</h3></div>';
    html += '<div class="topic-meta"><span>'+t.notes.length+' key points</span><span>'+t.questions.length+' practice Qs</span></div>';
    html += '</button>';
  });
  html += '</div>';
  viewEl.innerHTML = html;
  wireActions();
}

function renderStudyDetail(topicId){
  const t = TOPICS.find(x=>x.id===topicId);
  let html = '<button class="back-link" data-action="goto" data-view="study"><svg class="back-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>All topics</button>';
  html += '<div class="panel">';
  html += '<div class="topic-detail-head"><h2 style="margin:0;">'+t.name+'</h2><button class="btn primary small" data-action="practice-topic" data-topic="'+t.id+'">Practice this topic</button></div>';
  html += '<ul class="notes-list">';
  t.notes.forEach(n=> html += '<li>'+n+'</li>');
  html += '</ul>';
  if(t.links && t.links.length){
    html += '<div class="links-head">Official sources to read in full</div>';
    html += '<ul class="links-list">';
    t.links.forEach(l=> html += '<li><a href="'+l.url+'" target="_blank" rel="noopener">'+l.label+'</a></li>');
    html += '</ul>';
  }
  html += '</div>';
  viewEl.innerHTML = html;
  wireActions();
}

function startPractice(topicId){
  const t = TOPICS.find(x=>x.id===topicId);
  practiceState = {
    topic: t,
    order: shuffle(t.questions.map((q,idx)=>idx)),
    pos: 0,
    answered: false,
    selected: null,
    sessionCorrect: 0,
    optOrder: null
  };
  practiceState.optOrder = shuffle([0,1,2,3]);
  render();
}

function renderPractice(){
  if(!practiceState){
    let html = '<div class="section-head"><h2>Practice by topic</h2><span class="sub">Instant feedback, no timer</span></div>';
    html += '<div class="topic-grid">';
    TOPICS.forEach((t,i)=>{
      const pct = masteryPct(t.id);
      html += '<button class="topic-card" data-action="practice-topic" data-topic="'+t.id+'">';
      html += '<div class="row1"><span class="topic-num">'+(i+1)+'</span><h3>'+t.name+'</h3></div>';
      html += '<div class="topic-meta">'+statusPill(pct)+'<span>'+t.questions.length+' questions</span></div>';
      html += '</button>';
    });
    html += '</div>';
    viewEl.innerHTML = html;
    wireActions();
    return;
  }
  const ps = practiceState;
  const qIdx = ps.order[ps.pos];
  const q = ps.topic.questions[qIdx];
  let html = '<button class="back-link" data-action="exit-practice"><svg class="back-ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Choose another topic</button>';
  html += '<div class="panel q-card">';
  html += '<div class="q-progress"><span>'+ps.topic.name+'</span><span>Question '+(ps.pos+1)+' of '+ps.order.length+' · '+ps.sessionCorrect+' correct so far</span></div>';
  html += '<div class="q-text">'+q.q+'</div>';
  html += '<div class="opt-list">';
  ps.optOrder.forEach(oi=>{
    let cls = "opt";
    let disabled = ps.answered ? "disabled" : "";
    if(ps.answered){
      if(oi===q.correct) cls += " correct";
      else if(oi===ps.selected) cls += " wrong";
    }
    html += '<button class="'+cls+'" '+disabled+' data-action="answer" data-oi="'+oi+'"><span class="k">'+String.fromCharCode(65+ps.optOrder.indexOf(oi))+'.</span><span>'+q.options[oi]+'</span></button>';
  });
  html += '</div>';
  if(ps.answered){
    const ok = ps.selected===q.correct;
    html += '<div class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correct. ":"Not quite. ")+q.explain+'</div>';
    html += '<div class="cta-row">';
    if(ps.pos < ps.order.length-1){
      html += '<button class="btn primary" data-action="next-q">Next question</button>';
    }else{
      html += '<button class="btn primary" data-action="exit-practice">Finish — back to topics</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  viewEl.innerHTML = html;
  wireActions();

  viewEl.querySelectorAll('[data-action="answer"]').forEach(el=> el.addEventListener("click", ()=>{
    if(ps.answered) return;
    const oi = parseInt(el.dataset.oi,10);
    ps.answered = true;
    ps.selected = oi;
    const s = state.topicStats[ps.topic.id];
    s.attempted += 1;
    if(oi===q.correct){ s.correct += 1; ps.sessionCorrect += 1; }
    saveState();
    renderPractice();
  }));
  const nextBtn = viewEl.querySelector('[data-action="next-q"]');
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    ps.pos += 1; ps.answered=false; ps.selected=null; ps.optOrder = shuffle([0,1,2,3]);
    renderPractice();
  });
  const exitBtn = viewEl.querySelector('[data-action="exit-practice"]');
  if(exitBtn) exitBtn.addEventListener("click", ()=>{ practiceState = null; renderPractice(); });
}

const EXAM_TOTAL = 50;
const EXAM_SECONDS = 57*60;
let examTimerHandle = null;

function buildExamQuestions(){
  let pool = [];
  TOPICS.forEach(t=>{
    t.questions.forEach((q,qi)=> pool.push({topicId:t.id, topicName:t.name, q, qi}));
  });
  pool = shuffle(pool).slice(0, EXAM_TOTAL);
  return pool.map(item=>{
    const optOrder = shuffle([0,1,2,3]);
    return {topicId:item.topicId, topicName:item.topicName, q:item.q, optOrder, selected:null, flagged:false};
  });
}

function startExam(){
  examState = {
    phase:"running",
    items: buildExamQuestions(),
    pos: 0,
    secondsLeft: EXAM_SECONDS
  };
  startExamTimer();
  render();
}

function startExamTimer(){
  clearInterval(examTimerHandle);
  examTimerHandle = setInterval(()=>{
    if(!examState || examState.phase!=="running"){ clearInterval(examTimerHandle); return; }
    examState.secondsLeft -= 1;
    if(examState.secondsLeft <= 0){
      examState.secondsLeft = 0;
      clearInterval(examTimerHandle);
      finishExam();
      return;
    }
    const timerEl = document.getElementById("exam-timer");
    if(timerEl){
      timerEl.textContent = formatTime(examState.secondsLeft);
      timerEl.classList.toggle("low", examState.secondsLeft < 300);
    }
  }, 1000);
}

function formatTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function finishExam(){
  clearInterval(examTimerHandle);
  const items = examState.items;
  let score = 0;
  const byTopic = {};
  items.forEach(it=>{
    if(!byTopic[it.topicId]) byTopic[it.topicId] = {correct:0,total:0,name:it.topicName};
    byTopic[it.topicId].total += 1;
    if(it.selected===it.q.correct){ score += 1; byTopic[it.topicId].correct += 1; }
  });
  examState.phase = "results";
  examState.score = score;
  examState.byTopic = byTopic;
  state.mockHistory.push({date: new Date().toISOString(), score, total: EXAM_TOTAL, byTopic});
  if(state.mockHistory.length>20) state.mockHistory = state.mockHistory.slice(-20);
  saveState();
  render();
}

function renderExam(){
  if(!examState){
    let html = '<div class="section-head"><h2>Mock exam</h2><span class="sub">Matches the real format</span></div>';
    html += '<div class="panel">';
    html += '<p>50 random questions drawn from all 14 topics, 57 minutes on the clock, pass mark 43/50 — the same structure as the real DVSA car theory test.</p>';
    html += '<p style="color:var(--ink-soft);font-size:.88rem;">This covers the multiple-choice half only. For hazard perception practice and another free mock exam, try the <a href="https://www.gov.uk/take-practice-theory-test" target="_blank" rel="noopener" style="color:var(--blue);font-weight:600;">official DVSA practice test</a>.</p>';
    html += '<div class="cta-row"><button class="btn primary" data-action="start-exam">Start mock exam</button></div>';
    html += '</div>';
    viewEl.innerHTML = html;
    viewEl.querySelector('[data-action="start-exam"]').addEventListener("click", startExam);
    return;
  }
  if(examState.phase==="running"){ renderExamRunning(); return; }
  if(examState.phase==="results"){ renderExamResults(); return; }
}

function renderExamRunning(){
  const items = examState.items;
  const it = items[examState.pos];
  const answeredCount = items.filter(i=>i.selected!==null).length;
  let html = '<div class="exam-head">';
  html += '<div><strong>Question '+(examState.pos+1)+' of '+items.length+'</strong><div class="sub" style="color:var(--ink-soft);font-size:.82rem;">'+answeredCount+' answered</div></div>';
  html += '<div class="timer" id="exam-timer">'+formatTime(examState.secondsLeft)+'</div>';
  html += '</div>';

  html += '<div class="panel q-card">';
  html += '<div class="q-progress"><span>'+it.topicName+'</span><button class="btn small" data-action="flag">'+(it.flagged?"Unflag":"Flag for review")+'</button></div>';
  html += '<div class="q-text">'+it.q.q+'</div>';
  html += '<div class="opt-list">';
  it.optOrder.forEach(oi=>{
    const sel = it.selected===oi;
    html += '<button class="opt'+(sel?" reveal":"")+'" data-action="select" data-oi="'+oi+'"><span class="k">'+String.fromCharCode(65+it.optOrder.indexOf(oi))+'.</span><span>'+it.q.options[oi]+'</span></button>';
  });
  html += '</div></div>';

  html += '<div class="nav-grid">';
  items.forEach((x,i)=>{
    let cls = "nav-cell";
    if(x.selected!==null) cls += " answered";
    if(x.flagged) cls += " flagged";
    if(i===examState.pos) cls += " current";
    html += '<button class="'+cls+'" data-action="jump" data-i="'+i+'">'+(i+1)+'</button>';
  });
  html += '</div>';

  html += '<div class="exam-footer">';
  html += '<button class="btn" data-action="prev" '+(examState.pos===0?"disabled":"")+'><svg class="back-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Previous</button>';
  if(examState.pos < items.length-1){
    html += '<button class="btn primary" data-action="next">Next</button>';
  }else{
    html += '<button class="btn primary" data-action="submit">Submit exam</button>';
  }
  html += '</div>';

  viewEl.innerHTML = html;

  viewEl.querySelectorAll('[data-action="select"]').forEach(el=> el.addEventListener("click", ()=>{
    it.selected = parseInt(el.dataset.oi,10);
    renderExamRunning();
  }));
  viewEl.querySelector('[data-action="flag"]').addEventListener("click", ()=>{ it.flagged = !it.flagged; renderExamRunning(); });
  viewEl.querySelector('[data-action="prev"]').addEventListener("click", ()=>{ if(examState.pos>0){ examState.pos--; renderExamRunning(); } });
  const nextBtn = viewEl.querySelector('[data-action="next"]');
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ examState.pos++; renderExamRunning(); });
  const submitBtn = viewEl.querySelector('[data-action="submit"]');
  if(submitBtn) submitBtn.addEventListener("click", ()=>{
    const unanswered = items.filter(i=>i.selected===null).length;
    if(unanswered>0 && !confirm(unanswered+" question(s) still unanswered. Submit anyway?")) return;
    finishExam();
  });
  viewEl.querySelectorAll('[data-action="jump"]').forEach(el=> el.addEventListener("click", ()=>{ examState.pos = parseInt(el.dataset.i,10); renderExamRunning(); }));
}

function renderExamResults(){
  const pass = examState.score >= 43;
  let html = '<div class="result-banner '+(pass?"pass":"fail")+'">';
  html += '<div class="big">'+examState.score+' / '+EXAM_TOTAL+'</div>';
  html += '<div style="font-weight:700;margin-top:6px;">'+(pass?"Pass — well done!":"Not a pass yet")+'</div>';
  html += '<div style="color:var(--ink-soft);font-size:.86rem;margin-top:4px;">Pass mark is 43 out of 50</div>';
  html += '</div>';

  html += '<div class="section-head"><h2>Breakdown by topic</h2></div>';
  html += '<div class="panel topic-break">';
  Object.keys(examState.byTopic).sort((a,b)=> examState.byTopic[a].name.localeCompare(examState.byTopic[b].name)).forEach(tid=>{
    const b = examState.byTopic[tid];
    const pct = Math.round((b.correct/b.total)*100);
    html += '<div class="tb-row"><span>'+b.name+'</span><span style="text-align:right;font-weight:700;color:'+masteryColor(pct)+'">'+b.correct+'/'+b.total+'</span></div>';
    html += '<div class="bar"><span style="width:'+pct+'%;background:'+masteryColor(pct)+'"></span></div>';
  });
  html += '</div>';

  html += '<div class="cta-row">';
  html += '<button class="btn primary" data-action="retake">Take another mock exam</button>';
  html += '<button class="btn" data-action="dash">Back to dashboard</button>';
  html += '</div>';

  viewEl.innerHTML = html;
  viewEl.querySelector('[data-action="retake"]').addEventListener("click", ()=>{ examState=null; startExam(); });
  viewEl.querySelector('[data-action="dash"]').addEventListener("click", ()=>{ examState=null; goTo("dashboard"); });
}

render();
</script>
