<title>Road to Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1F23; --ink-soft:#54605A; --paper:#F2F4EF; --surface:#FFFFFF; --surface-2:#E9ECE4;
  --border:#D5D9CD; --green:#00703C; --green-soft:#E1EFE6; --red:#B10E2B; --red-soft:#FAE6E8;
  --blue:#0056A3; --blue-soft:#E2ECF7; --amber:#A8720A; --amber-soft:#F9EFD9;
  --shadow:0 1px 2px rgba(27,31,35,.07),0 6px 16px rgba(27,31,35,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECEEE9; --ink-soft:#A8B2A9; --paper:#15181A; --surface:#1D2124; --surface-2:#242A2C;
    --border:#343B3C; --green:#3CB97E; --green-soft:#17301F; --red:#FF7A86; --red-soft:#3A1419;
    --blue:#6CAEEE; --blue-soft:#10243A; --amber:#E7AC47; --amber-soft:#3A2B0C;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ink:#ECEEE9; --ink-soft:#A8B2A9; --paper:#15181A; --surface:#1D2124; --surface-2:#242A2C;
  --border:#343B3C; --green:#3CB97E; --green-soft:#17301F; --red:#FF7A86; --red-soft:#3A1419;
  --blue:#6CAEEE; --blue-soft:#10243A; --amber:#E7AC47; --amber-soft:#3A2B0C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;}
.app{max-width:960px;margin:0 auto;padding:0 20px 64px;}
h1,h2,h3,.disp{font-family:"Barlow Semi Condensed",system-ui,sans-serif;text-wrap:balance;}
p{line-height:1.55;}
button{font-family:inherit;}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);box-shadow:var(--shadow);}
.topbar-inner{max-width:960px;margin:0 auto;padding:14px 20px 0;}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;}
.brand .mark{width:30px;height:30px;flex:none;}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:.3px;margin:0;color:var(--paper);}
.brand .tag{font-size:.74rem;color:#B9C2BA;letter-spacing:.04em;text-transform:uppercase;}
.tabs{display:flex;gap:2px;overflow-x:auto;}
.tab{appearance:none;border:none;background:transparent;color:#C7CEC8;padding:10px 16px;font-size:.92rem;font-weight:600;font-family:"Barlow Semi Condensed",system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--paper);}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--green);}
.tab:focus-visible{outline:2px solid var(--green);outline-offset:-2px;}
main{padding-top:24px;}
.disclaimer{font-size:.78rem;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:22px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:1.5rem;margin:0;font-weight:700;}
.section-head .sub{color:var(--ink-soft);font-size:.9rem;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.stat-tile .num{font-family:"Barlow Semi Condensed";font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1;}
.stat-tile .lbl{font-size:.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.stat-tile.accent-green .num{color:var(--green);}
.stat-tile.accent-blue .num{color:var(--blue);}
.stat-tile.accent-amber .num{color:var(--amber);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:9px;font-weight:600;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{border-color:var(--ink-soft);}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;}
.btn.primary:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent;}
.btn.small{padding:7px 12px;font-size:.82rem;}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;}
.topic-card:hover{border-color:var(--green);}
.topic-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.topic-card .row1{display:flex;align-items:center;gap:10px;}
.topic-num{font-family:"Barlow Semi Condensed";font-weight:800;font-size:.78rem;color:var(--paper);background:var(--ink-soft);border-radius:6px;padding:3px 7px;min-width:20px;text-align:center;}
.topic-card h3{margin:0;font-size:1.02rem;font-weight:700;}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.bar > span{display:block;height:100%;border-radius:4px;}
.topic-meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-soft);}
.status-pill{font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
.pill-new{background:var(--surface-2);color:var(--ink-soft);}
.pill-low{background:var(--red-soft);color:var(--red);}
.pill-mid{background:var(--amber-soft);color:var(--amber);}
.pill-high{background:var(--green-soft);color:var(--green);}
.notes-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.notes-list li{padding-left:18px;position:relative;line-height:1.55;}
.notes-list li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--green);}
.links-head{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.links-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.links-list a{color:var(--blue);font-size:.92rem;font-weight:600;text-decoration:none;}
.links-list a:hover{text-decoration:underline;}
.topic-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;}
.back-link{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);color:var(--ink);font-weight:700;font-size:.9rem;cursor:pointer;padding:8px 16px 8px 10px;border-radius:9px;margin-bottom:16px;box-shadow:var(--shadow);}
.back-link:hover{border-color:var(--blue);color:var(--blue);}
.back-link:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.back-link .back-ic{flex:none;}
.q-card{display:flex;flex-direction:column;gap:14px;}
.q-progress{font-size:.8rem;color:var(--ink-soft);display:flex;justify-content:space-between;}
.q-text{font-size:1.08rem;font-weight:600;line-height:1.5;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:.95rem;cursor:pointer;display:flex;gap:10px;}
.opt .k{font-weight:700;color:var(--ink-soft);}
.opt:hover:not([disabled]){border-color:var(--blue);}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.opt[disabled]{cursor:default;}
.opt.correct{background:var(--green-soft);border-color:var(--green);}
.opt.wrong{background:var(--red-soft);border-color:var(--red);}
.opt.reveal{border-color:var(--green);}
.feedback{border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.5;}
.feedback.ok{background:var(--green-soft);color:var(--ink);}
.feedback.bad{background:var(--red-soft);color:var(--ink);}
.exam-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);flex-wrap:wrap;}
.timer{font-family:"Barlow Semi Condensed";font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;}
.timer.low{color:var(--red);}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin:16px 0;}
.nav-cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:.74rem;font-weight:700;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
.nav-cell.answered{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);}
.nav-cell.flagged{box-shadow:inset 0 0 0 2px var(--amber);}
.nav-cell.current{outline:2px solid var(--ink);outline-offset:1px;}
.exam-footer{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;}
.result-banner{border-radius:14px;padding:22px;text-align:center;margin-bottom:20px;}
.result-banner.pass{background:var(--green-soft);}
.result-banner.fail{background:var(--red-soft);}
.result-banner .big{font-family:"Barlow Semi Condensed";font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums;}
.result-banner.pass .big{color:var(--green);}
.result-banner.fail .big{color:var(--red);}
.topic-break{display:flex;flex-direction:column;gap:8px;}
.tb-row{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center;font-size:.86rem;}
.history-row{display:flex;justify-content:space-between;font-size:.86rem;padding:8px 0;border-bottom:1px solid var(--border);}
.history-row:last-child{border-bottom:none;}
.empty{color:var(--ink-soft);font-size:.9rem;padding:20px 0;text-align:center;}
@media (max-width:480px){
  .brand h1{font-size:1.25rem;}
  .result-banner .big{font-size:2.1rem;}
}
</style>

<script>
const TOPICS = [
{id:"alertness",name:"Alertness",
notes:[
"Before you move off, use the Mirror – Signal – Manoeuvre routine every time: check your mirrors, signal your intention, then check your blind spots over your shoulder before you actually move.",
"Mirrors don't show everything — a motorcyclist or cyclist can sit in a blind spot for several seconds, so a head check matters as much as the mirror check.",
"Fatigue slows your reactions as much as a couple of alcoholic drinks. On a long journey, plan a break of at least 15 minutes every two hours.",
"Anything that takes your eyes, hands or mind off the road — a phone, food, a satnav you're programming on the move — is a distraction. Set the satnav before you set off.",
"Eyesight standard: you must be able to read a number plate from 20 metres away, and wear glasses or contact lenses every time you drive if you need them to meet this standard.",
"Dazzle: in low winter sun or facing oncoming full beam at night, slow down, increase your distance, and avoid staring directly at the glare — use a visor or sunglasses in daylight.",
"Scan near, middle-distance and far ahead, and check to the sides — fixing your eyes on one point (tunnel vision) makes it easy to miss a hazard developing elsewhere.",
"It's illegal to use a handheld phone while driving, even stationary in traffic with the engine running. It's only lawful when safely parked with the engine off, or in a genuine emergency when it's unsafe to stop.",
"Some prescription and over-the-counter medicines cause drowsiness and can impair your driving as much as alcohol — check the label or ask a pharmacist before you drive.",
"Loud music can mask sirens, horns and level crossing warnings; strong emotions such as anger or stress can narrow your concentration just like fatigue.",
"Wide-angle (convex) mirrors widen your view but make following vehicles look smaller and further away than they really are — don't rely on them alone for a lane change."
],
links:[
{label:"Highway Code: General rules for all drivers and riders (103–158)",url:"https://www.gov.uk/guidance/the-highway-code/general-rules-techniques-and-advice-for-all-drivers-and-riders-103-to-158"},
{label:"Highway Code: Rules for drivers and motorcyclists (89–102)",url:"https://www.gov.uk/guidance/the-highway-code/rules-for-drivers-and-motorcyclists-89-to-102"},
{label:"GOV.UK: Driving eyesight rules",url:"https://www.gov.uk/driving-eyesight-rules"}
],
questions:[
{q:"Just before you move off from the side of the road, what should you do?",options:["Only check the exterior mirrors","Signal first, then check your mirrors","Use mirrors, signal, then check your blind spots over your shoulder","Rely on other drivers to give way"],correct:2,explain:"Mirror – Signal – Manoeuvre, finished with a shoulder check, is the safe routine every time you move off."},
{q:"Why is a shoulder check needed as well as using your mirrors?",options:["It isn't needed if you have door mirrors","Mirrors have blind spots that can hide a cyclist or motorcyclist","It's only required on motorways","It's only needed when reversing"],correct:1,explain:"A motorcycle or cyclist can sit unseen in a mirror's blind spot, so a direct glance is essential."},
{q:"You feel your eyelids getting heavy on a motorway. What's the safest action?",options:["Open a window and turn up the radio","Speed up to reach your exit sooner","Leave at the next services or a safe stopping point and rest","Keep going — it will pass"],correct:2,explain:"Tiredness kills. Stop and rest properly rather than trying to fight it with noise or fresh air."},
{q:"How does using a hands-free phone while driving affect you?",options:["It has no effect since your hands stay on the wheel","It only affects your hearing","It still distracts your attention from the road","It's only a problem on motorways"],correct:2,explain:"The mental distraction of holding a conversation is the main risk, not just where your hands are."},
{q:"What is a sensible rule of thumb for rest breaks on a long motorway journey?",options:["Stop only when you run out of fuel","At least 15 minutes every 2 hours","Never stop, it wastes time","Only stop after 6 hours"],correct:1,explain:"Regular short breaks keep concentration up far better than one long drive."},
{q:"You're waiting to turn right at a junction and the road was clear a moment ago. Just before you turn, you should:",options:["Check mirrors and blind spot again in case something has changed","Assume nothing has changed since you last looked","Sound your horn","Flash your headlights"],correct:0,explain:"Situations change in seconds — always re-check immediately before committing to the manoeuvre."},
{q:"Which of these is most likely to reduce your alertness while driving?",options:["A fully charged phone sitting unused in a cradle","Drowsiness in a stuffy, overheated cabin","A clean windscreen","A recently serviced car"],correct:1,explain:"A warm, stuffy car makes drowsiness worse — keep it cool and well ventilated on long drives."},
{q:"What effect can just one alcoholic drink have on your driving?",options:["None at all if you feel fine","It can still slow your reactions and affect your judgement","It only matters above the legal limit","It only affects night driving"],correct:1,explain:"Even small amounts of alcohol impair judgement and reaction time, regardless of the legal limit."},
{q:"To meet the legal eyesight standard for driving, you must be able to read a vehicle registration plate from a distance of:",options:["12 metres","20 metres","25 metres","30 metres"],correct:1,explain:"This is the minimum eyesight standard required by law before you may drive, wearing glasses or contact lenses if needed."},
{q:"If you need glasses or contact lenses to meet the driving eyesight standard, when must you wear them?",options:["Only on motorways","Only at night","Every time you drive","Only for long journeys"],correct:2,explain:"The eyesight requirement applies whenever you drive, not just in certain conditions."},
{q:"Low winter sun is dazzling you through the windscreen. What should you do?",options:["Follow the vehicle ahead more closely so you can see its brake lights","Slow down, keep more distance and use your sun visor or sunglasses","Switch on your hazard warning lights until the glare passes","Look directly at the sun to let your eyes adjust"],correct:1,explain:"Reducing speed and increasing your safety margin compensates for the reduced visibility caused by glare."},
{q:"You are dazzled by the headlights of an oncoming vehicle at night. You should:",options:["Flash your own headlights back at the driver","Close your eyes briefly until the glare passes","Slow down and avoid looking directly at the lights","Switch to full beam to see the road better"],correct:2,explain:"Looking slightly away from the glare and slowing down helps you keep control until your vision recovers."},
{q:"Why might a brightly lit satnav or phone screen on your dashboard at night reduce your alertness to hazards?",options:["It uses too much battery power","It can temporarily affect your night vision when you look back at the dark road","It makes the engine run less efficiently","It interferes with the car's indicators"],correct:1,explain:"A bright screen makes your eyes adjust to the light, briefly making it harder to see clearly in the darker surroundings outside."},
{q:"You are reversing into a parking space and are not sure what is behind you. What is the safest thing to do?",options:["Reverse slowly and sound your horn continuously","Get out and check around the vehicle before reversing","Rely on the parking sensors alone","Ask a passenger to shout if there's a problem while you reverse quickly"],correct:1,explain:"Getting out to check removes any doubt about hidden hazards such as children, trolleys or bollards in your blind spot."},
{q:"Why should you take extra care when driving alongside a large lorry?",options:["Lorries always travel faster than cars","Lorries have much larger blind spots than a car","Lorries are not required to indicate","Lorries cannot see traffic in front of them"],correct:1,explain:"The driver's high seating position and vehicle size create large blind spots where a car can be completely hidden from view."},
{q:"What is a risk of playing music at a very high volume while driving?",options:["It can stop you hearing sirens, horns or level crossing warnings","It will drain the car battery too quickly","It is only a problem on motorways","It automatically reduces your field of vision"],correct:0,explain:"Loud music can mask important warning sounds from emergency vehicles or other hazards, delaying your reaction."},
{q:"You are stopped in a queue of traffic with the engine running. Is it legal to check a text message on a handheld phone?",options:["Yes, as long as the vehicle isn't moving","Yes, if it takes less than a few seconds","No, it's still an offence unless the engine is off and it's safe and legal to be parked","No, but only if you're on a motorway"],correct:2,explain:"The law treats being stationary in traffic with the engine on as still 'driving', so using a handheld phone remains an offence."},
{q:"When is it legal to use a handheld mobile phone while in the driver's seat?",options:["Whenever stopped at red traffic lights","When the vehicle is safely parked with the engine off, or in a genuine emergency when unsafe to stop","Only when using the speaker function","Any time you are travelling under 10 mph"],correct:1,explain:"The vehicle must be safely parked with the engine off for handheld phone use to be lawful, other than a genuine emergency when stopping isn't safe."},
{q:"Which habit best describes good scanning while driving?",options:["Focusing mainly on the vehicle directly in front","Looking near, middle-distance and far ahead, and checking to the sides","Looking only at the speedometer and mirrors","Fixing your eyes on the centre line of the road"],correct:1,explain:"Scanning across different distances and directions helps you spot developing hazards earlier than fixing your gaze on one point."},
{q:"You are driving past a school just as children are arriving. What should you do?",options:["Maintain your normal speed since it's a public road","Sound your horn to warn children you are approaching","Slow down and watch carefully for children who may step into the road","Follow closely behind any vehicle in front for guidance"],correct:2,explain:"Children can be unpredictable and may not judge your speed well, so reduced speed and extra observation lower the risk."},
{q:"You've just parked on a road used by cyclists. Before opening your door, you should:",options:["Open it quickly so you don't block traffic for long","Check your mirror and look back for passing cyclists or traffic","Only check the opposite door","Assume cyclists will see your car and move around it"],correct:1,explain:"A cyclist can be hidden from view until the last moment, so checking before opening the door avoids a collision."},
{q:"As you approach a zebra crossing, you should:",options:["Speed up slightly to clear it before pedestrians step out","Look for pedestrians waiting to cross and be ready to stop","Only slow down if someone is already on the crossing","Sound your horn to warn pedestrians you're coming"],correct:1,explain:"Anticipating pedestrians at the kerb gives you time to stop smoothly rather than braking suddenly."},
{q:"At a junction, a motorcyclist can be harder to see than a car because:",options:["Motorcycles are not allowed to use main roads","Its narrow shape and smaller size make it easier to miss or misjudge its speed","Motorcyclists always travel on the pavement","Motorcycles do not have to use lights in daylight"],correct:1,explain:"A motorcycle's narrower profile can be hidden by other objects or misjudged in speed, so extra care is needed when emerging."},
{q:"You are leaving a driveway that crosses a pavement. Before moving onto the road, you should:",options:["Edge out quickly before pedestrians notice","Stop, look both ways along the pavement and check for pedestrians or cyclists before crossing it","Sound your horn and proceed immediately","Only check for other vehicles on the road, not the pavement"],correct:1,explain:"Pedestrians and cyclists using the pavement have priority and may not expect a vehicle crossing their path."},
{q:"You notice you have started yawning repeatedly while driving. This is a sign that you should:",options:["Open a window slightly and carry on as normal","Turn up the radio volume to stay awake","Plan to stop at a safe place and rest as soon as possible","Increase your speed to finish the journey sooner"],correct:2,explain:"Yawning is an early warning sign of fatigue, and the only reliable remedy is to stop and rest."},
{q:"According to the Highway Code, eating a meal while driving is best avoided because:",options:["It is illegal in all circumstances","It can distract you and reduce your control of the vehicle","It increases fuel consumption","It is only a problem for learner drivers"],correct:1,explain:"Taking a hand off the wheel and your attention off the road to eat reduces your ability to react to hazards."},
{q:"A passenger's behaviour is seriously distracting you while driving. What is the best course of action?",options:["Turn around to speak to them while continuing to drive","Ignore it and keep your eyes fixed on the road","Find a safe place to stop before dealing with the situation","Speed up so you reach your destination sooner"],correct:2,explain:"Stopping somewhere safe lets you resolve the distraction fully rather than trying to drive and manage it at the same time."},
{q:"How can strong feelings of anger or 'road rage' affect your driving?",options:["They have no real effect if you feel confident","They can improve your reaction times","They can impair your concentration and judgement, increasing risk","They only affect passengers, not the driver"],correct:2,explain:"Strong emotions can narrow your focus and lead to poor decisions, much like other impairments to alertness."},
{q:"A medicine you are taking is labelled as likely to cause drowsiness. What should you do?",options:["Drive as normal since it's a legal medicine","Only drive short distances","Avoid driving until you know it does not affect you, and seek advice if unsure","Drive only during the day"],correct:2,explain:"Drowsiness from medication can impair driving as much as alcohol or tiredness, so you should check its effects before driving."},
{q:"You have a heavy cold and have taken medication for it. How might this affect your driving?",options:["It cannot affect your driving if the medicine is 'non-drowsy'","It may slow your reactions and reduce concentration, similar to alcohol","It only affects your sense of smell","It has no effect unless you are also tired"],correct:1,explain:"Illness and the medicines used to treat it can both impair alertness and reaction times."},
{q:"Your rear window is partly blocked by luggage or heavy tinting. What should you do?",options:["Ignore it, since mirrors show everything behind you","Be aware this creates an additional blind spot and check extra carefully before moving off","Drive only in daylight to compensate","Rely on other drivers to give way to you"],correct:1,explain:"A restricted rear view adds to your existing blind spots, so extra care is needed when manoeuvring."},
{q:"What is the purpose of rumble strips sometimes found on the hard shoulder or lane markings of a motorway?",options:["To reduce road noise for nearby residents","To alert a drifting or inattentive driver with noise and vibration","To mark out bus lanes","To help cyclists find a smoother surface"],correct:1,explain:"The noise and vibration are designed to startle a drowsy or distracted driver back to full attention."},
{q:"Some modern cars have a driver-fatigue warning system. What should you remember about it?",options:["It removes the need to ever take a break","It is a useful aid but does not replace planning regular rest breaks","It only works above 70 mph","It automatically stops the car when triggered"],correct:1,explain:"These systems can help detect warning signs, but responsible journey planning with regular breaks remains essential."},
{q:"Approaching a level crossing with no barrier and no train currently visible, you should:",options:["Cross quickly before checking, since the lights would warn you","Still look both ways and listen for an approaching train before crossing","Only check if it's dark outside","Sound your horn and cross without stopping"],correct:1,explain:"Even without a barrier, you must remain alert for trains, as warning lights alone may not give enough notice."},
{q:"How often should you check your mirrors while driving in normal conditions?",options:["Only when you intend to turn or change lanes","Regularly, as part of your ongoing observation, not just before a manoeuvre","Once every few minutes at a fixed interval","Only when another vehicle sounds its horn"],correct:1,explain:"Building regular mirror checks into your overall scanning keeps you aware of what is happening around you at all times."},
{q:"When overtaking a cyclist, you should:",options:["Pass as closely as possible to save road space","Allow at least as much room as you would when overtaking a car","Sound your horn just before passing","Overtake only if the cyclist signals you to do so"],correct:1,explain:"Giving plenty of space accounts for the cyclist possibly swerving to avoid a pothole or drain cover."},
{q:"Wide-angle (convex) door mirrors are useful, but you should remember that they:",options:["Show an identical image to a flat mirror","Make following vehicles look smaller and further away than they really are","Cannot be used at night","Remove the need for a shoulder check"],correct:1,explain:"The curved surface widens the view but distorts distance, so relying on it alone can lead to misjudging a gap."},
{q:"As you approach a roundabout, you should look:",options:["Only to the left for pedestrians","To the right, for traffic already on the roundabout, before joining","Straight ahead only","Only in your interior mirror"],correct:1,explain:"Traffic already on the roundabout approaches from the right in the UK and has priority, so checking that side is essential before joining."},
{q:"You realise you cannot clearly remember the last few miles of motorway you have just driven. This is a sign that you should:",options:["Continue, since you clearly reached this point safely","Treat it as a warning sign of reduced alertness and plan to stop and rest","Turn on the radio louder to refocus","Increase your speed slightly to feel more engaged"],correct:1,explain:"A loss of awareness like this can indicate fatigue or reduced concentration, meaning a break is needed before continuing."},
{q:"On a warm day, keeping some fresh air circulating in the car can help because:",options:["It reduces fuel consumption","It can help prevent the drowsiness caused by a hot, stuffy cabin","It is a legal requirement in warm weather","It replaces the need for mirror checks"],correct:1,explain:"A build-up of warm, stale air can make you feel sleepy, so fresh air helps you stay more alert."},
]},
{id:"attitude",name:"Attitude",
notes:[
"Keep a safe following distance and don't react to tailgaters by braking sharply or speeding up — ease back and let them go around when it's safe.",
"Flashing your headlights means \"I am here\", nothing more. Never flash to wave someone out or claim priority.",
"The horn warns others of your presence; it isn't a way to hurry someone along. Don't sound it at a stationary vehicle except to warn of danger.",
"Patience with learners, cyclists and slower vehicles is part of safe driving — undertaking or tailgating out of frustration raises the risk for everyone.",
"The horn must not be used in a built-up area between 11.30pm and 7am, except to warn another road user of danger.",
"Dip your headlights for oncoming traffic at night in good time — never retaliate against a dazzling driver by switching to full beam yourself.",
"Merge in turn when lanes narrow at roadworks, give way to a bus signalling to pull away from a stop where it's safe, and be ready to give way at passing places on narrow roads.",
"If another driver's dangerous driving frightens you, stay calm, don't retaliate, and don't chase or confront them. If they stop and you feel threatened, stay in your locked car and call the police.",
"Never let impatience push you into overtaking where you can't see clearly ahead, such as approaching a bend or the brow of a hill.",
"Driving in convoy with friends: always drive at your own safe speed, even if it means falling behind — never match an unsafe pace just to keep up.",
"If you witness dangerous driving, note the vehicle's registration and the circumstances and report it to the police rather than taking matters into your own hands."
],
links:[
{label:"Highway Code: Using the road (159–203)",url:"https://www.gov.uk/guidance/the-highway-code/using-the-road-159-to-203"}
],
questions:[
{q:"A driver behind you is following too closely. What should you do?",options:["Brake sharply to warn them","Speed up to get away","Increase your following distance from the vehicle ahead to give yourself more room","Flash your brake lights repeatedly"],correct:2,explain:"Opening up extra room ahead gives you more time to react if the tailgater causes a problem."},
{q:"What does flashing your headlights at another driver mean?",options:["\"Go ahead, it's safe\"","\"I am giving way\"","\"I am here\" — nothing more","\"Hurry up\""],correct:2,explain:"It must never be used to invite someone into a manoeuvre — its only agreed meaning is to signal your presence."},
{q:"When is it acceptable to sound your horn?",options:["To tell a pedestrian to hurry across","To greet a friend you've spotted","To warn another road user of your presence when necessary","When stuck in a queue"],correct:2,explain:"The horn exists purely as a safety warning, not as a way to express frustration."},
{q:"A learner driver stalls at a junction ahead of you. What's the best response?",options:["Sound your horn immediately","Overtake on the inside","Be patient and give them time and room to recover","Flash your lights"],correct:2,explain:"Everyone was a learner once — patience reduces stress on the driver ahead and keeps things safer."},
{q:"Why is undertaking (overtaking on the inside) generally discouraged?",options:["It's always illegal","Other drivers don't expect it, increasing collision risk","It uses more fuel","It's only a problem on motorways"],correct:1,explain:"Drivers checking mirrors expect overtaking from the outside, so undertaking is a common source of surprise collisions."},
{q:"What's the safest attitude toward cyclists at junctions?",options:["Assume they'll always wait for you","Give them space and check carefully before turning across their path","Sound your horn to move them along","Overtake them right before the junction"],correct:1,explain:"Cyclists are far more vulnerable than you — extra care at junctions protects them."},
{q:"Your mood is low after a difficult day. What effect can this have on your driving?",options:["None — driving is unaffected by mood","It can make you more impatient or less observant — recognise it and drive more cautiously","It only matters on long journeys","Only tiredness matters, not mood"],correct:1,explain:"Emotional state affects concentration and patience just as much as physical tiredness."},
{q:"You're overtaking a horse and rider. What's the biggest risk of an impatient approach?",options:["None — horses are unaffected by traffic","Startling the horse, which can be dangerous for rider and other traffic","It saves time","It's illegal to overtake a horse"],correct:1,explain:"Horses can react unpredictably if startled — pass slowly and with plenty of room."},
{q:"You are being followed by a vehicle flashing its headlights impatiently. What should you do?",options:["Speed up to get away","Ignore it and drive at a speed that's safe for you","Pull over immediately wherever you are","Brake sharply to slow them down"],correct:1,explain:"You should never let another driver's impatience push you into driving faster than is safe."},
{q:"What is the main rule about using your horn in a built-up area between 11.30pm and 7am?",options:["It wastes fuel so should be avoided","It is prohibited except to warn of danger","It damages the horn mechanism","It is only allowed on motorways"],correct:1,explain:"The Highway Code bans horn use in built-up areas at night except to alert another road user to danger."},
{q:"You are driving behind a cyclist who is riding slowly. You should:",options:["Overtake only when you can give them plenty of room","Sound your horn to get them to move over","Overtake as closely as possible to save time","Flash your lights until they pull over"],correct:0,explain:"Giving a cyclist plenty of room when overtaking reduces the risk of a collision."},
{q:"Another driver cuts in front of you without warning. What is the best response?",options:["Flash your lights angrily","Sound your horn repeatedly","Stay calm and ease back to a safe distance","Overtake them immediately to get back in front"],correct:2,explain:"Staying calm and restoring your safety margin is safer than reacting with aggression."},
{q:"You are approaching roadworks where traffic must merge into one lane. What should you do?",options:["Push in as far forward as possible","Merge in turn with other traffic","Speed up to get ahead of the merge","Stay in your lane and block others"],correct:1,explain:"Merging in turn keeps traffic moving fairly and safely for everyone."},
{q:"What does it mean if a driver flashes their headlights at you?",options:["It is a signal that it's safe for you to proceed","It is only ever meant to let you know they are there","It means they are giving way to you","It means you should stop immediately"],correct:1,explain:"A flash of headlights only confirms another driver's presence and should never be taken as an instruction."},
{q:"You are driving in queuing traffic and a motorcyclist is filtering past between the lanes. What should you do?",options:["Try to block them","Open your door to warn them off","Let them pass safely","Speed up to stop them overtaking"],correct:2,explain:"Motorcyclists are allowed to filter through slow traffic, so you should let them pass safely."},
{q:"You are overtaking a horse and rider. What should you do?",options:["Sound your horn as you pass","Pass slowly, leaving plenty of room","Rev your engine to warn them","Pass as quickly as possible"],correct:1,explain:"A slow, wide pass reduces the risk of startling the horse."},
{q:"Why should you give way to a bus signalling to pull out from a bus stop?",options:["Buses always have automatic legal priority","It is safer and considerate to let it rejoin the traffic flow","You are required by law to stop for 10 seconds","It is illegal to pass a stationary bus"],correct:1,explain:"Letting a bus pull away safely, where you can, is good practice and keeps traffic flowing smoothly."},
{q:"A learner driver ahead of you stalls at a junction. What should you do?",options:["Sound your horn","Overtake immediately","Be patient and give them time","Flash your lights"],correct:2,explain:"Everyone was a learner once, so patience reduces stress on the driver ahead and keeps things safer."},
{q:"You are driving and become frustrated by slow-moving traffic. What should you do?",options:["Overtake as soon as any gap appears","Stay calm and accept you may be delayed","Follow very closely to pressure the driver ahead","Sound your horn repeatedly"],correct:1,explain:"Accepting a delay and staying calm is far safer than letting frustration cause risky driving."},
{q:"What should you do if you make a driving mistake that inconveniences another road user?",options:["Ignore it and carry on","Acknowledge it with a brief apologetic gesture if it's safe to do so","Stop in the road to apologise in person","Speed away quickly"],correct:1,explain:"A brief, safe gesture of apology is courteous without creating a further hazard."},
{q:"An ambulance approaches from behind with blue lights flashing on a narrow road. What should you do?",options:["Stop immediately wherever you are","Speed up to clear the road ahead of it","Pull over safely when you can to let it pass","Ignore it, as it is the ambulance driver's job to get past"],correct:2,explain:"Pulling over safely when you can helps the emergency vehicle through without creating a hazard."},
{q:"You are at the back of a long queue of traffic at roadworks. What should you do?",options:["Use the hard shoulder to bypass the queue","Join the back of the queue and wait your turn","Turn into a side road to rejoin further ahead","Flash your lights so someone lets you in"],correct:1,explain:"Queuing fairly avoids unsafe manoeuvres and unnecessary conflict with other drivers."},
{q:"A pedestrian is waiting to cross at a zebra crossing. What should you do?",options:["Speed up to pass before they step out","Slow down and be prepared to stop","Sound your horn to warn them","Flash your headlights to wave them across"],correct:1,explain:"You should always be ready to stop for a pedestrian waiting at a zebra crossing."},
{q:"What is the safest attitude when driving in convoy with friends?",options:["Keep up with the others at all costs","Drive at your own safe speed, even if it means falling behind","Take turns leading at high speed","Follow closely to stay together"],correct:1,explain:"Your own safe speed should never be sacrificed to keep pace with other drivers."},
{q:"You are dazzled by the headlights of an oncoming vehicle at night. What should you do?",options:["Flash your own full beam back","Close your eyes briefly","Slow down and avoid looking directly at the lights","Speed up to get past quickly"],correct:2,explain:"Slowing down and looking away from the glare keeps you in control until your vision recovers."},
{q:"Why is tailgating (driving too close to the vehicle in front) dangerous?",options:["It saves fuel","It leaves no time to react if the vehicle ahead brakes suddenly","It improves your view of the road","It has no real effect at low speed"],correct:1,explain:"Following too closely removes the margin needed to react safely to sudden braking."},
{q:"You are waiting at a junction and another driver flashes their headlights at you. What should you do?",options:["Pull out immediately, as they are giving way","Still check it's safe yourself before moving","Flash back and pull out together","Ignore them and wait regardless"],correct:1,explain:"A flash of headlights is not a guarantee of safety, so you must still make your own check."},
{q:"What should you do if a driver behind you sounds their horn impatiently while you wait for a pedestrian to cross?",options:["Rev your engine in response","Continue to wait until the pedestrian has crossed safely","Edge forward to hurry the pedestrian","Reverse away from the crossing"],correct:1,explain:"A pedestrian's safety always comes before another driver's impatience."},
{q:"You are turning right at a junction and traffic is approaching from the opposite direction. What should you do?",options:["Turn as soon as you arrive at the junction","Wait for a safe gap before turning","Sound your horn to clear a path","Flash your lights to stop oncoming traffic"],correct:1,explain:"You must wait until there is a safe gap in oncoming traffic before completing the turn."},
{q:"Why should you avoid becoming impatient with learner drivers?",options:["They are not legally allowed to be overtaken","Everyone was a learner once, and patience reduces risk for everyone","It is illegal to overtake a learner","Learners always have right of way"],correct:1,explain:"Patience with less experienced drivers helps keep the roads safer for everyone."},
{q:"A cyclist moves away from the kerb before a junction. Why might they do this?",options:["To block following traffic","To be more visible and avoid being cut up","They are not allowed to ride near the kerb","To let cars overtake more easily"],correct:1,explain:"Riding further from the kerb helps a cyclist be seen and avoids being squeezed at the junction."},
{q:"You are driving and another road user makes an error that affects you, but no harm is done. What is the best reaction?",options:["Flash your lights and sound your horn","Stay calm and continue driving safely","Follow them to make a point","Report them regardless of how minor it was"],correct:1,explain:"Staying calm after a minor error keeps your own concentration on the road."},
{q:"What should you do when meeting an oncoming vehicle on a narrow road with passing places?",options:["Always force the other driver to reverse","Be prepared to give way if you reach a passing place first","Drive through the gap regardless of width","Flash your lights to claim priority"],correct:1,explain:"Courtesy and safety mean being ready to give way rather than assuming priority."},
{q:"Why should you dip your headlights for oncoming traffic at night?",options:["It is only a courtesy, not a requirement","To avoid dazzling the other driver","To save fuel","It is only needed on motorways"],correct:1,explain:"Dipping your lights in good time prevents dazzling drivers coming the other way."},
{q:"You see another driver's dangerous manoeuvre nearly cause a collision. What should you do?",options:["Overtake them to show your disapproval","Follow closely to challenge them","Stay calm and, if appropriate, report the registration to the police","Flash your lights repeatedly"],correct:2,explain:"Reporting the details calmly lets the police act without you putting yourself at risk."},
{q:"What is the correct attitude towards other road users generally?",options:["Compete for road space whenever possible","Show patience and consideration at all times","Assume priority unless told otherwise","Drive as fast as conditions allow"],correct:1,explain:"Patience and consideration for others reduce risk for everyone on the road."},
{q:"You are stuck behind a slow-moving tractor on a single-track road with nowhere safe to overtake. What should you do?",options:["Overtake on a bend to save time","Stay back patiently until it's safe and legal to overtake","Drive close behind to pressure the driver","Sound your horn repeatedly"],correct:1,explain:"Patience is needed until a safe, legal opportunity to overtake appears."},
{q:"Why should you never use your horn aggressively towards pedestrians?",options:["It is only effective in queuing traffic","It can startle or confuse them, increasing risk","Pedestrians cannot hear horns","It is only illegal at night"],correct:1,explain:"Startling a pedestrian with your horn can make them react unpredictably, increasing danger."},
{q:"Another driver's dangerous driving frightens you and they stop to confront you. What should you do?",options:["Get out and argue with them","Stay in your locked car and call the police if you feel threatened","Drive away over the pavement","Apologise immediately regardless of fault"],correct:1,explain:"Staying in a locked vehicle and calling the police if threatened avoids putting yourself in further danger."},
]},
{id:"vehicle-safety",name:"Safety and Your Vehicle",
notes:[
"Tyres need at least 1.6mm of tread depth across the central three-quarters of the tyre, all the way round. Check pressures regularly, including the spare.",
"Before a long trip, check the basics: fuel, lights, oil, water, electrics and tyres (\"FLOWER\" is a common memory aid).",
"Excessive exhaust smoke, worn brakes or a dashboard warning light should all be checked before you carry on driving.",
"A head restraint adjusted close to your head and level with its top reduces the risk of whiplash injury in a collision.",
"Use a screenwash additive in the washer reservoir over winter so it doesn't freeze; working washers and wipers are both a legal and an MOT requirement.",
"A soft or sinking brake pedal usually means low brake fluid or air in the system; a grinding noise under braking often means the pads or discs are badly worn.",
"A catalytic converter reduces harmful exhaust emissions — never put leaded fuel into a car fitted with one, as it will permanently damage the converter.",
"Electric and hybrid vehicles are nearly silent at low speed. Their Acoustic Vehicle Alerting System (AVAS) helps pedestrians hear them, and the charging cable must be fully disconnected and stowed before you drive away.",
"The driver is legally responsible for making sure passengers under 14 are wearing a suitable seatbelt or child restraint; some medical conditions carry a valid seatbelt exemption certificate.",
"Mixing tyre types (radial and cross-ply, or different tread patterns) on the same axle can seriously affect handling and is best avoided.",
"A power steering or ABS warning light that stays on means a fault has developed — have it checked promptly, and expect the steering to feel heavier if power assistance has failed."
],
links:[
{label:"Highway Code: Annex 6 — Vehicle maintenance, safety and security",url:"https://www.gov.uk/guidance/the-highway-code/annex-6-vehicle-maintenance-safety-and-security"}
],
questions:[
{q:"What is the minimum legal tread depth for a car tyre in the UK?",options:["1.0mm","1.6mm across the central three-quarters, all the way round","2.5mm","There is no legal minimum"],correct:1,explain:"This is the legal minimum across the central three-quarters of the tread width, around the entire circumference."},
{q:"How do under-inflated tyres affect your car?",options:["They improve fuel economy","They increase stopping distance and tyre wear, and can affect handling","They have no real effect","They only affect the spare tyre"],correct:1,explain:"Correct pressure matters for grip, wear and how predictably the car handles."},
{q:"A warning light for low oil pressure comes on while driving. You should:",options:["Ignore it until the next service","Keep driving until you reach your destination","Stop as soon as safely possible and check","Turn the engine off while still moving"],correct:2,explain:"Continuing to drive with low oil pressure risks serious engine damage — stop safely and check."},
{q:"Why should a head restraint be adjusted close to the head and level with its top?",options:["It only matters for comfort","It reduces the risk of whiplash injury in a collision","It improves visibility","It has no safety purpose"],correct:1,explain:"A well-positioned head restraint limits how far your head snaps back in a rear-end shunt."},
{q:"What does thick blue or black smoke from the exhaust usually suggest?",options:["Normal cold-start behaviour, always","A mechanical problem that should be checked","The car needs more fuel","The tyres need checking"],correct:1,explain:"Persistent heavy smoke often points to an engine or emissions fault that needs attention."},
{q:"Which of these should you check before a long motorway journey?",options:["Only the fuel gauge","Fuel, oil, water, tyres and lights","Only tyre pressure","Nothing, if the car passed its last MOT"],correct:1,explain:"A full basic check reduces the chance of a breakdown far from help."},
{q:"Why is it illegal to drive with excessively worn brake pads?",options:["It isn't illegal if you drive carefully","Worn brakes significantly increase stopping distance and failure risk","It only matters at high speed","Only the handbrake needs to work"],correct:1,explain:"Worn brakes compromise your ability to stop safely in any situation."},
{q:"What's the effect of running tyres at the wrong pressure stated in your handbook?",options:["No real-world effect","Altered handling, uneven wear, and longer stopping distances","Improved grip in all conditions","Only affects the fuel gauge"],correct:1,explain:"Pressure affects the contact patch between tyre and road, which changes grip and wear."},
{q:"What is the main purpose of a catalytic converter?",options:["To reduce harmful exhaust emissions","To improve fuel economy","To increase engine power","To reduce engine noise"],correct:0,explain:"A catalytic converter changes harmful exhaust gases into less harmful ones before they leave the exhaust system."},
{q:"A poorly maintained engine that burns oil or runs inefficiently mainly increases:",options:["Tyre wear","Harmful exhaust emissions","Steering effort","Suspension noise"],correct:1,explain:"An engine that isn't running efficiently produces more pollutants, harming air quality."},
{q:"How can you check that your brake lights are working correctly?",options:["Listen for a clicking sound when braking","Check if the fuel gauge drops faster","Ask someone to check while you brake, or reverse near a reflective surface","Check if the handbrake feels tighter"],correct:2,explain:"You can't see your own brake lights from the driver's seat, so you need another person to check, or use a reflective surface such as a window."},
{q:"You notice one of your headlight bulbs has failed. You should:",options:["Only drive during the day until it's fixed","Get it replaced or repaired as soon as possible","Drive with full beam permanently to compensate","Ignore it, as one bulb is not important"],correct:1,explain:"Driving with a defective light reduces your visibility to others and should be fixed promptly."},
{q:"What should be added to your windscreen washer reservoir in cold winter weather?",options:["Engine oil","Brake fluid","A screen wash additive to prevent the water freezing","Extra antifreeze for the radiator"],correct:2,explain:"A screen wash additive lowers the freezing point of the washer fluid, stopping it freezing on the screen in cold weather."},
{q:"Your windscreen washers are empty and the wipers are smearing the screen. This is a problem because:",options:["It will reduce your fuel economy","It can obstruct your view and may cause an MOT failure","It will drain the car battery","It only affects the car's resale value"],correct:1,explain:"Clear vision through the windscreen is essential for safety, and working washers and wipers are checked as part of the MOT test."},
{q:"While driving, you notice the steering has suddenly become very heavy. This most likely means:",options:["The tyres are over-inflated","The power steering has failed","The clutch is slipping","The handbrake is partly on"],correct:1,explain:"A sudden increase in steering effort is a typical sign that the power steering system has stopped working."},
{q:"The brake pedal feels soft and sinks towards the floor when pressed. This could indicate:",options:["Low brake fluid or air in the braking system","The tyres need more air","The clutch needs adjusting","The exhaust is blocked"],correct:0,explain:"A spongy or sinking brake pedal often points to low fluid level or air trapped in the hydraulic system, reducing braking effectiveness."},
{q:"Why is it important to keep the correct level and mixture of antifreeze/coolant in your engine?",options:["It improves tyre grip","It helps prevent the engine overheating or freezing in cold weather","It reduces exhaust noise","It increases headlight brightness"],correct:1,explain:"Coolant stops the engine overheating in warm conditions and prevents it freezing and damaging the engine block in cold weather."},
{q:"What is the purpose of child locks fitted to the rear doors of a car?",options:["To stop the doors being opened from inside while travelling","To improve fuel economy","To reduce road noise inside the car","To prevent the boot from opening"],correct:0,explain:"Child locks prevent rear doors being opened from the inside, reducing the risk of a child accidentally opening a door while the vehicle is moving."},
{q:"Who is legally responsible for making sure a child under 14 is wearing a suitable seatbelt or restraint in a car?",options:["The child themselves","The driver","The front seat passenger","The local council"],correct:1,explain:"The driver is legally responsible for ensuring passengers under 14 are correctly restrained."},
{q:"A passenger has a valid medical exemption certificate for not wearing a seatbelt. What does this mean?",options:["They can never travel in a car","They're legally allowed to travel without wearing a seatbelt","They must sit in the front seat only","They must wear a seatbelt only on motorways"],correct:1,explain:"Certain medical conditions allow exemption from the seatbelt law, shown by a valid exemption certificate."},
{q:"Why must you never put leaded fuel into a vehicle fitted with a catalytic converter?",options:["It will void the car's insurance","It will permanently damage the catalytic converter","It will make the engine run too cold","It will cause the tyres to wear unevenly"],correct:1,explain:"Lead coats the catalyst inside the converter and stops it working, causing permanent damage."},
{q:"Why is it dangerous to fit a radial tyre and a cross-ply tyre to the same axle?",options:["It can seriously affect the car's handling","It will only affect the speedometer reading","It reduces fuel consumption","It is purely a cosmetic issue"],correct:0,explain:"Mixing tyre constructions on the same axle can make the car behave unpredictably, especially under braking or cornering."},
{q:"What should you consider if your tyres have different tread patterns fitted to the same axle?",options:["It has no effect on safety","It can affect grip and handling, so manufacturer guidance should be followed","It is a legal requirement","It improves braking performance"],correct:1,explain:"Tyres with different tread patterns can grip differently, so manufacturer guidance should be followed to keep handling predictable."},
{q:"Your car keeps pulling to one side when driving in a straight line with no steering input. This is most likely caused by:",options:["A fuel system fault","Incorrect wheel alignment","A faulty horn","Worn wiper blades"],correct:1,explain:"Wheels that are out of alignment can cause the car to pull to one side even when the steering wheel is held straight."},
{q:"You notice one tyre is wearing unevenly on just one edge. This could be a sign of:",options:["Incorrect wheel alignment","Too much fuel in the tank","A faulty indicator","Worn wiper blades"],correct:0,explain:"Uneven wear concentrated on one edge of the tyre is a common symptom of incorrect wheel alignment or suspension geometry."},
{q:"You hear a grinding metallic noise whenever you apply the brakes. This most likely means:",options:["The brake pads or discs are badly worn","The tyres are overinflated","The exhaust has a small leak","The washer fluid is low"],correct:0,explain:"A grinding noise when braking usually means the friction material has worn away, letting metal contact metal."},
{q:"A high-pitched squeal happens only when you press the brake pedal, and stops when you release it. What is this most likely to be?",options:["A worn clutch","A brake pad wear indicator warning you the pads need attention","A faulty alternator","A tyre puncture"],correct:1,explain:"Many brake pads have a built-in wear indicator that deliberately squeals to warn the driver the pads are due for replacement."},
{q:"Why can electric vehicles pose a particular risk to pedestrians and cyclists at low speed?",options:["They accelerate more slowly than other vehicles","They are much quieter, so people may not hear them approaching","They are always driven faster than petrol cars","They have fewer mirrors fitted"],correct:1,explain:"Electric vehicles produce very little engine noise, so pedestrians and cyclists may not notice them approaching at low speed."},
{q:"Before driving away after charging an electric vehicle, you should always:",options:["Leave the charging cable connected","Make sure the charging cable is fully disconnected and stowed safely","Charge the battery to exactly 50%","Switch off the vehicle's lights"],correct:1,explain:"Driving away with the charging cable still connected can damage the cable or charge point and creates a hazard for others."},
{q:"What is the purpose of the Acoustic Vehicle Alerting System (AVAS) fitted to many electric and hybrid vehicles?",options:["To improve the car's fuel economy","To make an audible sound at low speed so pedestrians can hear it approaching","To warn the driver about low tyre pressure","To alert the driver when the battery is fully charged"],correct:1,explain:"AVAS emits an artificial sound at low speeds to compensate for the near-silence of electric and hybrid vehicles, helping pedestrians hear them."},
{q:"Driving with tyre tread close to the legal minimum in heavy rain increases the risk of:",options:["Aquaplaning and reduced grip","The engine overheating","The exhaust becoming blocked","The battery discharging faster"],correct:0,explain:"Worn tread can't clear water from the road surface as effectively, increasing the risk of losing contact with the road."},
{q:"Your exhaust system has become excessively noisy. Why is this a problem?",options:["It only affects fuel economy","It is likely to be illegal and causes unnecessary noise pollution","It improves engine performance","It has no legal implications"],correct:1,explain:"A vehicle must not emit excessive noise; a defective or modified exhaust that is too loud can fail the MOT or breach the law."},
{q:"How often should you check your engine oil level?",options:["Only when the engine warning light comes on","Regularly, such as weekly or before a long journey","Only once a year at the MOT","Only after a service"],correct:1,explain:"Checking the oil level regularly, including before long journeys, helps spot a developing problem before it causes engine damage."},
{q:"If your engine's coolant level is allowed to run low, what is the main risk?",options:["The brakes will fail immediately","The engine may overheat and suffer serious damage","The tyres will deflate","The headlights will dim"],correct:1,explain:"Coolant carries heat away from the engine; too little coolant can let the engine overheat and become damaged."},
{q:"You feel a vibration through the steering wheel that increases with speed. This is most likely caused by:",options:["A wheel that is out of balance","The washer fluid being empty","A faulty horn","The handbrake being left on slightly"],correct:0,explain:"An out-of-balance wheel typically causes vibration that gets worse as road speed increases."},
{q:"The ABS warning light stays on after starting the engine. What does this most likely mean?",options:["The anti-lock braking system has developed a fault","The car has no oil","The tyres need to be replaced","The fuel tank is nearly empty"],correct:0,explain:"An ABS light that stays on usually indicates a fault with the anti-lock braking system, though the normal brakes should still work."},
{q:"The power steering warning light comes on while you're driving. What should you do?",options:["Ignore it, as it will reset itself","Continue your journey at high speed as normal","Have it checked as soon as possible, being aware the steering may feel heavier","Turn off the engine immediately on the motorway"],correct:2,explain:"A power steering fault can make the steering noticeably heavier, so it should be checked promptly and driven with care in the meantime."},
{q:"Why are working windscreen washers and wipers a legal requirement in the UK?",options:["They are only needed to pass the driving test","They help keep the windscreen clear so you can see and be seen clearly","They are required only for vehicles over 10 years old","They are optional extras"],correct:1,explain:"A clear view through the windscreen is essential for safe driving, so functioning washers and wipers are a legal and MOT requirement."},
{q:"When is it most important to use the child locks fitted to rear doors?",options:["Only on motorways","Whenever children are travelling in the rear seats","Only when reversing","Only during journeys over an hour"],correct:1,explain:"Child locks should be used whenever children travel in the back, to stop them accidentally opening a door while the vehicle is moving."},
{q:"Before setting off on a long journey, why should you check your spare wheel or tyre repair kit?",options:["So it looks tidy in the boot","So you're prepared if you get a puncture a long way from help","It must be checked by a passenger","It affects the car's insurance premium"],correct:1,explain:"Checking the spare wheel or repair kit in advance ensures you can deal with a puncture safely, especially somewhere help isn't nearby."},
]},
{id:"safety-margins",name:"Safety Margins",
notes:[
"The \"two-second rule\" is the minimum gap to the vehicle in front in good, dry conditions. Double it to at least four seconds in the wet, and leave far more — up to ten times the normal gap — on ice.",
"Highway Code stopping distances (thinking + braking, in good dry conditions): 30mph ≈ 23m, 40mph ≈ 36m, 50mph ≈ 53m, 60mph ≈ 73m, 70mph ≈ 96m. Braking distance grows much faster than speed — doubling your speed much more than doubles your braking distance.",
"Aquaplaning — losing grip when water builds up under the tyres — is more likely at higher speeds in heavy rain. Ease off the accelerator and avoid sharp braking or steering if it happens.",
"Speed, road surface, tyre condition and your own reaction time all combine to determine how far your car actually travels before stopping.",
"Mud, wet fallen leaves, loose chippings and road camber on a bend can all reduce available grip — slow down in good time rather than reacting once you're already on the slippery patch.",
"Carrying extra passengers, a loaded boot, a roof box or a trailer all increase your stopping distance because of the extra weight.",
"Complete most of your braking before a bend, not during it — braking while turning can upset the car's balance and reduce grip.",
"If your car is fitted with ABS, apply firm, continuous pressure in an emergency stop rather than pumping the pedal — ABS lets you keep some steering control while braking hard.",
"If you start to skid, ease off the accelerator or brake and steer gently in the direction you want the car to go — sudden braking or steering usually makes a skid worse.",
"Leave extra distance behind large vehicles, since they block your view of hazards developing further ahead, and behind high-sided vehicles or two-wheeled road users in strong winds."
],
links:[
{label:"Highway Code: General rules — stopping distances (103–158)",url:"https://www.gov.uk/guidance/the-highway-code/general-rules-techniques-and-advice-for-all-drivers-and-riders-103-to-158"},
{label:"Highway Code: Driving in adverse weather conditions (226–237)",url:"https://www.gov.uk/guidance/the-highway-code/driving-in-adverse-weather-conditions-226-to-237"}
],
questions:[
{q:"In good, dry conditions, what's the minimum following gap you should leave?",options:["One second","Two seconds","Five seconds","There's no need for a gap below 40mph"],correct:1,explain:"The two-second rule gives a basic safety margin in normal dry conditions."},
{q:"What following gap is recommended in wet conditions?",options:["The same two-second gap","At least double the dry gap — about four seconds","Half the normal gap","No change is needed"],correct:1,explain:"Wet roads reduce tyre grip, so braking takes longer and the gap should grow accordingly."},
{q:"The overall stopping distance at 30mph is approximately:",options:["12 metres","23 metres","50 metres","96 metres"],correct:1,explain:"About 9m thinking distance plus 14m braking distance, in good conditions."},
{q:"You feel the steering go light in heavy rain at speed. This is most likely:",options:["A puncture","Aquaplaning — ease off the accelerator and don't brake hard","Normal at any speed","A sign to brake hard immediately"],correct:1,explain:"A film of water lifts the tyres off the road surface — easing off lets grip return."},
{q:"On an icy road, how much longer should your stopping distance allowance be compared with a dry road?",options:["The same","About double","Up to ten times longer","Stopping distance doesn't matter on ice"],correct:2,explain:"Ice drastically reduces grip, so braking distance can multiply far beyond wet-road figures."},
{q:"What mainly happens to braking distance as speed increases?",options:["It increases in direct proportion to speed","It increases much faster than speed increases","It decreases at higher speed","Speed has no effect on braking distance"],correct:1,explain:"Braking distance grows roughly with the square of speed — doubling speed much more than doubles it."},
{q:"Which of these reduces your safety margin the most on a motorway?",options:["Driving too close to the vehicle in front","Checking mirrors regularly","Signalling early","Keeping to the speed limit"],correct:0,explain:"A short following distance removes the time you need to react to sudden braking ahead."},
{q:"Your tyres are worn close to the legal limit. What happens to your stopping distance in the wet?",options:["It stays the same","It increases significantly due to reduced grip","It decreases","Tread depth doesn't affect wet grip"],correct:1,explain:"Tread channels water away from the contact patch — less tread means less grip and longer stopping distances."},
{q:"According to the Highway Code's stopping distance figures, what is the typical overall stopping distance at 40mph?",options:["23 metres","36 metres","53 metres","73 metres"],correct:1,explain:"At 40mph the combined thinking (about 12m) and braking (about 24m) distances add up to roughly 36 metres."},
{q:"What is the approximate overall stopping distance at 50mph according to the Highway Code?",options:["36 metres","53 metres","73 metres","96 metres"],correct:1,explain:"At 50mph thinking distance (about 15m) plus braking distance (about 38m) gives roughly 53 metres in total."},
{q:"What is the approximate overall stopping distance at 60mph according to the Highway Code?",options:["53 metres","73 metres","96 metres","120 metres"],correct:1,explain:"At 60mph the figures are roughly 18m thinking plus 55m braking, totalling about 73 metres."},
{q:"In the Highway Code's stopping distance figures, what is the thinking distance alone at 70mph?",options:["15 metres","18 metres","21 metres","24 metres"],correct:2,explain:"Thinking distance rises in direct proportion to speed, and at 70mph it is taken to be about 21 metres before the brakes are even applied."},
{q:"At 30mph, which part of your overall stopping distance is normally the longer one?",options:["Thinking distance","Braking distance","They are always equal","It depends only on the tyre brand"],correct:1,explain:"Braking distance grows with the square of speed, so even at modest speeds it quickly outstrips the roughly constant thinking distance."},
{q:"What is 'road camber' and why does it matter to your safety margin?",options:["A slope built into the road surface for drainage, which can affect grip and steering on bends","The painted centre line marking on a road","A type of raised kerb at junctions","The legal minimum tyre tread pattern"],correct:0,explain:"Camber tilts the road surface to drain water away, but on bends it can alter how your tyres grip, so it affects the margin you should allow."},
{q:"Driving in fog, how should you normally adjust your following distance?",options:["Increase it well beyond the normal gap, since visibility and braking cues are reduced","Reduce it so you can keep the car in front's lights in view","Keep exactly the same two-second gap as in clear weather","Close right up and follow the vehicle in front's tail lights"],correct:0,explain:"Fog hides hazards and the reactions of vehicles ahead, so you need a much bigger margin to react safely to anything sudden."},
{q:"You turn onto a loose gravel farm track. How does this affect your stopping distance?",options:["It has no effect, tyres grip loose gravel the same as tarmac","It increases considerably because loose surfaces reduce tyre grip","It decreases because gravel adds extra friction","It only matters when driving uphill"],correct:1,explain:"Loose stones under the tyres reduce the contact and grip available, so you need a much greater margin and should slow down in good time."},
{q:"Driving along a country road covered in wet fallen autumn leaves, you should:",options:["Treat the surface as being nearly as slippery as ice and slow down","Brake harder than normal to clear leaves from the road","Ignore it, as leaves have no effect on grip","Speed up slightly to pass over the leaves quickly"],correct:0,explain:"Wet leaves form a slick film over the road surface that can be almost as slippery as ice, so extra caution and a bigger margin are needed."},
{q:"Approaching a field entrance where tractors have left mud across the road, what should you do?",options:["Maintain your normal speed, as mud does not reduce grip","Slow down and increase your safety margin, since mud reduces tyre grip","Brake hard just as you reach the mud","Swerve onto the verge regardless of other traffic"],correct:1,explain:"Mud on the road surface significantly reduces the grip available to your tyres, so reducing speed in advance keeps your stopping distance manageable."},
{q:"Carrying extra passengers and a fully loaded boot mainly affects your safety margin by:",options:["Increasing stopping distance because of the greater vehicle weight","Decreasing stopping distance due to extra tyre contact pressure","Having no real effect on stopping distance","Reducing your thinking distance"],correct:0,explain:"A heavier, more loaded vehicle has greater momentum, so it takes longer to slow down and stop, lengthening your required margin."},
{q:"When towing a caravan or trailer, your overall stopping distance:",options:["Stays exactly the same as without the trailer","Generally increases because of the added weight and length","Always decreases due to the trailer's own brakes","Is only affected when driving on motorways"],correct:1,explain:"The extra mass and length behind the car typically mean more distance is needed to bring the combination safely to a stop."},
{q:"In strong crosswinds, which road users are most vulnerable and need extra room when you pass or overtake them?",options:["Motorcyclists, cyclists and high-sided vehicles","Only lorries carrying heavy loads","Only cars fitted with roof boxes","No road user needs extra room in wind"],correct:0,explain:"Gusts can suddenly push lighter or taller vehicles sideways, so giving them extra clearance reduces the risk of a collision."},
{q:"What clearance does the Highway Code recommend as a minimum when overtaking a cyclist at speeds up to 30mph?",options:["About 0.5 metres","About 1 metre","About 1.5 metres","About 3 metres"],correct:2,explain:"Leaving around 1.5 metres gives the cyclist room to wobble or avoid debris without being struck."},
{q:"Driving along a road lined with parked cars close to the kerb, what should you do to maintain a safety margin?",options:["Hug the kerb tightly to save road space","Leave enough room in case a car door opens or someone steps out","Speed up so you pass each car quickly","Drive along the opposite kerb instead"],correct:1,explain:"A gap allows you time to react if a door opens suddenly or a pedestrian emerges from between parked vehicles."},
{q:"Which tyre-related factor most helps prevent aquaplaning in heavy rain?",options:["Having adequate tread depth to disperse water","Fitting a larger wheel diameter","Choosing a darker tyre colour","Running tyre pressures higher than recommended"],correct:0,explain:"Tread grooves channel water away from the contact patch, so sufficient tread depth keeps the tyre in touch with the road surface."},
{q:"Under-inflated tyres affect your stopping distance by:",options:["Shortening it due to a larger contact patch","Lengthening it because grip and control are reduced","Having no measurable effect at all","Only affecting fuel economy, not braking"],correct:1,explain:"Incorrect tyre pressure changes how the tread meets the road, reducing grip and increasing the distance needed to stop safely."},
{q:"Driving down a long, steep hill, your stopping distance will tend to:",options:["Decrease because gravity helps you stop","Increase, so you should select a lower gear and brake in good time","Stay exactly the same as on level ground","Only change if you are towing a trailer"],correct:1,explain:"Gravity adds to the vehicle's momentum on a descent, so more distance and a lower gear are needed to control speed safely."},
{q:"Why should you leave extra distance when following a large lorry or bus?",options:["Simply as a courtesy to the driver ahead","Because it blocks your view of the road ahead and you need more time to react to hazards","Because large vehicles reverse without warning on the road","There is no need for any extra distance behind large vehicles"],correct:1,explain:"A bigger vehicle obstructs your view of hazards developing further ahead, so a larger gap gives you more time to respond."},
{q:"Driving at night, judging a safe following distance is often harder mainly because:",options:["Stopping distances are physically longer in darkness","Reduced visibility makes it harder to judge gaps and spot hazards early","Headlights increase your braking distance","Tyres grip less well simply because it is dark"],correct:1,explain:"The physics of stopping does not change at night, but poor visibility makes it harder to judge distances and react in good time."},
{q:"What is the safest general technique for dealing with a bend in the road?",options:["Brake while steering through the bend itself","Complete most of your braking before the bend, then steer smoothly through it","Accelerate hard as you enter the bend","Only brake after you have exited the bend"],correct:1,explain:"Braking while turning can upset the car's balance and reduce grip, so slowing beforehand keeps more control available through the bend."},
{q:"How can you check that you are leaving a two-second gap from the vehicle ahead?",options:["Count the seconds from when the vehicle ahead passes a fixed point to when you reach it","Estimate the gap only in car lengths","Rely solely on your speedometer reading","Start counting only after you have already passed the fixed point"],correct:0,explain:"Timing the interval between a fixed roadside point gives a reliable, speed-independent way to judge your following gap."},
{q:"You are in slow-moving queued traffic on a dual carriageway. Why is it still important to leave a gap to the vehicle in front?",options:["To allow room to stop safely and to leave space for emergency vehicles to pass","So that you can overtake the vehicle ahead whenever possible","To let other drivers merge in front of you only","There is no need, as speeds are too low for a gap to matter"],correct:0,explain:"Even at low speeds a gap prevents shunts if traffic stops suddenly and can allow emergency vehicles to filter through."},
{q:"When using front and rear fog lights in foggy conditions, what must you remember?",options:["Leave them on permanently once they are switched on","Switch them off as soon as visibility improves, as they can dazzle other drivers","Only ever use the rear fog lights, never the front ones","Use them instead of dipped headlights in clear weather"],correct:1,explain:"Fog lights are very bright and can dazzle others once visibility returns to normal, so they must be turned off promptly."},
{q:"What does 'tailgating' mean, and why does it reduce your safety margin?",options:["Driving too close to the vehicle in front, leaving too little room to stop","Towing a trailer behind your car","Driving with the boot or tailgate left open","Reversing into a parking space"],correct:0,explain:"Following too closely removes the time and space you would otherwise have to react if the vehicle ahead brakes suddenly."},
{q:"If your car is fitted with ABS and you need to brake hard in an emergency, what should you do?",options:["Pump the brake pedal rapidly yourself","Apply firm, continuous pressure to the brake pedal and let the system work","Press the clutch first, then brake gently","Avoid using the brakes and steer around the hazard instead"],correct:1,explain:"ABS automatically modulates braking pressure to prevent wheel lock-up, so pumping the pedal yourself only interferes with it."},
{q:"If your car begins to skid, what is the correct initial response?",options:["Brake hard immediately to stop the skid","Ease off the accelerator or brake and steer gently in the direction you want to go","Accelerate to try to regain traction","Pull the handbrake on sharply"],correct:1,explain:"Sudden braking or steering during a skid can make the loss of control worse, whereas easing off and steering gently helps the tyres regain grip."},
{q:"A car with worn brake pads or a poorly maintained braking system will generally:",options:["Stop in a shorter distance than normal","Have an increased stopping distance, so you need a bigger safety margin","Only be affected when driving on motorways","Automatically be compensated for by ABS regardless of wear"],correct:1,explain:"Worn or poorly maintained brakes are less effective at converting pedal pressure into stopping force, lengthening the distance needed to stop."},
